<style>
:root{--wa:#25d366;--primary:#1e5af9;--secondary:#ff3b30;--tertiary:#ffcc00;--bg:#fcf9f8;--surface:#fff;--ink:#171c20;--outline:#000;--primary-soft:#d6e2ff;--gray-soft:#dfe3e8;--green:#10b981;--amber-soft:#fef3c7;--shadow-sm:4px 4px 0 0 #000;--font-display:'Bagel Fat One',system-ui,sans-serif;--font-body:'IBM Plex Sans',system-ui,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}.mono{font-family:var(--font-mono)}
.header{background:var(--bg);border-bottom:2px solid var(--outline);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:60px}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{position:relative;width:92px;height:30px;display:block}.brand-logo .l{position:absolute;inset:0;-webkit-mask:url(/logo.png) left center/contain no-repeat;mask:url(/logo.png) left center/contain no-repeat;background:var(--ink)}
.brand-txt .cli{font-weight:700;font-size:14px}.brand-txt .mod{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.6}
.header-info{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn-ico{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:2px solid var(--outline);border-radius:999px;background:var(--surface);font-weight:600;font-size:13px;box-shadow:var(--shadow-sm)}
.btn-ico.primary{background:var(--primary);color:#fff}
.tabs{display:flex;gap:8px;padding:10px 16px;background:var(--primary-soft);border-bottom:2px solid var(--outline)}
.tab{padding:8px 16px;border:2px solid var(--outline);border-radius:999px;background:var(--surface);font-weight:600;font-size:13px;box-shadow:var(--shadow-sm);cursor:pointer}.tab.active{background:var(--ink);color:var(--bg)}
.main{flex:1;overflow-y:auto;padding:16px;max-width:900px;margin:0 auto;width:100%}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.select,.input{padding:9px 12px;border:2px solid var(--outline);border-radius:10px;background:var(--surface);font-family:var(--font-body);font-size:14px;box-shadow:var(--shadow-sm);width:100%}
.field-lbl{font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin-bottom:6px;display:block}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--outline);border-radius:14px;box-shadow:var(--shadow-sm);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.row:active{transform:translate(2px,2px);box-shadow:none}
.av{width:42px;height:42px;border-radius:50%;border:2px solid var(--outline);background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.row .info{flex:1;min-width:0}.row .info h3{font-size:15px;font-weight:700}.row .info .meta{font-family:var(--font-mono);font-size:11px;opacity:.7;display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.tagx{font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:2px solid var(--outline)}
.tagx.sa{background:var(--secondary);color:#fff}.tagx.adm{background:var(--primary);color:#fff}.tagx.op{background:var(--gray-soft)}
.sendbtn{flex-shrink:0;width:40px;height:40px;border:2px solid var(--outline);border-radius:50%;background:var(--tertiary);display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 0 #000;cursor:pointer}.sendbtn:active{transform:translate(2px,2px);box-shadow:none}.sendbtn .material-symbols-outlined{font-size:19px}
.pdfbtn{flex-shrink:0;width:40px;height:40px;border:2px solid var(--outline);border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 0 #000;cursor:pointer}.pdfbtn:active{transform:translate(2px,2px);box-shadow:none}.pdfbtn .material-symbols-outlined{font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:6px 12px;border:2px solid var(--outline);border-radius:999px;background:var(--surface);font-size:12px;font-weight:600;box-shadow:2px 2px 0 0 #000;cursor:pointer}.chip.active{background:var(--ink);color:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border:2px solid var(--outline);border-radius:14px;font-weight:600;font-size:14px;background:var(--surface);box-shadow:var(--shadow-sm);width:100%;min-height:48px}
.btn.primary{background:var(--primary);color:#fff}.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.permrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--gray-soft)}.permrow .nm{font-weight:600;font-size:14px}
.permrow select{width:130px}
.pmx-wrap{overflow:auto;border:2px solid var(--outline);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm);max-height:calc(100vh - 210px)}
.pmx{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.pmx th,.pmx td{border-bottom:1px solid var(--gray-soft);border-right:1px solid var(--gray-soft);padding:6px 8px;text-align:center;background:var(--surface)}
.pmx thead th{position:sticky;top:0;z-index:2;background:var(--primary-soft);font-size:11px;font-weight:700;white-space:nowrap;border-bottom:2px solid var(--outline)}
.pmx thead th.vt{writing-mode:vertical-rl;transform:rotate(180deg);height:118px;padding:8px 4px;text-align:left}
.pmx th.nm,.pmx td.nm{position:sticky;left:0;z-index:1;text-align:left;min-width:190px;border-right:2px solid var(--outline)}
.pmx thead th.nm{z-index:3}
.pmx td.nm b{display:block;font-size:13px}.pmx td.nm span{font-family:var(--font-mono);font-size:10.5px;opacity:.6}
.pmx input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary);cursor:pointer}
.pmx input[type=checkbox]:disabled{cursor:not-allowed;opacity:.55}
.pmx .off{opacity:.45}
.pmx td.lv{font-family:var(--font-mono);font-size:9.5px;opacity:.6;display:block;margin-top:2px}
.empty{text-align:center;padding:40px;font-family:var(--font-mono);font-size:12px;opacity:.55}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--surface);border-top:3px solid var(--outline);border-radius:24px 24px 0 0;box-shadow:0 -10px 0 0 var(--outline);transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);max-height:92vh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.sheet.open{transform:translateY(0)}.sheet-handle{width:48px;height:5px;background:var(--outline);border-radius:999px;margin:12px auto 8px;opacity:.3}
.sheet-head{padding:6px 22px 12px;border-bottom:2px solid var(--outline);display:flex;justify-content:space-between;align-items:center}.sheet-head h2{font-family:var(--font-display);font-size:21px}
.sheet-close{width:38px;height:38px;border:2px solid var(--outline);border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 0 #000}
.sheet-body{padding:16px 22px 26px;overflow-y:auto}.sheet-section+.sheet-section{margin-top:14px}
.toast{position:fixed;top:70px;right:16px;z-index:200;background:var(--ink);color:#fff;border:2px solid var(--outline);border-radius:12px;padding:11px 16px;font-weight:600;box-shadow:var(--shadow-sm)}
.boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:300;transition:opacity .3s}.boot.gone{opacity:0;pointer-events:none}.boot .l{width:200px;height:60px;-webkit-mask:url(/logo.png) center/contain no-repeat;mask:url(/logo.png) center/contain no-repeat;background:var(--ink)}
</style>
</head>
<body>
<div id="boot" class="boot"><div class="l"></div></div>
<header class="header">
  <div class="brand"><a href="/" class="brand-logo"><span class="l"></span></a><div class="brand-txt"><div class="cli"></div><div class="mod">Usuarios</div></div></div>
  <div class="header-info"><a class="btn-ico" href="/prep" title="Consola Prep"><span class="material-symbols-outlined">tune</span></a><button class="btn-ico primary" id="h-add"><span class="material-symbols-outlined">add</span><span id="addl">Usuario</span></button></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main class="main" id="screen"></main>
<div class="backdrop" id="backdrop"></div>
<aside class="sheet" id="sheet"><div class="sheet-handle"></div><div class="sheet-head"><h2 id="sheet-title">—</h2><button class="sheet-close" id="sheet-close"><span class="material-symbols-outlined">close</span></button></div><div class="sheet-body" id="sheet-body"></div></aside>
<script>
const SB_URL='https://jmkvphayyhwzootlybde.supabase.co',SB_KEY='sb_publishable_0-znERv1Ok0Dw-Re44eksw_QAOqDc8M';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const MODS=[['pase','Pase'],['pos','POS'],['linea','Línea/KDS'],['bienvenida','Bienvenida'],['mercado','Mercado'],['recetas','Recetas'],['carta','Carta QR'],['rrhh','RRHH'],['asistencia','Asistencia'],['delivery','Delivery'],['contabilidad','Finanzas'],['vuelto','Vuelto'],['libro','El Libro'],['directorio','Directorio'],['engagement','Engagement'],['mystery','Voz del Cliente'],['prediccion','Predicción']];
const NIVELES=['ninguno','ver','operar','aprobar','admin'];
// Formatos de El Libro que se pueden abrir o cerrar por rol. Vacío = el rol ve todos.
const FORMATOS=[['tablon','Tablón'],['equipo','Equipo'],['procedimientos','Procedimientos'],['recetario','Recetario'],['plantillas','Plantillas'],['cursos','Cursos'],['examenes','Exámenes'],['briefing','Briefing diario'],['checklists','Checklists'],['eventualidades','Eventualidades'],['calendario','Calendario'],['thetalk','The Talk'],['politicas','Políticas'],['bitacora','Bitácora'],['jefeservicio','Jefe de Servicio']];
const ROLSIS=[['superadmin','Super Admin (Prep)'],['admin_marca','Admin restaurante'],['gerente','Gerente'],['operativo','Operativo']];
const state={usuarios:[],roles:[],marcas:[],locales:[],emp:[],view:'usuarios'};
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .3s';setTimeout(()=>e.remove(),300)},2200)}
function openSheet(){$('#backdrop').classList.add('open');$('#sheet').classList.add('open')}
function closeSheet(){$('#backdrop').classList.remove('open');$('#sheet').classList.remove('open')}
function ini(n){return (n||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function marcaNom(id){const m=state.marcas.find(x=>x.id===id);return m?m.nombre:(id||'—')}
function rolNom(id){const r=state.roles.find(x=>x.id===id);return r?r.nombre:null}

async function guard(){
  let sess=null;try{sess=(await sb.auth.getSession()).data.session;}catch(e){}
  if(sess&&sess.user){const me=(await sb.from('prep_usuarios').select('rol_sistema').eq('email',sess.user.email).maybeSingle()).data;
    if(me&&!['superadmin','admin_marca','gerente'].includes(me.rol_sistema)){alert('No tienes permiso para gestionar usuarios.');location.href='/';return false}}
  return true;
}
async function load(){
  if(!(await guard()))return;
  const[us,ro,ma,lo,em,mm]=await Promise.all([
    sb.from('prep_usuarios').select('*').order('created_at'),
    sb.from('prep_roles').select('*').order('nombre'),
    sb.from('inv_marcas').select('*').order('id'),
    sb.from('inv_locales').select('*').order('orden',{nullsFirst:false}).order('id'),
    sb.from('rrhh_empleados').select('id,nombre,apellidos,local_id,telefono'),
    sb.from('prep_marca_modulos').select('marca_id,modulo,activo')
  ]);
  state.usuarios=us.data||[];state.roles=ro.data||[];state.marcas=ma.data||[];state.locales=lo.data||[];state.emp=em.data||[];state.mm=mm.data||[];
  render();$('#boot').classList.add('gone');
}
function render(){
  $('#tabs').innerHTML=[['usuarios','Usuarios','group'],['roles','Roles & permisos','admin_panel_settings']].map(([k,l,i])=>`<button class="tab ${state.view===k?'active':''}" data-v="${k}">${l}</button>`).join('');
  $$('#tabs .tab').forEach(b=>b.onclick=()=>{state.view=b.dataset.v;if(state.view==='roles'&&!state.fMarca){const m=state.marcas.find(m=>state.usuarios.some(u=>u.marca_id===m.id));state.fMarca=m?m.id:'';}render()});
  if(state.view==='usuarios'||state.view==='roles')$('#tabs').insertAdjacentHTML('beforeend',`<select class="select" id="f-marca" style="margin-left:auto;max-width:240px"><option value="">Todos los restaurantes</option>${state.marcas.map(m=>`<option value="${m.id}" ${state.fMarca===m.id?'selected':''}>${m.nombre}</option>`).join('')}</select>`);
  if($('#f-marca'))$('#f-marca').onchange=e=>{state.fMarca=e.target.value;state.view==='roles'?renderPermisos():renderUsuarios()};
  $('#addl').textContent=state.view==='roles'?'Rol':'Usuario';
  if(state.view==='usuarios')renderUsuarios();else renderPermisos();
}
/* Módulos de una persona: los suyos propios (prep_usuarios.permisos) o, si no tiene, los de su rol. */
function permisosDe(u){if(u.permisos&&typeof u.permisos==='object')return u.permisos;const r=state.roles.find(x=>x.id===u.rol_id);return (r&&r.permisos)||{}}
function enPlan(marca,k){const rows=(state.mm||[]).filter(x=>x.marca_id===marca);if(!rows.length)return true;return rows.some(x=>x.modulo===k&&x.activo)}
function resumenMods(u){
  if(u.rol_sistema==='superadmin')return'todo';
  if(u.rol_sistema!=='operativo')return'todos los de su restaurante';
  const p=permisosDe(u);const n=MODS.filter(([k])=>p[k]&&p[k]!=='ninguno').length;
  return n+' módulo'+(n===1?'':'s')+(u.permisos?' · propios':'');
}
function renderUsuarios(){
  const lista=state.fMarca?state.usuarios.filter(u=>u.marca_id===state.fMarca):state.usuarios;
  $('#screen').innerHTML=lista.map(u=>{const cls=u.rol_sistema==='superadmin'?'sa':u.rol_sistema==='admin_marca'?'adm':'op';
    return `<div class="row" data-id="${u.id}"><div class="av">${ini(u.nombre)}</div><div class="info"><h3>${u.nombre||'—'} ${u.activo?'':'<span class="tagx op">inactivo</span>'}</h3><div class="meta"><span>${u.email||''}</span><span>${u.marca_id?marcaNom(u.marca_id):'todas las marcas'}</span>${u.rol_id?`<span>${rolNom(u.rol_id)||''}</span>`:''}<span>${resumenMods(u)}</span></div></div>${u.email?`<button class="pdfbtn" data-wa="${u.id}" title="Compartir acceso por WhatsApp"><span class="material-symbols-outlined">chat</span></button><button class="pdfbtn" data-pdf="${u.id}" title="Descargar acceso en PDF"><span class="material-symbols-outlined">picture_as_pdf</span></button><button class="sendbtn" data-send="${u.id}" title="Enviar acceso por correo"><span class="material-symbols-outlined">forward_to_inbox</span></button>`:''}<span class="tagx ${cls}">${ROLSIS.find(r=>r[0]===u.rol_sistema)?.[1]||u.rol_sistema}</span></div>`;
  }).join('')||'<div class="empty">Sin usuarios</div>';
  $$('#screen .row').forEach(r=>r.onclick=()=>editarUsuario(state.usuarios.find(u=>u.id===r.dataset.id)));
  $$('#screen .sendbtn').forEach(b=>b.onclick=e=>{e.stopPropagation();enviarAcceso(state.usuarios.find(u=>u.id===b.dataset.send))});
  $$('#screen .pdfbtn[data-pdf]').forEach(b=>b.onclick=e=>{e.stopPropagation();descargarAccesoPDF(state.usuarios.find(u=>u.id===b.dataset.pdf))});
  $$('#screen .pdfbtn[data-wa]').forEach(b=>b.onclick=e=>{e.stopPropagation();accesoPorWA(state.usuarios.find(u=>u.id===b.dataset.wa))});
}
function editarUsuario(u){
  const ed=!!u;const c=Object.assign({nombre:'',email:'',rol_sistema:'operativo',marca_id:state.fMarca||'m6',local_id:'',rol_id:null,empleado_id:null,activo:true,permisos:null},JSON.parse(JSON.stringify(u||{})));
  $('#sheet-title').textContent=ed?'Editar usuario':'Nuevo usuario';
  const harvestU=()=>{if($('#u-nom'))c.nombre=$('#u-nom').value;if($('#u-email'))c.email=$('#u-email').value;};
  const draw=()=>{
    const rolesM=state.roles.filter(r=>r.marca_id===c.marca_id);
    const empsL=state.emp.filter(e=>e.local_id===c.local_id);
    $('#sheet-body').innerHTML=`
      <div class="sheet-section grid2"><div><div class="field-lbl">Nombre</div><input class="input" id="u-nom" value="${(c.nombre||'').replace(/"/g,'&quot;')}"></div><div><div class="field-lbl">Email</div><input class="input" id="u-email" value="${c.email||''}"></div></div>
      <div class="sheet-section"><div class="field-lbl">Rol del sistema</div><div class="chips" id="u-rs">${ROLSIS.map(r=>`<button class="chip ${c.rol_sistema===r[0]?'active':''}" data-r="${r[0]}">${r[1]}</button>`).join('')}</div></div>
      ${c.rol_sistema!=='superadmin'?`<div class="sheet-section grid2"><div><div class="field-lbl">Marca</div><select class="select" id="u-marca">${state.marcas.map(m=>`<option value="${m.id}" ${c.marca_id===m.id?'selected':''}>${m.nombre}</option>`).join('')}</select></div><div><div class="field-lbl">Local</div><select class="select" id="u-local"><option value="">— todos —</option>${state.locales.filter(l=>l.marca_id===c.marca_id).map(l=>`<option value="${l.id}" ${c.local_id===l.id?'selected':''}>${l.nombre}</option>`).join('')}</select></div></div>`:''}
      ${c.rol_sistema==='operativo'?`<div class="sheet-section"><div class="field-lbl">Rol (opcional)</div><select class="select" id="u-rol"><option value="">— sin rol —</option>${rolesM.map(r=>`<option value="${r.id}" ${c.rol_id===r.id?'selected':''}>${r.nombre}</option>`).join('')}</select></div>
      <div class="sheet-section"><div class="field-lbl">Módulos a los que entra</div>
        <div style="font-family:var(--font-mono);font-size:10.5px;opacity:.65;margin-bottom:8px">${c.permisos?'Módulos propios de esta persona (no siguen al rol).':(c.rol_id?'Hoy usa los del rol «'+(rolNom(c.rol_id)||'')+'». Si cambias alguno, quedan como propios de esta persona.':'Sin rol: marca los módulos que puede usar.')} ver = solo mirar · operar = trabajar · aprobar = autorizar · admin = configurar.</div>
        ${MODS.map(([k,l])=>{const v=(permisosDe(c)[k])||'ninguno',plan=enPlan(c.marca_id,k);return `<div class="permrow" style="${plan?'':'opacity:.5'}"><span class="nm">${l}${plan?'':' <span style="font-size:10px">(fuera del plan)</span>'}</span><select data-pk="${k}">${NIVELES.map(n=>`<option value="${n}" ${v===n?'selected':''}>${n==='ninguno'?'sin acceso':n}</option>`).join('')}</select></div>`}).join('')}
        ${c.permisos&&c.rol_id?`<button class="btn ghost" id="u-delrol" style="margin-top:8px">Volver a los módulos del rol</button>`:''}</div>`:`<div class="sheet-section"><div style="font-family:var(--font-mono);font-size:11px;opacity:.65">${c.rol_sistema==='superadmin'?'Entra a todo, en todos los restaurantes.':'Entra a todos los módulos activos de su restaurante.'}</div></div>`}
      <div class="sheet-section"><div class="field-lbl">Vincular empleado (RRHH, opcional)</div><select class="select" id="u-emp"><option value="">— ninguno —</option>${empsL.map(e=>`<option value="${e.id}" ${c.empleado_id===e.id?'selected':''}>${e.nombre} ${e.apellidos||''}</option>`).join('')}</select></div>
      <div class="sheet-section"><label class="chip ${c.activo?'active':''}" id="u-act" style="cursor:pointer">${c.activo?'✓ Activo':'Inactivo'}</label></div>

async function enviarAcceso(u){
  if(!u||!u.email){toast('El usuario no tiene correo');return}
  if(!confirm(`Enviar acceso a ${u.nombre||u.email}?\n\nSe generará una contraseña temporal nueva y se enviará a:\n${u.email}\n\nEl usuario deberá crear su propia clave al ingresar.`))return;
  toast('Enviando…');
  try{
    const{data,error}=await sb.functions.invoke('admin-enviar-acceso',{body:{to:u.email}});
    if(error){toast('Error: '+(error.message||error));return}
    if(data&&data.ok){toast('Acceso enviado a '+u.email);closeSheet();}
    else toast('No se envió: '+((data&&data.error)||'error desconocido'));
  }catch(e){toast('Error: '+(e.message||e))}
}
async function descargarAccesoPDF(u){
  if(!u||!u.email){toast('El usuario no tiene correo');return}
  if(!window.jspdf||!window.jspdf.jsPDF){toast('No cargó el generador de PDF');return}
  if(!confirm(`Generar PDF de acceso para ${u.nombre||u.email}?\n\nSe creará una contraseña temporal NUEVA (la anterior deja de servir). El usuario deberá cambiarla al ingresar.`))return;
  toast('Generando…');
  try{
    const{data,error}=await sb.functions.invoke('admin-enviar-acceso',{body:{to:u.email,mode:'pdf'}});
    if(error){toast('Error: '+(error.message||error));return}
    if(!data||!data.ok){toast('No se generó: '+((data&&data.error)||'error'));return}

  }catch(e){toast('Error: '+(e.message||e))}
}
function buildPDF(d,soloBlob){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,M=18;let y=0;
  // barra superior de marca
  doc.setFillColor(30,90,249);doc.rect(0,0,W,26,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(26);
  doc.text('prep!',M,17);
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  doc.text('Accesos al sistema',W-M,16,{align:'right'});
  y=42;
  doc.setTextColor(23,28,32);doc.setFont('helvetica','bold');doc.setFontSize(18);
  doc.text('Tus accesos a Prep!',M,y);y+=12;
  doc.setFont('helvetica','normal');doc.setFontSize(12);
  doc.text(`Hola ${d.nombre||''},`,M,y);y+=7;
  const intro=doc.splitTextToSize('Te compartimos tus credenciales para ingresar al sistema operativo Prep!. Guarda este documento en un lugar seguro.',W-2*M);
  doc.text(intro,M,y);y+=intro.length*6+6;
  // caja de credenciales
  const boxH=30;doc.setDrawColor(0,0,0);doc.setLineWidth(0.6);doc.setFillColor(244,246,251);
  doc.roundedRect(M,y,W-2*M,boxH,3,3,'FD');
  doc.setFontSize(9);doc.setTextColor(90,90,90);doc.text('USUARIO',M+6,y+9);
  doc.text('CONTRASEÑA TEMPORAL',M+6,y+21);
  doc.setFont('courier','bold');doc.setFontSize(13);doc.setTextColor(23,28,32);
  doc.text(d.to,M+6,y+15);
  doc.text(d.password,M+6,y+27);
  y+=boxH+12;
  // restaurantes / urls
  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(23,28,32);
  doc.text(d.accesos&&d.accesos.length>1?'Tus restaurantes':'Ingresa aquí',M,y);y+=7;
  doc.setFont('helvetica','normal');doc.setFontSize(11);
  (d.accesos&&d.accesos.length?d.accesos:[{nombre:'Prep!',url:'https://os.prep.rest'}]).forEach(a=>{
    doc.setTextColor(23,28,32);doc.setFont('helvetica','bold');doc.text('• '+a.nombre+':',M,y);
    doc.setFont('helvetica','normal');doc.setTextColor(30,90,249);doc.text(a.url,M+5+doc.getTextWidth('• '+a.nombre+': '),y);
    y+=7;
  });
  if(d.multi){y+=1;doc.setFontSize(9.5);doc.setTextColor(110,110,110);
    const m=doc.splitTextToSize('Entras a todos con el mismo usuario; cambias de restaurante desde el selector del encabezado.',W-2*M);
    doc.text(m,M,y);y+=m.length*5+4;}
  y+=4;
  // nota seguridad
  doc.setFillColor(255,204,0);doc.setDrawColor(0,0,0);
  const nh=18;doc.roundedRect(M,y,W-2*M,nh,3,3,'FD');
  doc.setTextColor(23,28,32);doc.setFont('helvetica','bold');doc.setFontSize(10);
  doc.text('Por seguridad',M+6,y+7);
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);
  const sec=doc.splitTextToSize('El sistema te pedirá crear una contraseña nueva la primera vez que ingreses. Esta clave temporal dejará de funcionar después.',W-2*M-12);
  doc.text(sec,M+6,y+12);
  y+=nh+14;
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(23,28,32);
  doc.text('Cualquier duda, quedamos atentos!',M,y);y+=6;
  doc.text('Prep! Team',M,y);
  // pie
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(150,150,150);
  doc.text('Documento generado por Prep! · Confidencial',M,287);
  const safe=(d.nombre||d.to).replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'');
  const nombreArchivo=`Acceso-Prep-${safe}.pdf`;
  if(soloBlob)return{blob:doc.output('blob'),nombre:nombreArchivo};
  doc.save(nombreArchivo);
}
/* WhatsApp: en el celular abre el menú de compartir con el PDF adjunto (eliges WhatsApp y el
   contacto). En la computadora, donde WhatsApp no recibe archivos desde un link, descarga el
   PDF y abre el chat con el mensaje listo para que adjuntes el PDF. */
function telDe(u){const e=u&&u.empleado_id&&state.emp.find(x=>x.id===u.empleado_id);let t=((e&&e.telefono)||'').replace(/[^0-9]/g,'');if(t.length===9&&t[0]==='9')t='51'+t;return t}
async function compartirWA(d,u){
  const f=buildPDF(d,true);if(!f)return;
  const urls=(d.accesos||[]).map(a=>a.url).join(' · ')||'https://os.prep.rest';
  const txt=`Hola ${(d.nombre||'').split(' ')[0]}, te comparto tu acceso a Prep! (${urls}). En el PDF están tu usuario y tu contraseña temporal; al entrar te pide crear la tuya.`;
  const file=new File([f.blob],f.nombre,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Acceso a Prep!',text:txt});toast('Servido · elige WhatsApp en el menú');return}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(f.blob);a.download=f.nombre;document.body.appendChild(a);a.click();a.remove();
  const tel=telDe(u);
  window.open('https://wa.me/'+(tel||'')+'?text='+encodeURIComponent(txt),'_blank','noopener');
  toast('PDF descargado · adjúntalo en el chat de WhatsApp');
}
async function accesoPorWA(u){

/* Tabla de permisos: una fila por persona, una columna por módulo, check = puede entrar.

   (prep_usuarios.permisos). Gerencia y super admin entran a todo: su fila va marcada y fija. */
function renderPermisos(){
  const marca=state.fMarca||'';
  if(!marca){
    $('#screen').innerHTML=`<div class="empty" style="opacity:.8">Elige un restaurante arriba a la derecha para ver la tabla de permisos.</div>${rolesHTML()}`;
    wireRoles();return;
  }
  const us=state.usuarios.filter(u=>u.marca_id===marca).sort((a,b)=>{const o={admin_marca:0,gerente:1,operativo:2};return (o[a.rol_sistema]??3)-(o[b.rol_sistema]??3)||(a.nombre||'').localeCompare(b.nombre||'')});
  const cols=MODS.filter(([k])=>enPlan(marca,k)), fuera=MODS.filter(([k])=>!enPlan(marca,k));
  const locNom=id=>{const l=state.locales.find(x=>x.id===id);return l?l.nombre:'todos los locales'};
  const fila=u=>{
    const fijo=u.rol_sistema!=='operativo', p=permisosDe(u);
    const sub=fijo?(ROLSIS.find(r=>r[0]===u.rol_sistema)?.[1]||u.rol_sistema)+' · entra a todo':((u.permisos?'módulos propios':(u.rol_id?'rol '+(rolNom(u.rol_id)||''):'sin rol'))+' · '+locNom(u.local_id));
    return `<tr class="${u.activo===false?'off':''}"><td class="nm"><b>${u.nombre||u.email}</b><span>${sub}</span></td>${cols.map(([k])=>{const v=fijo?'admin':(p[k]||'ninguno'),on=v!=='ninguno';
      return `<td><input type="checkbox" ${on?'checked':''} ${fijo?'disabled':''} data-u="${u.id}" data-k="${k}" title="${on?'Nivel: '+v:'Sin acceso'}">${on&&!fijo&&v!=='operar'?`<span class="lv">${v}</span>`:''}</td>`}).join('')}</tr>`;
  };
  $('#screen').innerHTML=`<div style="font-family:var(--font-mono);font-size:11px;opacity:.7;margin-bottom:10px">✔ = puede entrar al módulo. Se guarda al tocar. Un check nuevo da nivel <b>operar</b>; para ver, aprobar o admin toca el nombre de la persona.${fuera.length?' Fuera del plan de este restaurante: '+fuera.map(x=>x[1]).join(', ')+'.':''}</div>
    ${us.length?`<div class="pmx-wrap"><table class="pmx"><thead><tr><th class="nm">Persona</th>${cols.map(([k,l])=>`<th class="vt">${l}</th>`).join('')}</tr></thead><tbody>${us.map(fila).join('')}</tbody></table></div>`:'<div class="empty">Este restaurante no tiene usuarios todavía.</div>'}
    ${rolesHTML()}`;
  $$('#screen .pmx input[data-u]').forEach(cb=>cb.onchange=async()=>{
    const u=state.usuarios.find(x=>x.id===cb.dataset.u),k=cb.dataset.k;
    const p=Object.assign({},permisosDe(u));delete p.formatos;delete p.revisar_examenes;
    if(cb.checked)p[k]=(permisosDe(u)[k]&&permisosDe(u)[k]!=='ninguno')?permisosDe(u)[k]:'operar';else delete p[k];
    cb.disabled=true;
    const{error}=await sb.from('prep_usuarios').update({permisos:p}).eq('id',u.id);
    cb.disabled=false;
    if(error){cb.checked=!cb.checked;toast('Atrás: '+error.message);return}
    u.permisos=p;toast('Servido · '+(u.nombre||'')+(cb.checked?' entra a ':' ya no entra a ')+(MODS.find(x=>x[0]===k)||[,k])[1]);
    const td=cb.parentElement.parentElement.querySelector('td.nm span');if(td)td.textContent='módulos propios · '+locNom(u.local_id);
  });
  $$('#screen .pmx td.nm').forEach(td=>{td.style.cursor='pointer';td.onclick=()=>{const cb=td.parentElement.querySelector('input[data-u]');if(cb)editarUsuario(state.usuarios.find(x=>x.id===cb.dataset.u))}});
  wireRoles();
}

    <div class="sheet-section"><div class="grid2">${ed?'<button class="btn ghost" id="r-del" style="color:var(--secondary)">Eliminar</button>':'<button class="btn ghost" id="r-cancel">Atrás</button>'}<button class="btn primary" id="r-save">Guardar rol</button></div></div>`;
  $('#r-nom').onchange=e=>c.nombre=e.target.value;$('#r-marca').onchange=e=>c.marca_id=e.target.value;
  $$('#sheet-body select[data-k]').forEach(s=>s.onchange=()=>{const v=s.value;if(v==='ninguno')delete c.permisos[s.dataset.k];else c.permisos[s.dataset.k]=v});
  $$('#r-esp .chip').forEach(b=>b.onclick=()=>{const k=b.dataset.e;
    if(c.permisos[k]===true)delete c.permisos[k];else c.permisos[k]=true;
    b.classList.toggle('active');});
  $$('#r-fmt .chip').forEach(b=>b.onclick=()=>{const f=new Set(c.permisos.formatos||[]);const k=b.dataset.f;
    if(f.has(k))f.delete(k);else f.add(k);
    if(f.size)c.permisos.formatos=[...f];else delete c.permisos.formatos;
    b.classList.toggle('active');});
  if($('#r-cancel'))$('#r-cancel').onclick=closeSheet;
  if($('#r-del'))$('#r-del').onclick=async()=>{if(!confirm('¿Eliminar rol?'))return;await sb.from('prep_roles').delete().eq('id',r.id);closeSheet();await load();toast('Rol eliminado')};
  $('#r-save').onclick=async()=>{if(!c.nombre){toast('Falta nombre');return}const p={nombre:c.nombre,marca_id:c.marca_id,permisos:c.permisos};const{error}=ed?await sb.from('prep_roles').update(p).eq('id',r.id):await sb.from('prep_roles').insert(p);if(error){toast('Error: '+error.message);return}closeSheet();await load();toast('Rol guardado')};
  openSheet();
}
$('#sheet-close').addEventListener('click',closeSheet);$('#backdrop').addEventListener('click',closeSheet);
$('#h-add').addEventListener('click',()=>state.view==='roles'?editarRol(null):editarUsuario(null));
load().catch(e=>{console.error(e);$('#boot').classList.add('gone');$('#screen').innerHTML='<div class="empty">Error al cargar</div>'});
</script>
</body>
</html>
