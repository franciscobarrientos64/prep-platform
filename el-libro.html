<style>
:root{--primary:#1e5af9;--secondary:#ff3b30;--tertiary:#ffcc00;--bg:#fcf9f8;--surface:#fff;--ink:#171c20;--outline:#000;--primary-soft:#d6e2ff;--gray-soft:#dfe3e8;--green:#10b981;--green-soft:#d1fae5;--amber:#b45309;--amber-soft:#fef3c7;--red-soft:#fee2e2;--shadow-sm:4px 4px 0 0 #000;--shadow:6px 6px 0 0 #000;--font-display:'Bagel Fat One',system-ui,sans-serif;--font-body:'IBM Plex Sans',system-ui,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';font-size:20px;line-height:1;vertical-align:middle;white-space:nowrap;word-wrap:normal;direction:ltr}.mono{font-family:var(--font-mono)}
.header{background:var(--bg);border-bottom:2px solid var(--outline);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:60px}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{position:relative;width:92px;height:30px;flex-shrink:0;display:block;text-decoration:none}
.brand-logo .l{position:absolute;inset:0;-webkit-mask:url(/logo.png) left center/contain no-repeat;mask:url(/logo.png) left center/contain no-repeat;background:var(--ink)}
.brand-txt .cli{font-weight:700;font-size:14px;line-height:1.1}.brand-txt .mod{font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.6}
.header-info{display:flex;gap:8px;align-items:center;flex:1;flex-wrap:wrap}
.btn-ico{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:2px solid var(--outline);border-radius:999px;background:var(--surface);font-weight:600;font-size:13px;box-shadow:var(--shadow-sm)}
.btn-ico:active{transform:translate(2px,2px);box-shadow:none}.btn-ico.primary{background:var(--primary);color:#fff}
.tabs{flex-shrink:0;display:flex;gap:8px;padding:10px 16px;background:var(--primary-soft);border-bottom:2px solid var(--outline);overflow-x:auto}
.tab{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:2px solid var(--outline);border-radius:999px;background:var(--surface);font-weight:600;font-size:13px;box-shadow:var(--shadow-sm)}
.tab.active{background:var(--ink);color:var(--bg);transform:translate(2px,2px);box-shadow:none}
.main{flex:1;overflow-y:auto;padding:16px}
.grp-t{font-family:var(--font-display);font-size:17px;margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chip{padding:6px 12px;border:2px solid var(--outline);border-radius:999px;background:var(--surface);font-size:12px;font-weight:600;box-shadow:2px 2px 0 0 var(--outline)}.chip.active{background:var(--ink);color:var(--bg)}
.post{background:var(--surface);border:2px solid var(--outline);border-radius:14px;box-shadow:var(--shadow-sm);padding:14px;margin-bottom:10px;cursor:pointer}
.post:active{transform:translate(2px,2px);box-shadow:none}
.post.fij{border-left-width:7px;border-left-color:var(--tertiary)}
.post .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.post h3{font-size:16px;font-weight:700}.post .ex{font-size:13px;opacity:.75;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .meta{font-family:var(--font-mono);font-size:11px;opacity:.6;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
/* Tablón: tablero con notas cuadradas clavadas */
.board{background-color:var(--gray-soft);background-image:radial-gradient(rgba(0,0,0,.13) 1px,transparent 1.2px);background-size:14px 14px;border:2px solid var(--outline);border-radius:18px;box-shadow:var(--shadow-sm);padding:22px 16px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px 16px}
.note{position:relative;aspect-ratio:1/1;background:var(--surface);border:2px solid var(--outline);border-radius:6px;box-shadow:var(--shadow-sm);padding:16px 12px 10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;overflow:hidden;transition:transform .12s,box-shadow .12s}
.note:nth-child(3n+1){transform:rotate(-1.2deg)}.note:nth-child(3n+2){transform:rotate(.8deg)}.note:nth-child(3n){transform:rotate(-.4deg)}
.note:hover{transform:translate(-2px,-2px) rotate(0);box-shadow:var(--shadow);z-index:1}
.note:active{transform:translate(2px,2px);box-shadow:none}
.note.amarilla{background:var(--amber-soft)}.note.roja{background:var(--red-soft)}.note.azul{background:var(--primary-soft)}.note.verde{background:var(--green-soft)}
.note .pin{position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:20px;color:var(--secondary);font-variation-settings:'FILL' 1}
.note h3{font-size:14px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note .ex{font-size:12px;opacity:.75;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.note .nf{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:var(--font-mono);font-size:10px;opacity:.75}
@media(max-width:420px){.board{grid-template-columns:repeat(2,1fr);gap:14px 10px;padding:18px 10px 12px}.note{padding:14px 9px 8px}.note h3{font-size:13px}}
.tagx{font-family:var(--font-mono);font-size:9px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:6px;border:1.5px solid var(--outline)}
.tagx.alta{background:var(--red-soft)} .tagx.cat{background:var(--primary-soft)}
.clk{background:var(--surface);border:2px solid var(--outline);border-radius:14px;box-shadow:var(--shadow-sm);padding:13px 15px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.clk:active{transform:translate(2px,2px);box-shadow:none}
/* Cursos: tarjetas cuadradas en grilla */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:6px}
.ctile{position:relative;aspect-ratio:1/1;background:var(--surface);border:2px solid var(--outline);border-radius:16px;box-shadow:var(--shadow-sm);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;overflow:hidden;transition:transform .12s,box-shadow .12s}
.ctile:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow)}
.ctile:active{transform:translate(2px,2px);box-shadow:none}
.ctile.off{opacity:.55;cursor:default}
.ctile.off:hover{transform:none;box-shadow:var(--shadow-sm)}
.ctile .ce{font-size:30px;line-height:1}
.ctile .ct{font-weight:700;font-size:13.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ctile .cd2{font-family:var(--font-mono);font-size:10px;opacity:.6;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctile .cf{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.ctile .cf .tagx{white-space:nowrap}
.ctile .cadm{width:30px;height:30px;padding:0;justify-content:center;flex-shrink:0}
.cg-t{font-family:var(--font-display);font-size:16px;margin:18px 0 10px;border-bottom:2px solid var(--outline);padding-bottom:3px}
.cg-t:first-child{margin-top:4px}
.prog{font-family:var(--font-mono);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:2px solid var(--outline)}
.prog.full{background:var(--green);color:#fff}.prog.part{background:var(--amber-soft)}.prog.none{background:var(--gray-soft)}
.bit{background:var(--surface);border:2px solid var(--outline);border-radius:14px;box-shadow:var(--shadow-sm);padding:12px 14px;margin-bottom:8px;border-left-width:7px}
.bit.incidencia{border-left-color:var(--secondary)}.bit.nota{border-left-color:var(--primary)}.bit.novedad{border-left-color:var(--green)}
.bit .meta{font-family:var(--font-mono);font-size:11px;opacity:.65;margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.chkitem{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--gray-soft);cursor:pointer}.chkitem:last-child{border:none}
.box{width:26px;height:26px;border:2px solid var(--outline);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface)}
.box.on{background:var(--green);color:#fff}
.chkitem.on span.tx{text-decoration:line-through;opacity:.5}
.input,.select,textarea.input{padding:10px 12px;border:2px solid var(--outline);border-radius:10px;background:var(--surface);font-family:var(--font-body);font-size:14px;box-shadow:var(--shadow-sm);width:100%}
textarea.input{min-height:120px;resize:vertical}
.field-lbl{font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin-bottom:6px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border:2px solid var(--outline);border-radius:14px;font-weight:600;font-size:14px;background:var(--surface);box-shadow:var(--shadow-sm);width:100%;min-height:50px}
.btn:active{transform:translate(2px,2px);box-shadow:none}.btn.primary{background:var(--primary);color:#fff}.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.empty{text-align:center;padding:40px;font-family:var(--font-mono);font-size:12px;opacity:.55}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--surface);border-top:3px solid var(--outline);border-radius:24px 24px 0 0;box-shadow:0 -10px 0 0 var(--outline);transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);max-height:92vh;display:flex;flex-direction:column}
.sheet.open{transform:translateY(0)}.sheet-handle{width:48px;height:5px;background:var(--outline);border-radius:999px;margin:12px auto 8px;opacity:.3}
.sheet-head{padding:6px 24px 14px;border-bottom:2px solid var(--outline);display:flex;align-items:center;gap:14px}
.sheet-mark{width:50px;height:50px;border:2px solid var(--outline);border-radius:12px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:24px}
.sheet-title{flex:1}.sheet-title h2{font-family:var(--font-display);font-size:22px;line-height:1;margin-bottom:4px}.sheet-title .meta{font-family:var(--font-mono);font-size:11px;opacity:.65}
.sheet-close{width:40px;height:40px;border:2px solid var(--outline);border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.sheet-body{padding:18px 24px 28px;overflow-y:auto}.sheet-section+.sheet-section{margin-top:14px}
.contenido{white-space:pre-wrap;font-size:15px;line-height:1.55}
.toast-container{position:fixed;top:76px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border:2px solid var(--outline);border-radius:12px;padding:12px 18px;font-size:14px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;max-width:340px}
.toast.ok{background:var(--primary);color:#fff}.toast.err{background:var(--secondary);color:#fff}.toast.warn{background:var(--tertiary)}
.boot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:300;transition:opacity .3s}.boot.gone{opacity:0;pointer-events:none}
.boot .logo{position:relative;width:220px;height:73px}.boot .logo .l{position:absolute;inset:0;-webkit-mask:url(/logo.png) center/contain no-repeat;mask:url(/logo.png) center/contain no-repeat;background:var(--ink)}
.boot .spinner{width:34px;height:34px;border:4px solid var(--outline);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.boot .msg{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;opacity:.6}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cdow{font-family:var(--font-mono);font-size:10px;font-weight:700;text-align:center;opacity:.5;padding-bottom:2px}
.cd{min-height:64px;border:2px solid var(--outline);border-radius:9px;background:var(--surface);padding:4px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cd-n{font-family:var(--font-mono);font-size:11px;font-weight:700;opacity:.55}
.cd-e{font-family:var(--font-mono);font-size:8.5px;font-weight:700;color:#fff;border:1.5px solid var(--outline);border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exc{display:flex;align-items:center;justify-content:center;min-height:30px;border:2px solid var(--outline);border-radius:7px;font-family:var(--font-mono);font-size:12px;font-weight:700}
@media(max-width:560px){.cd{min-height:52px}.cd-e{font-size:0;padding:4px}}
/* Inicio: secciones del libro en cuadrados (como el hub) */
.lt-intro{font-family:var(--font-mono);font-size:11px;opacity:.6;margin-bottom:14px}
.ltgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.ltile{position:relative;aspect-ratio:1/1;background:var(--surface);border:2px solid var(--outline);border-radius:16px;box-shadow:var(--shadow-sm);padding:16px 14px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;overflow:hidden;text-align:left;font-family:var(--font-body);color:var(--ink);transition:transform .12s,box-shadow .12s}
.ltile::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:var(--ac,var(--primary))}
.ltile:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow)}
.ltile:active{transform:translate(2px,2px);box-shadow:none}
.ltile .ico{font-size:34px;color:var(--ac,var(--primary));margin-top:4px}
.ltile .nm{font-weight:700;font-size:15px;line-height:1.15}
.ltile .ds{font-family:var(--font-mono);font-size:10.5px;opacity:.6;line-height:1.3}
.ltile .bd{margin-top:auto;align-self:flex-start;font-family:var(--font-mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;border:1.5px solid var(--outline);background:var(--amber-soft)}
.ltile .bd.red{background:var(--secondary);color:#fff}
.ltile.dest{background:var(--ink);color:var(--bg)}.ltile.dest .ds{opacity:.75}
@media(max-width:420px){.ltgrid{grid-template-columns:repeat(2,1fr);gap:10px}.ltile{padding:14px 10px 10px}.ltile .ico{font-size:28px}.ltile .nm{font-size:13.5px}}
/* Jefe de Servicio */
.jsum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.jk{background:var(--surface);border:2px solid var(--outline);border-radius:14px;box-shadow:var(--shadow-sm);padding:10px 12px}
.jk .jl{font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.6}
.jk .jv{font-family:var(--font-display);font-size:24px;line-height:1.1;margin-top:2px}
.jk .jx{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--secondary)}
.chip .material-symbols-outlined{vertical-align:-3px}
.mnt{background:var(--surface);border:2px solid var(--outline);border-radius:14px;box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;gap:14px;align-items:flex-start}
.mnt:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow)}
.mnt .mf{flex:0 0 58px;text-align:center;border:2px solid var(--outline);border-radius:10px;padding:4px 0;background:var(--primary-soft)}
.mnt .mf b{display:block;font-family:var(--font-display);font-size:22px;line-height:1.1}
.mnt .mf span{font-family:var(--font-mono);font-size:10px;text-transform:uppercase}
.mnt h3{font-size:16px;font-weight:700;margin-bottom:3px}
.mnt .mm{font-family:var(--font-mono);font-size:11px;opacity:.6}
.mdoc h4{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.6;margin:16px 0 6px}
.mdoc .mtx{white-space:pre-wrap;font-size:14px;line-height:1.55}
.macu{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--outline);border-radius:10px;padding:8px 10px;margin-bottom:6px;background:var(--surface)}
.macu.ok .mat{text-decoration:line-through;opacity:.5}
.macu .mr{font-family:var(--font-mono);font-size:11px;opacity:.65}
.jplan{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2px solid var(--outline);border-radius:14px;box-shadow:var(--shadow-sm);padding:14px;margin-bottom:10px;cursor:pointer}
.jplan .jpn{font-family:var(--font-display);font-size:22px;color:var(--primary);line-height:1}
.jplan h3{font-size:16px;font-weight:700;margin-bottom:4px}
.jkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.jkpi{background:var(--surface);border:2px solid var(--outline);border-radius:14px;box-shadow:var(--shadow-sm);padding:12px 14px;cursor:pointer;border-top-width:7px;border-top-color:var(--gray-soft)}
.jkpi.ok{border-top-color:var(--green)}.jkpi.bad{border-top-color:var(--secondary)}
.jkh{display:flex;gap:8px;align-items:flex-start}
.jkn{font-weight:700;font-size:14px;line-height:1.2}.jkm{font-family:var(--font-mono);font-size:10.5px;opacity:.6;margin-top:2px}
.jkv{font-family:var(--font-display);font-size:30px;line-height:1;margin-top:10px}
.jbars{display:flex;align-items:flex-end;gap:4px;height:42px;margin-top:8px;border-bottom:1.5px solid var(--outline)}
.jbars span{flex:1;max-width:18px;border:1.5px solid var(--outline);border-bottom:none;border-radius:3px 3px 0 0}
.jhist{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--gray-soft);font-size:13px}
.jtask{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--outline);border-radius:12px;box-shadow:var(--shadow-sm);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.jtask.hecha .jtt{text-decoration:line-through;opacity:.5}
.jtask.venc{border-left:7px solid var(--secondary)}
.jtt{font-weight:600;font-size:14px;line-height:1.25}
.jtm{font-family:var(--font-mono);font-size:10.5px;opacity:.65;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.jtm .venc-t{color:var(--secondary);font-weight:700;opacity:1}
.tagx.js-pendiente{background:var(--gray-soft)}.tagx.js-en_proceso{background:var(--primary-soft)}.tagx.js-bloqueada{background:var(--amber-soft)}.tagx.js-hecha{background:var(--green-soft)}
.jday{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.jday .dt{font-family:var(--font-display);font-size:18px;flex:1;min-width:140px}
.jprog{height:12px;border:2px solid var(--outline);border-radius:999px;background:var(--surface);overflow:hidden;margin-bottom:12px}
.jprog span{display:block;height:100%;background:var(--green)}
.jitem{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--gray-soft)}
.jitem .hr{font-family:var(--font-mono);font-size:12px;font-weight:700;width:46px;flex-shrink:0}
.jitem.on .ac{text-decoration:line-through;opacity:.5}

async function loadRol(){
  try{
    const s0=(await sb.auth.getSession()).data.session;
    if(s0&&s0.user){
      const{data}=await sb.from('prep_usuarios').select('rol_sistema,rol_id,permisos').eq('email',s0.user.email).maybeSingle();state.permPropios=(data&&data.permisos)||null;
      state.esAdmin=!!data&&['superadmin','admin_marca','gerente'].includes(data.rol_sistema);state.esSuper=!!data&&data.rol_sistema==='superadmin';
      // Un rol operativo puede tener limitados los formatos que ve (prep_roles.permisos.formatos)
      if(data&&data.rol_id&&!state.esAdmin){
        const{data:rl}=await sb.from('prep_roles').select('permisos').eq('id',data.rol_id).maybeSingle();
        const pm=(rl&&rl.permisos)||{};
        if(Array.isArray(pm.formatos)&&pm.formatos.length)state.formatos=pm.formatos;
        if(pm.revisar_examenes===true)state.puedeRevisar=true;   // jefes de área: leen las entregas, no publican
      }
    }
  }catch(e){state.esAdmin=false}
  // "Ver como": la vista del super admin manda sobre su rol real
  try{
    if(window.PREP_VISTA){
      state.esAdmin=!!window.prepEsAdminVista();state.esSuper=window.PREP_VISTA.rol_sistema==='superadmin';
      state.formatos=window.prepFormatos();
      state.puedeRevisar=state.esAdmin||((window.PREP_VISTA.permisos||{}).revisar_examenes===true);
    }
  }catch(e){}
  if(state.esAdmin)state.puedeRevisar=true;
  // Subir/editar recetas en el Recetario: gerencia o rol con El Libro >= operar
  try{
    if(window.PREP_VISTA){const n=window.prepNivel&&window.prepNivel('libro');state.puedeRecetas=state.esAdmin||['operar','aprobar','admin'].includes(n);}
    else if(state.esAdmin)state.puedeRecetas=true;
    else{const s1=(await sb.auth.getSession()).data.session;if(s1&&s1.user){const{data:u}=await sb.from('prep_usuarios').select('rol_id,permisos').eq('email',s1.user.email).maybeSingle();

  }catch(e){state.puedeRecetas=!!state.esAdmin}
}

  // state.formatos = null significa "todos".
  const TABS=[['tablon','Tablón','campaign'],['equipo','Equipo','groups'],['procedimientos','Procedimientos','menu_book'],['recetario','Recetario','restaurant_menu'],['plantillas','Plantillas','library_books'],['cursos','Cursos','school'],['examenes','Exámenes','quiz'],['briefing','Briefing','flag'],['checklists','Checklists','checklist'],['eventualidades','Eventualidades','report'],['calendario','Calendario','calendar_month'],['thetalk','The Talk','forum'],['politicas','Políticas','gavel'],['bitacora','Bitácora','history_edu'],['jefeservicio','Jefe de Servicio','supervisor_account'],['minutas','Minutas','summarize']];

  const HIDEADD=['inicio','jefeservicio','minutas','equipo','politicas','recetario','plantillas','cursos'];
  $('#h-add').style.display=(!state.esAdmin||HIDEADD.includes(state.view))?'none':'';
  if(state.view==='inicio')renderInicio(secciones);else if(state.view==='jefeservicio')renderJefeServicio();else if(state.view==='minutas')renderMinutas();else if(state.view==='tablon')renderTablon();else if(state.view==='equipo')renderEquipo();else if(state.view==='procedimientos')renderProcs();else if(state.view==='recetario')renderRecetario();else if(state.view==='plantillas')renderPlantillas();else if(state.view==='cursos')renderCursos();else if(state.view==='examenes')renderExamenes();else if(state.view==='briefing')renderBriefing();else if(state.view==='checklists')renderChecklists();else if(state.view==='eventualidades')renderEventualidades();else if(state.view==='calendario')renderCalendario();else if(state.view==='thetalk')renderThetalk();else if(state.view==='politicas')renderPoliticas();else renderBitacora();
}

];

  (ds.map(d=>{const ok=!!(d.contenido||'').trim();return `<div style="background:var(--surface);border:2px solid var(--outline);border-radius:14px;box-shadow:var(--shadow-sm);padding:12px 14px;margin-bottom:10px">

function fichaLineas(tx){
  return String(tx||'').split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>l.replace(/^(\d+[.)-]?|[-•·*])\s+/,''));
}
function fichaEtapa(e,ix){
  fichaCss();
  const ings=Array.isArray(e.ingredientes)?e.ingredientes:[];
  const lin=fichaLineas(e.metodo||e.pasos||e.descripcion||e.desc||'');
  const pasos=lin.filter(l=>!/^nota\b/i.test(l)), notas=lin.filter(l=>/^nota\b/i.test(l));
  const tit=e.nombre||e.titulo||('Paso '+(ix+1));
  const num=v=>v==null||v===''?'':String(v).replace('.',',');
  return `<div class="fx"><div class="fx-l"><div class="fx-t">${escH(/:\s*$/.test(tit)?tit:tit+' :')}</div>
      ${ings.length?ings.map(i=>typeof i==='object'&&i?`<div class="fx-i"><span>${escH(num(i.cantidad))}</span><span>${escH(i.unidad||'')}</span><span>${escH(i.nombre||'')}</span></div>`:`<div class="fx-i"><span></span><span></span><span>${escH(ingTxt(i))}</span></div>`).join(''):''}</div>
    <div><div class="fx-t">&nbsp;</div>
      ${pasos.length?pasos.map((l,k)=>`<div class="fx-m"><span>${k+1}</span><span>${escH(l)}</span></div>`).join(''):''}
      ${notas.map(n=>`<div class="fx-n">${escH(n)}</div>`).join('')}</div></div>`;
}
function fichaServicio(r){

/* Publicar / despublicar un curso de la casa. Solo gerencia y super admin. */
async function toggleCursoCasa(id,val){
  const{error}=await sb.from('lb_cursos').update({activo:val,publicado_at:val?nowISO():null,publicado_por:val?(localStorage.getItem('lb_lector')||null):null}).eq('id',id);
  if(error){toast('Atrás: '+error.message,'err');return}
  await loadCursosCasa();render();toast(val?'Servido · material habilitado para el equipo':'Material despublicado','ok');
}
function cursosCasaHTML(){
  const cs=(state.cursosCasa||[]).filter(c=>c.activo||state.esAdmin);
  if(!cs.length)return'';
  const grupos=[...new Set(cs.map(c=>c.grupo||'Cursos de la casa'))];
  return grupos.map(g=>`<div class="cg-t">${g}</div><div class="cgrid">`+
    cs.filter(c=>(c.grupo||'Cursos de la casa')===g).map(c=>`<div class="ctile" ${c.activo||state.esAdmin?`data-url="${c.url}"`:''}>
      <span class="ce">${c.emoji||'📘'}</span>
      <div class="ct">${c.titulo}</div>${c.descripcion?`<div class="cd2">${c.descripcion}</div>`:''}
      <div class="cf">
        ${c.activo?'<span class="tagx" style="background:var(--green-soft);border:1.5px solid var(--outline)">Abrir ↗</span>':'<span class="tagx alta">Borrador</span>'}
        ${state.esAdmin?`<button class="btn-ico cadm ${c.activo?'':'primary'}" data-curso="${c.id}" data-val="${c.activo?'0':'1'}" title="${c.activo?'Ocultar al equipo':'Habilitar para el equipo'}"><span class="material-symbols-outlined" style="font-size:16px">${c.activo?'visibility_off':'rocket_launch'}</span></button>`:''}
      </div></div>`).join('')+'</div>').join('')+'<div style="height:6px"></div>';
}

/* Rendir un examen. Soporta dos tipos de pregunta:
   - opción múltiple (por defecto): {q, opciones, correcta} → se califica sola.
   - abierta: {q, tipo:'abierta', placeholder} → se guarda el texto; no se califica sola,
     cuenta como "cumplida" si la persona escribió algo y la revisa el bar.
   Al entregar sale la pantalla de resultado con el % de cumplimiento. */
function tomarExamen(ex){
  if(!ex)return;
  const preg=Array.isArray(ex.preguntas)?ex.preguntas:[];const resp={};
  const persona=(prompt('Tu nombre (para registrar el resultado):',localStorage.getItem('lb_lector')||'')||'').trim();
  if(!persona)return;
  try{localStorage.setItem('lb_lector',persona)}catch(e){}
  const nMC=preg.filter(p=>p.tipo!=='abierta').length,nAB=preg.length-nMC;
  setHead('📝',ex.titulo,nMC+' de opción múltiple'+(nAB?' · '+nAB+' para escribir':''));
  const MIN_PAL=5;   // "más de 4 palabras" para que la línea cuente
  const palabras=t=>String(t||'').trim().split(/\s+/).filter(Boolean).length;
  const lineaOK=t=>palabras(t)>=MIN_PAL;
  const harvest=()=>{$$('#sheet-body textarea[data-a]').forEach(t=>{resp[Number(t.dataset.a)]=t.value})};
  let secc=null;
  $('#sheet-body').innerHTML=preg.map((p,i)=>{
    let h='';
    if(p.seccion&&p.seccion!==secc){secc=p.seccion;
      h+=`<div class="grp-t" style="margin-top:20px">${p.seccion}</div>`+(p.ayuda?`<div style="font-family:var(--font-mono);font-size:11px;opacity:.65;margin:-4px 0 6px">${p.ayuda}</div>`:'');}
    h+=`<div class="sheet-section"><div style="font-weight:700;margin-bottom:8px">${i+1}. ${p.q}</div>`;
    if(p.tipo==='abierta')
      h+=`<textarea class="input" data-a="${i}" style="min-height:62px" placeholder="${(p.placeholder||'Escribe tu respuesta…').replace(/"/g,'&quot;')}"></textarea>`
         +`<div class="cuenta" data-c="${i}" style="font-family:var(--font-mono);font-size:10.5px;margin-top:4px"></div>`;
    else
      h+=(p.opciones||[]).map((o,j)=>`<button class="btn ghost" data-q="${i}" data-o="${j}" style="justify-content:flex-start;text-align:left;margin-bottom:6px;width:100%">${o}</button>`).join('');
    return h+'</div>';
  }).join('')+`<div class="sheet-section"><div id="ex-falta" style="font-family:var(--font-mono);font-size:11px;margin-bottom:8px"></div><button class="btn primary" id="ex-submit" style="width:100%">Entregar examen</button></div>`;

  const pendientes=()=>{harvest();return{
    mc:preg.filter((p,i)=>p.tipo!=='abierta'&&resp[i]==null).length,
    ab:preg.filter((p,i)=>p.tipo==='abierta'&&!lineaOK(resp[i])).length};};
  const pintarFalta=()=>{
    const f=pendientes(),e=$('#ex-falta');
    $$('#sheet-body .cuenta').forEach(c=>{const i=Number(c.dataset.c),n=palabras(resp[i]);
      if(!n){c.textContent='';return}
      const ok=n>=MIN_PAL;
      c.textContent=n+(n===1?' palabra':' palabras')+(ok?' ✓':' · te faltan '+(MIN_PAL-n)+' para que cuente');
      c.style.color=ok?'var(--green)':'var(--amber)';});
    if(!e)return;
    if(!f.mc&&!f.ab){e.textContent='Todo listo ✓';e.style.color='var(--green)';}
    else{e.textContent='Te falta: '+[f.mc?f.mc+' de opción múltiple':'',f.ab?f.ab+' línea'+(f.ab>1?'s':'')+' de venta':''].filter(Boolean).join(' · ');e.style.color='var(--secondary)';}};
  $$('#sheet-body [data-q]').forEach(b=>b.onclick=()=>{
    const i=Number(b.dataset.q);resp[i]=Number(b.dataset.o);
    $$('#sheet-body [data-q="'+i+'"]').forEach(x=>{x.classList.remove('primary');x.classList.add('ghost')});
    b.classList.remove('ghost');b.classList.add('primary');pintarFalta();});
  $$('#sheet-body textarea[data-a]').forEach(t=>t.oninput=pintarFalta);
  pintarFalta();

  $('#ex-submit').onclick=async()=>{
    harvest();
    const f=pendientes(),falta=f.mc+f.ab;
    if(falta&&!confirm('Te falta responder '+falta+(falta>1?' preguntas':' pregunta')+'. Van a contar como cero. ¿Entregar así?'))return;
    let ok=0,mc=0,ab=0,escritas=0;
    preg.forEach((p,i)=>{
      if(p.tipo==='abierta'){ab++;if(lineaOK(resp[i]))escritas++;}
      else{mc++;if(resp[i]===p.correcta)ok++;}});
    const pct=mc?Math.round(ok/mc*100):null;                 // puntaje de conocimiento
    const pctV=ab?Math.round(escritas/ab*100):null;           // puntaje de venta sugestiva
    const{error}=await sb.from('rrhh_examen_resultados').insert({examen_id:ex.id,local_id:LOCAL,persona,
      puntaje:ok,total:mc,respuestas:resp,escritas,escritas_total:ab,pct,pct_ventas:pctV});
    if(error){toast('Atrás: '+error.message,'err');return}
    await loadExamenes();render();
    pantallaResultado(ex,preg,resp,{ok:ok,mc:mc,escritas:escritas,ab:ab,pct:pct,pctV:pctV});
  };
  openSheet();
}
/* Pantalla de resultado: dos puntajes separados — conocimiento y venta sugestiva. */
function pantallaResultado(ex,preg,resp,r){
  const aprobC=r.pct==null||r.pct>=APRUEBA, aprobV=r.pctV==null||r.pctV>=APRUEBA;
  setHead(aprobC&&aprobV?'🎉':'📋','Tu resultado',ex.titulo);
  const err=preg.map((p,i)=>({p:p,i:i})).filter(x=>x.p.tipo!=='abierta'&&resp[x.i]!==x.p.correcta);
  const marcador=(t,v,sub,ok,nota)=>`<div style="border:2px solid var(--outline);border-radius:14px;padding:14px 12px;text-align:center;background:var(--surface);box-shadow:var(--shadow-sm)">
      <div style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;opacity:.6">${t}</div>
      <div style="font-family:var(--font-display);font-size:44px;line-height:1.05;color:${ok?'var(--green)':'var(--secondary)'}">${v}</div>
      <div style="font-size:11.5px;opacity:.75">${sub}</div>
      <span class="tagx" style="margin-top:7px;display:inline-block;background:${ok?'var(--green-soft)':'var(--red-soft)'}">${nota}</span></div>`;
  $('#sheet-body').innerHTML=
   `<div class="sheet-section" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${marcador('Conocimiento',(r.pct==null?'—':r.pct+'%'),r.ok+' de '+r.mc+' correctas',aprobC,aprobC?'Aprobado':'No aprobado')}
      ${marcador('Venta sugestiva',(r.pctV==null?'—':r.pctV+'%'),r.escritas+' de '+r.ab+' líneas válidas',aprobV,aprobV?'Aprobado':'No aprobado')}
    </div>
    <div class="sheet-section"><div style="font-family:var(--font-mono);font-size:10.5px;opacity:.65;text-align:center">Se aprueba cada puntaje con ${APRUEBA}%. Una línea de venta cuenta si tiene más de 4 palabras${r.ab&&r.escritas<r.ab?' — te quedaron '+(r.ab-r.escritas)+' sin contar':''}. Las líneas las lee el bar.</div></div>
    ${err.length?`<div class="sheet-section"><div class="field-lbl">Para repasar · lo que falló</div>`+err.map(x=>
      `<div style="border-bottom:1px dashed var(--gray-soft);padding:9px 0">
        <div style="font-weight:600;font-size:13px;margin-bottom:3px">${x.p.q}</div>
        <div style="font-size:12px;color:var(--secondary)">Marcaste: ${resp[x.i]!=null?x.p.opciones[resp[x.i]]:'sin responder'}</div>
        <div style="font-size:12px;color:var(--green)">Correcto: ${x.p.opciones[x.p.correcta]}</div></div>`).join('')+`</div>`
     :`<div class="sheet-section"><div style="background:var(--green-soft);border:2px solid var(--outline);border-radius:12px;padding:12px;font-size:13.5px">Ni un error en los ingredientes. Te sabes la carta.</div></div>`}
    <div class="sheet-section"><button class="btn primary" id="res-ok" style="width:100%">Listo</button></div>`;
  $('#res-ok').onclick=closeSheet;
  openSheet();
}
/* Revisión (gerencia): ver lo que escribió una persona en las preguntas abiertas. */
function verEntrega(res){
  const ex=(state.examenes||[]).find(x=>x.id===res.examen_id);if(!ex)return;
  const preg=Array.isArray(ex.preguntas)?ex.preguntas:[],resp=res.respuestas||{};
  setHead('📄',res.persona||'—',ex.titulo);
  const abiertas=preg.map((p,i)=>({p:p,i:i})).filter(x=>x.p.tipo==='abierta');

function pctColor(p){return p>=85?'#1e5af9':p>=75?'#10b981':p>=65?'#ffcc00':'#ff3b30';}
function examPanelHTML(){
  const exs=state.examPanel||[],notas=state.examNotas||[];if(!exs.length)return'';
  const ids=new Set(exs.map(e=>e.id));const ns=notas.filter(n=>ids.has(n.examen_id));
  const members=[...new Set(ns.map(n=>n.nombre_persona))];
  const get=(m,eid)=>{const r=ns.find(x=>x.nombre_persona===m&&x.examen_id===eid);return r&&r.nota_pct!=null?Number(r.nota_pct):null;};
  const avgM=m=>{const vs=exs.map(e=>get(m,e.id)).filter(v=>v!=null);return vs.length?Math.round(vs.reduce((a,b)=>a+b,0)/vs.length):null;};
  members.sort((a,b)=>(avgM(a)||0)-(avgM(b)||0));

   <div></div>${exs.map(e=>`<div style="font-family:var(--font-mono);font-size:9px;font-weight:700;text-align:center;opacity:.6;align-self:end;padding-bottom:3px">${(e.nombre||'').split(' ').slice(0,2).join(' ')}</div>`).join('')}<div style="font-family:var(--font-mono);font-size:9px;font-weight:700;text-align:center;opacity:.6;align-self:end;padding-bottom:3px">PROM</div>`;
  members.forEach(m=>{h+=`<div style="font-size:12px;font-weight:600;display:flex;align-items:center">${m}</div>`;
    exs.forEach(e=>{const v=get(m,e.id);h+=v==null?`<div class="exc" style="background:var(--gray-soft);opacity:.4">·</div>`:`<div class="exc" style="background:${pctColor(v)};color:#fff">${v}</div>`;});

/* ===== BRIEFING ===== */
function fmtHora(ts){if(!ts)return'';try{return new Date(ts).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'})}catch(e){return''}}
function briefCard(b){return `<div class="bfcard" data-id="${b.id}" style="cursor:pointer;background:var(--surface);border:2px solid var(--outline);border-radius:14px;box-shadow:var(--shadow-sm);padding:14px;margin-bottom:9px">
  <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div style="font-weight:700">${b.fecha} · ${b.turno||''}</div><span class="tagx cat">${b.responsable||''}</span></div>
  ${b.objetivos?`<div style="font-size:13px;margin-top:6px"><b>Objetivos:</b> ${b.objetivos}</div>`:''}
  ${b.reservas_eventos?`<div style="font-size:13px;margin-top:3px"><b>Reservas/eventos:</b> ${b.reservas_eventos}</div>`:''}
  ${b.focos_servicio?`<div style="font-size:13px;margin-top:3px"><b>Focos:</b> ${b.focos_servicio}</div>`:''}
  ${b.notas?`<div style="font-size:13px;margin-top:3px;opacity:.8">${b.notas}</div>`:''}
  <div style="font-family:var(--font-mono);font-size:10px;opacity:.45;margin-top:6px">Generado ${fmtHora(b.created_at)} · ✏️ editar</div></div>`;}
function renderBriefing(){
  const hoy=hoyISO();
  const today=(state.briefings||[]).filter(b=>b.fecha===hoy);
  const hist=(state.briefings||[]).filter(b=>b.fecha!==hoy).slice(0,20);
  const clName={};(state.checklists||[]).forEach(c=>clName[c.id]=c.nombre);
  const runsHoy=state.runs||[];
  const gen=`<div style="background:var(--surface);border:2px solid var(--outline);border-radius:12px;box-shadow:var(--shadow-sm);padding:12px 14px;margin-bottom:12px;font-family:var(--font-mono);font-size:12px;line-height:1.7">
     <div style="font-weight:700;margin-bottom:4px">⏱️ Generado hoy</div>
     ${today.length?today.map(b=>`Briefing (${b.turno||'—'}): <b>${fmtHora(b.created_at)}</b>`).join('<br>'):'Briefing: <span style="opacity:.5">pendiente</span>'}<br>
     ${runsHoy.length?runsHoy.map(r=>`${clName[r.checklist_id]||'Checklist'}: <b>${fmtHora(r.created_at)}</b>`).join('<br>'):'Checklists: <span style="opacity:.5">pendientes</span>'}</div>`;
  $('#screen').innerHTML=`<div style="font-family:var(--font-mono);font-size:11px;opacity:.6;margin-bottom:12px">Briefing diario · toca para editar 🚩</div>`+gen+
   (today.length?today.map(briefCard).join(''):'<div class="empty">Sin briefing de hoy. Toca «+ Briefing».</div>')+
   (hist.length?`<div class="grp-t" style="margin-top:16px">Anteriores</div>`+hist.map(briefCard).join(''):'');
  $$('#screen .bfcard').forEach(c=>c.onclick=()=>briefingSheet(state.briefings.find(b=>b.id===c.dataset.id)));
}
function briefingSheet(rec){
  const ed=!!rec, v=s=>(s||'').replace(/"/g,'&quot;');
  setHead('🚩',ed?'Editar briefing':'Briefing diario','Formato diario');
  $('#sheet-body').innerHTML=`
   <div class="sheet-section" style="display:flex;gap:10px"><div style="flex:1"><div class="field-lbl">Fecha</div><input class="input" id="bf-fec" type="date" value="${ed?rec.fecha:hoyISO()}"></div>
     <div style="flex:1"><div class="field-lbl">Turno</div><select class="input" id="bf-tur"><option value="apertura">Apertura</option><option value="almuerzo">Almuerzo</option><option value="cena">Cena</option></select></div></div>
   <div class="sheet-section"><div class="field-lbl">Responsable</div><input class="input" id="bf-resp" value="${ed?v(rec.responsable):''}" placeholder="Quién dirige el briefing"></div>
   <div class="sheet-section"><div class="field-lbl">Objetivos del día</div><textarea class="input" id="bf-obj">${ed&&rec.objetivos?rec.objetivos:''}</textarea></div>
   <div class="sheet-section"><div class="field-lbl">Reservas y eventos</div><textarea class="input" id="bf-res">${ed&&rec.reservas_eventos?rec.reservas_eventos:''}</textarea></div>
   <div class="sheet-section"><div class="field-lbl">Focos de servicio</div><textarea class="input" id="bf-foc">${ed&&rec.focos_servicio?rec.focos_servicio:''}</textarea></div>
   <div class="sheet-section"><div class="field-lbl">Notas</div><textarea class="input" id="bf-not">${ed&&rec.notas?rec.notas:''}</textarea></div>
   <div class="sheet-section"><button class="btn primary" id="bf-save" style="width:100%">${ed?'Guardar cambios':'Guardar briefing'}</button>${ed?'<button class="btn ghost" id="bf-del" style="width:100%;margin-top:8px;color:var(--secondary)">Eliminar</button>':''}</div>`;
  openSheet();
  if(ed&&$('#bf-tur'))$('#bf-tur').value=rec.turno||'cena';
  $('#bf-save').onclick=async()=>{const payload={fecha:$('#bf-fec').value,turno:$('#bf-tur').value,responsable:$('#bf-resp').value||null,objetivos:$('#bf-obj').value||null,reservas_eventos:$('#bf-res').value||null,focos_servicio:$('#bf-foc').value||null,notas:$('#bf-not').value||null};
    const{error}=ed?await sb.from('lb_briefings').update(payload).eq('id',rec.id):await sb.from('lb_briefings').insert(Object.assign({marca_id:MARCA,local_id:LOCAL},payload));
    if(error){toast('Atrás: '+error.message,'err');return}closeSheet();await loadBriefings();render();toast(ed?'Va · actualizado':'Servido · briefing guardado','ok')};
  if(ed)$('#bf-del').onclick=async()=>{if(!confirm('¿Eliminar este briefing?'))return;await sb.from('lb_briefings').delete().eq('id',rec.id);closeSheet();await loadBriefings();render();toast('Eliminado','ok')};
}
/* ===== EVENTUALIDADES + reporte diario ===== */
const GRAV={baja:'var(--green)',media:'var(--tertiary)',alta:'var(--secondary)'};
function eventCard(e){return `<div class="evcard" data-id="${e.id}" style="cursor:pointer;background:var(--surface);border:2px solid var(--outline);border-radius:14px;box-shadow:var(--shadow-sm);padding:13px 14px;margin-bottom:8px;display:flex;gap:10px">
  <div style="width:10px;align-self:stretch;border-radius:4px;background:${GRAV[e.gravedad]||'#9aa3ab'}"></div>
  <div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><div style="font-weight:700">${e.tipo||'Eventualidad'} <span style="font-family:var(--font-mono);font-size:10px;opacity:.5">${e.turno||''}</span></div><span class="tagx" style="background:${GRAV[e.gravedad]||'var(--gray-soft)'};${e.gravedad==='media'?'':'color:#fff'}">${e.gravedad||''}</span></div>
    <div style="font-size:13px;margin-top:3px">${e.descripcion||''}</div>
    ${e.accion?`<div style="font-size:12px;opacity:.75;margin-top:2px"><b>Acción:</b> ${e.accion}</div>`:''}
    <div style="font-family:var(--font-mono);font-size:10px;opacity:.45;margin-top:4px">${e.responsable||''} · ${fmtHora(e.created_at)} · ✏️ editar</div></div></div>`;}
function renderEventualidades(){
  const hoy=hoyISO();const ev=state.eventualidades||[];
  const byDay={};ev.forEach(e=>{(byDay[e.fecha]=byDay[e.fecha]||[]).push(e);});
  const dias=Object.keys(byDay).sort().reverse();
  $('#screen').innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
     <div style="flex:1;font-family:var(--font-mono);font-size:11px;opacity:.6">Reporte de eventualidades · cierre del día 📝</div>
     <button class="btn-ico primary" id="ev-send" style="width:auto"><span class="material-symbols-outlined" style="font-size:16px">mail</span>Enviar reporte de hoy</button></div>`+
   (dias.length?dias.map(d=>`<div class="grp-t" style="margin:14px 0 8px">${d===hoy?'Hoy · ':''}${d}</div>`+byDay[d].map(eventCard).join('')).join(''):'<div class="empty">Sin eventualidades. Toca «+ Eventualidad».</div>');
  const sb1=$('#ev-send');if(sb1)sb1.onclick=enviarReporte;
  $$('#screen .evcard').forEach(c=>c.onclick=()=>eventSheet(state.eventualidades.find(e=>e.id===c.dataset.id)));
}
function eventSheet(rec){
  const ed=!!rec, v=s=>(s||'').replace(/"/g,'&quot;');
  setHead('📝',ed?'Editar eventualidad':'Nueva eventualidad','Reporte del turno');
  $('#sheet-body').innerHTML=`
   <div class="sheet-section" style="display:flex;gap:10px"><div style="flex:1"><div class="field-lbl">Fecha</div><input class="input" id="ve-fec" type="date" value="${ed?rec.fecha:hoyISO()}"></div>
     <div style="flex:1"><div class="field-lbl">Turno</div><select class="input" id="ve-tur"><option value="almuerzo">Almuerzo</option><option value="cena">Cena</option></select></div></div>
   <div class="sheet-section" style="display:flex;gap:10px"><div style="flex:1"><div class="field-lbl">Tipo</div><input class="input" id="ve-tipo" value="${ed?v(rec.tipo):''}" placeholder="Servicio, Cocina, Equipo…"></div>
     <div style="flex:1"><div class="field-lbl">Gravedad</div><select class="input" id="ve-grav"><option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option></select></div></div>
   <div class="sheet-section"><div class="field-lbl">Descripción</div><textarea class="input" id="ve-desc">${ed&&rec.descripcion?rec.descripcion:''}</textarea></div>
   <div class="sheet-section"><div class="field-lbl">Acción tomada</div><textarea class="input" id="ve-acc">${ed&&rec.accion?rec.accion:''}</textarea></div>
   <div class="sheet-section"><div class="field-lbl">Responsable</div><input class="input" id="ve-resp" value="${ed?v(rec.responsable):''}"></div>
   <div class="sheet-section"><button class="btn primary" id="ve-save" style="width:100%">${ed?'Guardar cambios':'Registrar'}</button>${ed?'<button class="btn ghost" id="ve-del" style="width:100%;margin-top:8px;color:var(--secondary)">Eliminar</button>':''}</div>`;
  openSheet();
  if(ed){if($('#ve-tur'))$('#ve-tur').value=rec.turno||'cena';if($('#ve-grav'))$('#ve-grav').value=rec.gravedad||'baja';}
  $('#ve-save').onclick=async()=>{const d=$('#ve-desc').value.trim();if(!d){toast('Escribe la descripción','warn');return}
    const payload={fecha:$('#ve-fec').value,turno:$('#ve-tur').value,tipo:$('#ve-tipo').value||null,gravedad:$('#ve-grav').value,descripcion:d,accion:$('#ve-acc').value||null,responsable:$('#ve-resp').value||null};
    const{error}=ed?await sb.from('lb_eventualidades').update(payload).eq('id',rec.id):await sb.from('lb_eventualidades').insert(Object.assign({marca_id:MARCA,local_id:LOCAL},payload));
    if(error){toast('Atrás: '+error.message,'err');return}closeSheet();await loadEventualidades();render();toast(ed?'Va · actualizado':'Servido · eventualidad registrada','ok')};
  if(ed)$('#ve-del').onclick=async()=>{if(!confirm('¿Eliminar?'))return;await sb.from('lb_eventualidades').delete().eq('id',rec.id);closeSheet();await loadEventualidades();render();toast('Eliminado','ok')};
}
async function enviarReporte(){
  toast('Generando reporte…');
  try{const{data,error}=await sb.functions.invoke('reporte-diario',{body:{local_id:LOCAL,fecha:hoyISO()}});
    if(error){toast('Atrás: '+error.message,'err');return}
    const r=(data&&data.resultados&&data.resultados[0])||{};
    if(r.sent)toast('Servido · reporte enviado a '+((r.recipients||[]).length)+' correos','ok');
    else toast('Reporte generado ('+(r.eventualidades||0)+' eventualidades). Falta configurar el correo.','warn');
  }catch(e){toast('Atrás: '+(e.message||e),'err');}
}
function renderTablon(){
  const list=state.posts.filter(p=>p.tipo==='comunicado'||p.tipo==='politica');
  // Mensaje del día = comunicado más reciente (prioriza alta/fijado)
  const dia=[...list].sort((a,b)=>((b.prioridad==='alta')-(a.prioridad==='alta'))||((b.fijado)-(a.fijado))||(new Date(b.created_at)-new Date(a.created_at)))[0];
  let banner='';
  if(dia){const lec=lecturasDe(dia.id).length, leido=yaLeido(dia.id);
    banner=`<div class="post fij" style="border-left-color:var(--primary);margin-bottom:14px" data-dia="${dia.id}">
      <div class="meta" style="margin-top:0"><span class="tagx cat">📣 Mensaje del día</span>${dia.prioridad==='alta'?'<span class="tagx alta">Importante</span>':''}</div>
      <h3 style="margin-top:6px">${(dia.titulo||'').replace(/</g,'&lt;')}</h3>
      <div class="ex">${(dia.contenido||'').replace(/</g,'&lt;')}</div>
      <div class="meta"><span>👁 ${lec} leyeron</span></div>
      <div style="margin-top:10px">${leido?'<span class="prog full">✓ Leído</span>':'<button class="btn primary" id="dia-leer" style="width:auto;min-height:40px;padding:8px 16px">Confirmar lectura</button>'}</div>
    </div>`;
  }
  const orden=[...list].sort((a,b)=>((b.fijado?1:0)-(a.fijado?1:0))||(new Date(b.created_at)-new Date(a.created_at)));
  $('#screen').innerHTML=banner+(orden.length?`<div class="board">${orden.map(noteCard).join('')}</div>`:'<div class="empty">Sin comunicados</div>');
  const lb=$('#dia-leer');if(lb)lb.onclick=(e)=>{e.stopPropagation();confirmarLectura(dia.id)};
  $$('#screen .post[data-id],#screen .note[data-id]').forEach(c=>c.onclick=()=>verPost(state.posts.find(p=>p.id===c.dataset.id)));
  const db=$('#screen .post[data-dia]');if(db)db.onclick=()=>verPost(dia);
}
function renderProcs(){
  const list=state.posts.filter(p=>p.tipo==='procedimiento');
  const cats=['todas',...new Set(list.map(p=>p.categoria).filter(Boolean))];
  const fl=state.cat==='todas'?list:list.filter(p=>p.categoria===state.cat);
  $('#screen').innerHTML=`<div class="chips">${cats.map(c=>`<button class="chip ${state.cat===c?'active':''}" data-c="${c}">${c==='todas'?'Todas':c}</button>`).join('')}</div>`+(fl.map(postCard).join('')||'<div class="empty">Sin procedimientos</div>');
  $$('#screen .chip[data-c]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.c;renderProcs()});
  $$('#screen .post').forEach(c=>c.onclick=()=>verPost(state.posts.find(p=>p.id===c.dataset.id)));
}
function verPost(p){
  setHead(p.tipo==='procedimiento'?'📖':p.tipo==='politica'?'📋':'📣',p.titulo,(p.categoria||'')+' · '+(p.autor||'')+' · '+fechaCorta(p.created_at));
  const lec=lecturasDe(p.id), leido=yaLeido(p.id);
  const lecBlock=(p.tipo==='comunicado'||p.tipo==='politica')?`<div class="sheet-section">
      <div class="field-lbl">Confirmación de lectura (${lec.length})</div>
      ${leido?'<div class="prog full" style="display:inline-block">✓ Ya confirmaste tu lectura</div>':'<button class="btn primary" id="p-leer"><span class="material-symbols-outlined">done_all</span>Confirmar lectura</button>'}
      ${lec.length?`<div class="meta" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">${lec.map(l=>`<span class="tagx cat">${(l.empleado||'').replace(/</g,'&lt;')}</span>`).join('')}</div>`:'<div class="empty" style="padding:14px">Nadie ha confirmado aún</div>'}
    </div>`:'';
  $('#sheet-body').innerHTML=`<div class="sheet-section"><div class="contenido">${(p.contenido||'').replace(/</g,'&lt;')}</div></div>
    ${p.adjunto_url?`<div class="sheet-section"><a class="btn ghost" href="${p.adjunto_url}" target="_blank" rel="noopener"><span class="material-symbols-outlined">attach_file</span>Ver adjunto</a></div>`:''}
    ${lecBlock}
    <div class="sheet-section"><div class="grid2"><button class="btn ghost" id="p-edit"><span class="material-symbols-outlined">edit</span>Editar</button>${p.tipo==='comunicado'?`<button class="btn ghost" id="p-fij">${p.fijado?'Desfijar':'Fijar 📌'}</button>`:'<div></div>'}</div></div>`;
  openSheet();
  if($('#p-leer'))$('#p-leer').onclick=async()=>{await confirmarLectura(p.id);verPost(state.posts.find(x=>x.id===p.id)||p);};
  $('#p-edit').onclick=()=>editarPost(p);
  if($('#p-fij'))$('#p-fij').onclick=async()=>{await sb.from('lb_posts').update({fijado:!p.fijado}).eq('id',p.id);await loadPosts();closeSheet();render();toast('Va · actualizado','ok')};
}
function editarPost(p){
  const ed=!!p;const tipo=p?p.tipo:(state.view==='procedimientos'?'procedimiento':'comunicado');
  const c=Object.assign({titulo:'',categoria:'',contenido:'',autor:'Gerencia',prioridad:'normal'},p||{});
  setHead('✏️',ed?'Editar':'Nuevo '+(tipo==='procedimiento'?'procedimiento':'comunicado'),'El Libro');
  $('#sheet-body').innerHTML=`
    <div class="sheet-section"><div class="field-lbl">Título</div><input class="input" id="x-tit" value="${(c.titulo||'').replace(/"/g,'&quot;')}"></div>
    ${tipo==='procedimiento'?`<div class="sheet-section"><div class="field-lbl">Categoría</div><div class="chips" id="x-catchips">${['HACCP','Manual de posición','Onboarding','Seguridad','Cocina','Salón','Bar','General'].map(x=>`<button class="chip ${c.categoria===x?'active':''}" data-cc="${x}">${x}</button>`).join('')}</div></div>`:''}
    <div class="sheet-section grid2"><div><div class="field-lbl">Categoría${tipo==='procedimiento'?' (o escribe otra)':''}</div><input class="input" id="x-cat" value="${c.categoria||''}" placeholder="Cocina, Salón…"></div><div><div class="field-lbl">Autor</div><input class="input" id="x-aut" value="${c.autor||''}"></div></div>
    ${tipo!=='procedimiento'?`<div class="sheet-section"><div class="field-lbl">Prioridad</div><div class="chips" id="x-pri">${['normal','alta'].map(x=>`<button class="chip ${c.prioridad===x?'active':''}" data-p="${x}">${x}</button>`).join('')}</div></div>`:''}
    <div class="sheet-section"><div class="field-lbl">Contenido</div><textarea class="input" id="x-cont" placeholder="Escribe aquí…">${c.contenido||''}</textarea></div>
    <div class="sheet-section"><button class="btn primary" id="x-save"><span class="material-symbols-outlined">save</span>Guardar</button></div>`;
  let pri=c.prioridad;if($('#x-pri'))$$('#x-pri .chip').forEach(b=>b.onclick=()=>{pri=b.dataset.p;$$('#x-pri .chip').forEach(x=>x.classList.toggle('active',x.dataset.p===pri))});
  $$('#x-catchips .chip').forEach(b=>b.onclick=()=>{$('#x-cat').value=b.dataset.cc;$$('#x-catchips .chip').forEach(x=>x.classList.toggle('active',x.dataset.cc===b.dataset.cc))});
  $('#x-save').onclick=async()=>{const tit=$('#x-tit').value;if(!tit){toast('Falta título','warn');return}
    const payload={marca_id:MARCA,local_id:LOCAL,tipo,titulo:tit,categoria:$('#x-cat').value,autor:$('#x-aut').value,contenido:$('#x-cont').value,prioridad:pri,updated_at:nowISO()};
    const{error}=ed?await sb.from('lb_posts').update(payload).eq('id',p.id):await sb.from('lb_posts').insert(payload);
    if(error){toast('Atrás: '+error.message,'err');return}closeSheet();await loadPosts();render();toast('Servido · publicado','ok')};
  openSheet();
}

function runDe(cl){return state.runs.find(r=>r.checklist_id===cl.id)}
function items(cl){return Array.isArray(cl.items)?cl.items:[]}
function runCompleto(cl){const r=runDe(cl);if(!r)return false;const e=r.estados||{};return items(cl).length>0&&items(cl).every((_,i)=>e[i])}
function runHechos(cl){const r=runDe(cl);if(!r)return 0;const e=r.estados||{};return items(cl).filter((_,i)=>e[i]).length}
function renderChecklists(){
  $('#screen').innerHTML=`<div class="grp-t">Checklists de hoy · ${hoyISO()}</div>`+(state.checklists.map(cl=>{const tot=items(cl).length,h=runHechos(cl);const cls=h===0?'none':h===tot?'full':'part';
    return `<div class="clk" data-id="${cl.id}"><div><div style="font-weight:700;font-size:15px">${cl.nombre}</div><div style="font-family:var(--font-mono);font-size:11px;opacity:.6">${cl.area||''} · ${cl.turno||''}</div></div><span class="prog ${cls}">${h}/${tot}</span></div>`;
  }).join('')||'<div class="empty">Sin checklists</div>');
  $$('#screen .clk').forEach(c=>c.onclick=()=>abrirChecklist(state.checklists.find(x=>x.id===c.dataset.id)));
}
function abrirChecklist(cl){
  const its=items(cl);let r=runDe(cl);let est=Object.assign({},(r&&r.estados)||{});
  setHead('✅',cl.nombre,(cl.area||'')+' · '+(cl.turno||'')+' · hoy');
  const draw=()=>{const h=its.filter((_,i)=>est[i]).length;
    $('#sheet-body').innerHTML=`<div class="sheet-section"><div class="field-lbl">${h}/${its.length} completado</div>
      ${its.map((it,i)=>`<div class="chkitem ${est[i]?'on':''}" data-i="${i}"><div class="box ${est[i]?'on':''}">${est[i]?'<span class="material-symbols-outlined" style="font-size:18px">check</span>':''}</div><span class="tx">${it}</span></div>`).join('')}</div>
      <div class="sheet-section"><div class="field-lbl">Responsable</div><input class="input" id="ck-resp" value="${(r&&r.completado_por)||''}" placeholder="Quién lo completa"></div>
      <div class="sheet-section"><button class="btn primary" id="ck-save"><span class="material-symbols-outlined">save</span>Guardar checklist</button></div>`;
    $$('#sheet-body .chkitem').forEach(el=>el.onclick=()=>{const i=el.dataset.i;est[i]=!est[i];draw()});
    $('#ck-save').onclick=()=>guardarRun(cl,est,$('#ck-resp').value);
  };draw();openSheet();
}
async function guardarRun(cl,est,resp){
  const payload={checklist_id:cl.id,local_id:LOCAL,fecha:hoyISO(),turno:cl.turno,completado_por:resp||null,estados:est};
  const{error}=await sb.from('lb_checklist_runs').upsert(payload,{onConflict:'checklist_id,fecha'});
  if(error){toast('Atrás: '+error.message,'err');return}closeSheet();await loadRuns();render();toast('Servido · checklist guardado','ok');
}

function renderBitacora(){

  procedimientos:['SOPs y manuales de operación','#171c20'],recetario:['Fichas de cocina y bar','#ff3b30'],

function tileBadge(k){
  if(k==='checklists'){const p=state.checklists.filter(c=>!runCompleto(c)).length;return p?[p+' pendiente'+(p>1?'s':''),'']:null}
  if(k==='eventualidades'){const n=(state.eventualidades||[]).filter(e=>e.fecha===hoyISO()).length;return n?[n+' hoy','']:null}
  if(k==='jefeservicio'){const v=state.js.tareas.filter(tareaVencida).length,a=state.js.tareas.filter(t=>t.estado!=='hecha').length;
    return v?[v+' vencida'+(v>1?'s':''),'red']:a?[a+' tarea'+(a>1?'s':'')+' abierta'+(a>1?'s':''),'']:null}
  if(k==='minutas'){const a=state.minutas.reduce((n,m)=>n+(m.acuerdos||[]).filter(x=>!x.hecho).length,0);return a?[a+' acuerdo'+(a>1?'s':'')+' abierto'+(a>1?'s':''),'']:state.minutas.length?[state.minutas.length+' minuta'+(state.minutas.length>1?'s':''),'']:null}
  if(k==='examenes'){const n=(state.examenes||[]).filter(e=>e.activo!==false).length;return n?[n+' activo'+(n>1?'s':''),'']:null}
  return null;
}

/* ---------- Jefe de Servicio (corporativo: va por marca, no por sede) ----------
   Tablas lb_js_plan, lb_js_kpis, lb_js_kpi_valores, lb_js_tareas, lb_js_dias (RLS por marca).
   Edita la gerencia o un rol con El Libro >= operar; el resto solo lee. */
const JS_TABS=[['plan','Plan de trabajo','map'],['kpi','KPI','monitoring'],['tareas','Tareas','task_alt'],['dia','Plan del día','today']];
const JS_ESTADOS=[['pendiente','Pendiente'],['en_proceso','En proceso'],['bloqueada','Bloqueada'],['hecha','Hecha']];
const JS_PLAN_BASE=['Objetivo del puesto','Responsabilidades','Rutina semanal y visitas a los locales','Estándares de servicio que audita','Formación del equipo','Reportes y reuniones'];
async function loadJS(){
  try{const[p,k,v,t,d]=await Promise.all([
      sb.from('lb_js_plan').select('*').eq('marca_id',MARCA).order('orden').order('created_at'),
      sb.from('lb_js_kpis').select('*').eq('marca_id',MARCA).eq('activo',true).order('orden').order('created_at'),
      sb.from('lb_js_kpi_valores').select('*').eq('marca_id',MARCA).order('fecha',{ascending:false}).limit(600),
      sb.from('lb_js_tareas').select('*').eq('marca_id',MARCA).order('created_at',{ascending:false}).limit(400),
      sb.from('lb_js_dias').select('*').eq('marca_id',MARCA).order('fecha',{ascending:false}).limit(90)]);
    state.js={plan:p.data||[],kpis:k.data||[],vals:v.data||[],tareas:t.data||[],dias:d.data||[]};
  }catch(e){state.js={plan:[],kpis:[],vals:[],tareas:[],dias:[]}}
}
async function loadLocales(){try{const{data}=await sb.from('inv_locales').select('id,nombre').eq('marca_id',MARCA).order('id');state.locales=data||[]}catch(e){state.locales=[]}}
function jsEdit(){return !!(state.esAdmin||state.puedeRecetas)}
const escA=t=>escH(t).replace(/"/g,'&quot;');
function sedeNombre(id){const l=state.locales.find(x=>x.id===id);return l?l.nombre:id}
function sedeOpts(sel){return `<option value="">Todas / corporativo</option>`+state.locales.map(l=>`<option value="${l.id}" ${sel===l.id?'selected':''}>${escH(l.nombre)}</option>`).join('')}
function fmtN(n,u){if(n==null||n==='')return'—';const x=Number(n);const s=Number.isInteger(x)?String(x):String(Math.round(x*10)/10);return u==='%'?s+'%':u==='S/'?'S/ '+s:(u?s+' '+u:s)}
function fechaLarga(f){try{const d=new Date(f+'T12:00:00');return d.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'})}catch(e){return f}}
function sumDias(f,n){const d=new Date(f+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function kpiVals(k){return state.js.vals.filter(v=>v.kpi_id===k.id).sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0)}
function kpiOk(k,val){if(val==null||k.meta==null)return null;return k.sentido==='menor'?Number(val)<=Number(k.meta):Number(val)>=Number(k.meta)}
function tareaVencida(t){return t.estado!=='hecha'&&!!t.vence&&t.vence<hoyISO()}
function estadoLbl(e){const x=JS_ESTADOS.find(s=>s[0]===e);return x?x[1]:e}
function diaDe(f){return state.js.dias.find(d=>d.fecha===f)}
function diaPct(d){const it=(d&&Array.isArray(d.items))?d.items:[];return it.length?Math.round(it.filter(i=>i.hecho).length*100/it.length):null}
async function jsReload(){await loadJS();render()}

function jsKpiHTML(){const K=state.js.kpis,ed=jsEdit();

/* Plan del día: agenda por horas con check de cumplimiento, foco y cierre */
function jsDiaHTML(){state.jsFecha=state.jsFecha||hoyISO();const f=state.jsFecha,d=diaDe(f),ed=jsEdit(),hoy=hoyISO();
  const it=(d&&Array.isArray(d.items))?d.items:[],pct=diaPct(d);

  return `<div class="jday"><button class="btn-ico" data-jd="-1" style="width:auto" title="Día anterior"><span class="material-symbols-outlined">chevron_left</span></button>
      <div class="dt">${f===hoy?'Hoy · ':''}${fechaLarga(f)}</div>
      ${f!==hoy?`<button class="btn-ico" data-jd="0" style="width:auto">Hoy</button>`:''}
      <button class="btn-ico" data-jd="1" style="width:auto" title="Día siguiente"><span class="material-symbols-outlined">chevron_right</span></button>
      ${ed?`<button class="btn-ico primary" data-jsa="dia-editar" style="width:auto"><span class="material-symbols-outlined" style="font-size:16px">edit_calendar</span>${d?'Editar plan':'Armar plan'}</button>`:''}</div>
    ${pct!=null?`<div class="mono" style="font-size:11px;font-weight:700;margin-bottom:4px">${it.filter(i=>i.hecho).length} de ${it.length} hechas · ${pct}%</div><div class="jprog"><span style="width:${pct}%"></span></div>`:''}
    ${d&&d.notas?`<div class="jcard"><div class="field-lbl">Foco del día</div><div class="contenido" style="font-size:14px">${escH(d.notas)}</div></div>`:''}
    <div class="jcard">${it.length?it.map((x,i)=>`<div class="jitem ${x.hecho?'on':''}"><button class="box ${x.hecho?'on':''}" data-ji="${i}" ${ed?'':'disabled'}>${x.hecho?'<span class="material-symbols-outlined" style="font-size:18px">check</span>':''}</button><span class="hr">${escH(x.hora||'')}</span><div style="flex:1;min-width:0"><div class="ac" style="font-size:14px;font-weight:600">${escH(x.actividad||'')}</div>${x.local_id?`<div class="mono" style="font-size:10.5px;opacity:.6">${escH(sedeNombre(x.local_id))}</div>`:''}</div></div>`).join('')
      :`<div class="empty" style="padding:24px">Sin plan para este día.${ed?' Toca «Armar plan».':''}</div>`}</div>
    ${d&&d.cierre?`<div class="jcard" style="border-left:7px solid var(--green)"><div class="field-lbl">Cierre del día</div><div class="contenido" style="font-size:14px">${escH(d.cierre)}</div></div>`:''}
    ${pend.length?`<div class="grp-t">Tareas que vencen hasta este día</div>`+pend.map(t=>`<div class="jtask ${tareaVencida(t)?'venc':''}" data-jtk="${t.id}"><div style="flex:1;min-width:0"><div class="jtt">${escH(t.titulo)}</div><div class="jtm"><span>${t.vence}</span>${t.local_id?`<span>${escH(sedeNombre(t.local_id))}</span>`:''}</div></div><span class="tagx js-${t.estado}">${estadoLbl(t.estado)}</span></div>`).join(''):''}
    ${hist.length?`<div class="grp-t">Días anteriores</div>`+hist.map(x=>{const p=diaPct(x);return `<div class="clk" data-jdf="${x.fecha}"><span style="font-weight:600">${fechaLarga(x.fecha)}</span><span class="prog ${p===100?'full':p?'part':'none'}">${p==null?'—':p+'%'}</span></div>`}).join(''):''}`;

  const draw=()=>{$('#sheet-body').innerHTML=`<div class="sheet-section"><div class="field-lbl">Foco del día</div><textarea class="input" id="jd-n" style="min-height:70px" placeholder="Lo más importante de hoy">${escH((d&&d.notas)||'')}</textarea></div>

      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="jd-add" style="flex:1">+ Agregar actividad</button>${!d&&prev?`<button class="btn ghost" id="jd-copy" style="flex:1">Copiar plan del ${fechaCorta(prev.fecha+'T12:00:00')}</button>`:''}</div></div>
    <div class="sheet-section"><div class="field-lbl">Cierre del día</div><textarea class="input" id="jd-c" style="min-height:80px" placeholder="Qué se logró, qué queda pendiente">${escH((d&&d.cierre)||'')}</textarea></div>

    $('#jd-add').onclick=()=>{harvest();rows.push({hora:'',actividad:'',local_id:'',hecho:false});const n=$('#jd-n').value,c=$('#jd-c').value;draw();$('#jd-n').value=n;$('#jd-c').value=c};

    if($('#jd-copy'))$('#jd-copy').onclick=()=>{rows=prev.items.map(x=>({hora:x.hora||'',actividad:x.actividad||'',local_id:x.local_id||'',hecho:false}));const n=$('#jd-n').value,c=$('#jd-c').value;draw();$('#jd-n').value=n;$('#jd-c').value=c};
    $('#jd-s').onclick=async()=>{harvest();const items=rows.filter(r=>r.actividad.trim()).map(r=>({hora:r.hora,actividad:r.actividad.trim(),local_id:r.local_id||null,hecho:!!r.hecho})).sort((a,b)=>(a.hora||'99')<(b.hora||'99')?-1:1);

      if(error){toast('Atrás: '+error.message,'err');return}closeSheet();await jsReload();toast('Servido · plan del día guardado','ok')};
  };draw();openSheet();
}
async function jsToggleItem(i){const d=diaDe(state.jsFecha);if(!d)return;const items=d.items.map(x=>Object.assign({},x));items[i].hecho=!items[i].hecho;

/* ---------- Minutas de reunión (por marca) ----------

    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
      <input class="input" id="mnt-q" placeholder="Buscar en las minutas" value="${escA(state.mntQ||'')}" style="flex:1;min-width:200px">
      ${ed?`<button class="btn-ico primary" id="mnt-new"><span class="material-symbols-outlined" style="font-size:16px">add</span>Nueva minuta</button>`:''}</div>
    ${abiertos?`<div class="mm" style="font-family:var(--font-mono);font-size:12px;margin-bottom:10px">${abiertos} acuerdo${abiertos>1?'s':''} abierto${abiertos>1?'s':''}</div>`:''}
    ${L.length?L.map(m=>{const d=new Date(m.fecha+'T12:00:00'),ac=m.acuerdos||[],pend=ac.filter(x=>!x.hecho).length;
      return `<div class="mnt" data-mn="${m.id}"><div class="mf"><b>${d.getDate()}</b><span>${MESES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</span></div>
        <div style="flex:1;min-width:0"><h3>${escH(m.titulo)}</h3><div class="mm">${m.asistentes?escH(m.asistentes.split('\n').join(', ')).slice(0,120):'Sin asistentes'}</div>
        <div class="mm" style="margin-top:4px">${ac.length?ac.length+' acuerdo'+(ac.length>1?'s':'')+(pend?' · '+pend+' abierto'+(pend>1?'s':''):' · todos cerrados'):'Sin acuerdos'}${m.proxima?' · próxima: '+fechaLarga(m.proxima):''}</div></div>
        <span class="material-symbols-outlined" style="opacity:.4">chevron_right</span></div>`}).join('')
      :`<div class="empty">${state.minutas.length?'Nada coincide con la búsqueda.':'Todavía no hay minutas.'}</div>`}`;

  const harvest=()=>{ac=$$('#sheet-body .ma-row').map(r=>({texto:r.querySelector('[data-f=t]').value.trim(),responsable:r.querySelector('[data-f=r]').value.trim(),vence:r.querySelector('[data-f=v]').value||null,hecho:r.querySelector('[data-f=h]').checked}))};
  const draw=()=>{
    const keep=$('#sheet-body').querySelector('#mn-t')?{t:$('#mn-t').value,f:$('#mn-f').value,l:$('#mn-l').value,a:$('#mn-a').value,g:$('#mn-g').value,d:$('#mn-d').value,p:$('#mn-p').value}:{t:ed?m.titulo:'',f:ed?m.fecha:hoyISO(),l:ed?(m.lugar||''):'',a:ed?(m.asistentes||''):'',g:ed?(m.agenda||''):'',d:ed?(m.desarrollo||''):'',p:ed?(m.proxima||''):''};
    $('#sheet-body').innerHTML=`<div class="sheet-section"><div class="field-lbl">Título</div><input class="input" id="mn-t" value="${escA(keep.t)}" placeholder="Ej. Comité de operaciones"></div>
      <div class="sheet-section" style="display:flex;gap:8px"><div style="flex:1"><div class="field-lbl">Fecha</div><input class="input" id="mn-f" type="date" value="${keep.f}"></div><div style="flex:1"><div class="field-lbl">Lugar</div><input class="input" id="mn-l" value="${escA(keep.l)}" placeholder="Local, oficina o virtual"></div></div>
      <div class="sheet-section"><div class="field-lbl">Asistentes</div><textarea class="input" id="mn-a" style="min-height:70px" placeholder="Uno por línea">${escH(keep.a)}</textarea></div>
      <div class="sheet-section"><div class="field-lbl">Agenda</div><textarea class="input" id="mn-g" style="min-height:80px" placeholder="Un tema por línea">${escH(keep.g)}</textarea></div>
      <div class="sheet-section"><div class="field-lbl">Desarrollo</div><textarea class="input" id="mn-d" style="min-height:180px" placeholder="Lo que se conversó">${escH(keep.d)}</textarea></div>
      <div class="sheet-section"><div class="field-lbl">Acuerdos</div>${ac.map((a,i)=>`<div class="ma-row" style="border:2px solid var(--outline);border-radius:10px;padding:8px;margin-bottom:6px">
          <input class="input" data-f="t" value="${escA(a.texto||'')}" placeholder="Acuerdo">
          <div style="display:flex;gap:6px;margin-top:6px;align-items:center"><input class="input" data-f="r" value="${escA(a.responsable||'')}" placeholder="Responsable" style="flex:1"><input class="input" data-f="v" type="date" value="${a.vence||''}" style="flex:1">
          <label style="display:flex;gap:4px;align-items:center;font-size:12px"><input type="checkbox" data-f="h" ${a.hecho?'checked':''}>Hecho</label>
          <button class="btn-ico" data-mq="${i}" title="Quitar"><span class="material-symbols-outlined" style="font-size:16px">close</span></button></div></div>`).join('')}
        <button class="btn ghost" id="mn-add">+ Agregar acuerdo</button></div>
      <div class="sheet-section"><div class="field-lbl">Próxima reunión</div><input class="input" id="mn-p" type="date" value="${keep.p||''}"></div>
      <button class="btn primary" id="mn-save" style="width:100%">${ed?'Guardar cambios':'Guardar minuta'}</button>`;
    $('#mn-add').onclick=()=>{harvest();ac.push({texto:'',responsable:'',vence:null,hecho:false});draw()};
    $$('#sheet-body [data-mq]').forEach(b=>b.onclick=()=>{harvest();ac.splice(Number(b.dataset.mq),1);draw()});
    $('#mn-save').onclick=async()=>{harvest();const t=$('#mn-t').value.trim();if(!t){toast('Ponle un título','err');return}
      const row={marca_id:MARCA,titulo:t,fecha:$('#mn-f').value||hoyISO(),lugar:$('#mn-l').value.trim()||null,asistentes:$('#mn-a').value.trim()||null,agenda:$('#mn-g').value.trim()||null,desarrollo:$('#mn-d').value.trim()||null,acuerdos:ac.filter(a=>a.texto),proxima:$('#mn-p').value||null,updated_at:nowISO()};
      const btn=$('#mn-save');btn.disabled=true;btn.textContent='Oído…';
      const{error}=ed?await sb.from('lb_minutas').update(row).eq('id',m.id):await sb.from('lb_minutas').insert(row);
      if(error){btn.disabled=false;btn.textContent='Guardar';toast('Atrás: '+error.message,'err');return}
      closeSheet();await loadMinutas();render();toast('Servido · minuta guardada','ok')};
  };draw();openSheet();
}

function subscribe(){if(state.channel)sb.removeChannel(state.channel);state.channel=sb.channel('lb_'+LOCAL)
  .on('postgres_changes',{event:'*',schema:'public',table:'lb_posts',filter:'local_id=eq.'+LOCAL},async()=>{await loadPosts();render()})
  .on('postgres_changes',{event:'*',schema:'public',table:'lb_bitacora',filter:'local_id=eq.'+LOCAL},async()=>{await loadBitacora();render()})
  .on('postgres_changes',{event:'*',schema:'public',table:'lb_lecturas',filter:'local_id=eq.'+LOCAL},async()=>{await loadLecturas();render()})
  .subscribe()}
$('#sheet-close').addEventListener('click',closeSheet);$('#backdrop').addEventListener('click',closeSheet);$('#h-add').addEventListener('click',nuevo);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
loadAll().catch(err=>{console.error(err);$('#boot .msg').textContent='Atrás · '+(err.message||'fallo')});
</script>
</body>
</html>
