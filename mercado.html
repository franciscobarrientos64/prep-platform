<style>

html,body{height:100%}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}

.chip:active{transform:translate(1px,1px);box-shadow:none}.chip.active{background:var(--ink);color:var(--bg)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:2px solid var(--outline);border-radius:12px;overflow:hidden}

.tbl tr.best td{background:var(--green-soft)}
.tbl tr.rojo td{background:var(--red-soft)}
.tbl tr.amar td{background:var(--amber-soft)}
.empty-state{text-align:center;padding:50px 20px;font-family:var(--font-mono);font-size:12px;opacity:.55;text-transform:uppercase;letter-spacing:.08em}
.com-stepper{display:flex;align-items:center;gap:12px}
.com-stepper button{width:44px;height:44px;border:2px solid var(--outline);border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);font-size:22px;font-family:var(--font-display);line-height:0}
.com-stepper .num{font-family:var(--font-display);font-size:30px;min-width:70px;text-align:center}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--surface);border-top:3px solid var(--outline);border-radius:24px 24px 0 0;box-shadow:0 -10px 0 0 var(--outline);transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);max-height:90vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0)}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:48px;height:5px;background:var(--outline);border-radius:999px;margin:12px auto 8px;opacity:.3}
.sheet-head{padding:6px 24px 14px;border-bottom:2px solid var(--outline);display:flex;align-items:center;gap:14px}
.sheet-mark{width:50px;height:50px;border:2px solid var(--outline);border-radius:12px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.sheet-title{flex:1}.sheet-title h2{font-family:var(--font-display);font-size:22px;line-height:1;margin-bottom:4px}
.sheet-title .meta{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.65}
.sheet-close{width:40px;height:40px;border:2px solid var(--outline);border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.sheet-body{padding:18px 24px 28px;overflow-y:auto}
.sheet-section+.sheet-section{margin-top:16px}
.info-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--gray-soft);font-size:14px}
.info-row strong{font-family:var(--font-mono);font-weight:600}
.toast-container{position:fixed;top:76px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border:2px solid var(--outline);border-radius:12px;padding:12px 18px;font-size:14px;font-weight:600;box-shadow:var(--shadow);animation:tin .3s;display:flex;align-items:center;gap:10px;max-width:340px}
.toast.ok{background:var(--primary);color:#fff}.toast.err{background:var(--secondary);color:#fff}.toast.warn{background:var(--tertiary)}
@keyframes tin{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.boot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:300;transition:opacity .3s}
.boot.gone{opacity:0;pointer-events:none}
.boot .logo{position:relative;width:220px;height:73px}
.boot .msg{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;opacity:.6}
.boot .spinner{width:34px;height:34px;border:4px solid var(--outline);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}

@media(max-width:640px){.row-card{grid-template-columns:auto 1fr}.row-right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}

.pf-cb{flex:1;min-width:0}
.pf-cn{font-weight:700;font-size:14px;line-height:1.25}
.pf-cm{font-family:var(--font-mono);font-size:11px;opacity:.7;margin-top:2px}
.pf-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pf-dot{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px;border:2px solid var(--outline)}

.pf-vacia{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.5;padding:22px 0;text-align:center;border:2px dashed var(--gray-soft);border-radius:12px}
.pf-ghost{position:fixed;left:0;top:0;z-index:700;pointer-events:none;background:var(--ink);color:var(--bg);font-weight:600;font-size:13px;padding:8px 12px;border:2px solid var(--outline);border-radius:10px;box-shadow:var(--shadow-sm);white-space:nowrap}

@media(max-width:640px){.pf-board{grid-template-columns:1fr}}
</style>

<script>
/* ===== PREP! · Módulo 05 · MERCADO (Compras + Inventario) ===== */

async function loadVentasItems(){const desde=teoDesde();const out=[];let from=0;const page=1000;
  while(true){const{data,error}=await sb.from('ca_pedido_items').select('receta_id,nombre,qty,estado,precio_total,es_cortesia,pedido_id,ca_pedidos!inner(local_id,created_at,turno_id,mozo_id)')
      .eq('ca_pedidos.local_id',LOCAL).gte('ca_pedidos.created_at',desde).neq('estado','cancelado').order('created_at').range(from,from+page-1);
    if(error){console.error(error);break}out.push(...(data||[]));if(!data||data.length<page)break;from+=page}
  state.ventasItems=out.map(it=>({...it,turno_id:it.ca_pedidos?.turno_id||null,mozo_id:it.ca_pedidos?.mozo_id||null,fecha:(it.ca_pedidos?.created_at||'').slice(0,10)}));

function diffPct(c,r){if(r<=0)return c>0?1:0;return Math.abs(c-r)/r}

/* ===== PARES: MÍNIMO y PAR por sede (y PAR por día de semana) =====
   Mínimo = punto de pedido (bajo eso salta la alerta). PAR = nivel objetivo hasta donde se pide.
   Consumo real = salidas + mermas de los últimos PAR_DIAS días (inv_movimientos).
   PAR sugerido   = consumo/día × (cobertura + días de entrega) × (1 + colchón).
   Mínimo sugerido = consumo/día × días de entrega (mín. 1) × (1 + colchón). */
const PAR_DIAS=28;
const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIAS_XLS=['dom','lun','mar','mie','jue','vie','sab'];
async function loadConsumo(){
  const d=new Date();d.setDate(d.getDate()-PAR_DIAS);const desde=d.toISOString().slice(0,10);
  const m={};let from=0;const page=1000;
  while(true){
    const{data,error}=await sb.from('inv_movimientos').select('producto_id,cantidad').eq('local_id',LOCAL).in('tipo',['salida','merma']).gte('fecha',desde).range(from,from+page-1);
    if(error){toast('Atrás: '+error.message,'err');break}
    (data||[]).forEach(r=>{m[r.producto_id]=(m[r.producto_id]||0)+Math.abs(Number(r.cantidad||0))});
    if(!data||data.length<page)break;from+=page;
  }
  state.consumo=m;
}
async function loadConsumoDias(dias){const d=new Date();d.setDate(d.getDate()-dias);const desde=d.toISOString().slice(0,10);const m={};let from=0;const page=1000;
  while(true){const{data,error}=await sb.from('inv_movimientos').select('producto_id,cantidad').eq('local_id',LOCAL).in('tipo',['salida','merma']).gte('fecha',desde).range(from,from+page-1);if(error)break;(data||[]).forEach(r=>{m[r.producto_id]=(m[r.producto_id]||0)+Math.abs(Number(r.cantidad||0))});if(!data||data.length<page)break;from+=page}
  return m}
async function loadParLocal(){const{data}=await sb.from('inv_par_local').select('*').eq('local_id',LOCAL);const m={};(data||[]).forEach(r=>m[r.producto_id]=r);state.parLocal=m}
async function loadParHist(){const{data}=await sb.from('inv_par_hist').select('*').eq('local_id',LOCAL).order('created_at',{ascending:false}).limit(300);state.parHist=data||[]}
async function loadUsuario(){try{const{data}=await sb.auth.getUser();state.usuario=data?.user?.email||null}catch(e){}}
function diasEntrega(pid){const pp=state.provProd.filter(x=>x.producto_id===pid);const pref=pp.find(x=>x.preferido)||pp[0];return Number(pref?.tiempo_entrega_dias||0)}
function consumoDia(pid){return (state.consumo?.[pid]||0)/PAR_DIAS}
function pasoPar(p){return ['kg','l','g','ml'].includes((p.unidad||'').toLowerCase())?0.5:1}
function redPaso(p,v){const s=pasoPar(p);return Math.ceil(v/s-1e-9)*s}
// Valores guardados (sede activa) con respaldo en inv_productos.par_level
function parBase(p){const r=state.parLocal[p.id];return r?Number(r.par||0):Number(p.par_level||0)}
function minimoDe(p){const r=state.parLocal[p.id];if(r)return Number(r.minimo||0);return redPaso(p,Number(p.par_level||0)*0.5)}
function parDiaMap(p){const r=state.parLocal[p.id];return r&&r.par_dia&&typeof r.par_dia==='object'?r.par_dia:null}
function parDia(p,dow){const m=parDiaMap(p);const v=m?m[String(dow)]:null;return v!=null&&v!==''?Number(v):parBase(p)}
function parHoy(p){return parDia(p,new Date().getDay())}
function fechaEntrega(pid){const d=new Date();d.setDate(d.getDate()+diasEntrega(pid));return d}
function parEntrega(p){return parDia(p,fechaEntrega(p.id).getDay())}
function estadoStock(p){const s=stock(p.id);if(s<=0)return'sin';if(s<minimoDe(p))return'bajo';return'ok'}
function sugerido(p){return Math.max(0,+(parEntrega(p)-stock(p.id)).toFixed(2))}
// Sugeridos por consumo
function parSugeridoConsumo(p){const c=consumoDia(p.id);if(!c)return null;return redPaso(p,c*(state.parCob+diasEntrega(p.id))*(1+state.parSeg/100))}
function minSugeridoConsumo(p){const c=consumoDia(p.id);if(!c)return null;return redPaso(p,c*Math.max(1,diasEntrega(p.id))*(1+state.parSeg/100))}
// Edición en curso: state.parEdits[pid]={minimo?,par?,par_dia?}; state.parOrigen[pid]=manual|excel|sugerido
function ed(p){return state.parEdits[p.id]||{}}
function minActual(p){const e=ed(p);return e.minimo!=null?e.minimo:minimoDe(p)}
function parActual(p){const e=ed(p);return e.par!=null?e.par:parBase(p)}
function parDiaActual(p){const e=ed(p);return e.par_dia!==undefined?e.par_dia:parDiaMap(p)}
function setEdit(pid,campo,v,origen){const p=prod(pid);const e={...(state.parEdits[pid]||{})};
  const orig=campo==='minimo'?minimoDe(p):campo==='par'?parBase(p):parDiaMap(p);
  if(campo==='par_dia'){const iguales=JSON.stringify(v||null)===JSON.stringify(orig||null);if(iguales)delete e.par_dia;else e.par_dia=v}
  else{v=Math.max(0,Number(v)||0);if(v===orig)delete e[campo];else e[campo]=v}
  if(Object.keys(e).length){state.parEdits[pid]=e;state.parOrigen[pid]=origen||state.parOrigen[pid]||'manual'}else{delete state.parEdits[pid];delete state.parOrigen[pid]}}
function desfasado(p){const s=parSugeridoConsumo(p),a=parBase(p);return s!=null&&a>0&&Math.abs(s-a)/a>=0.25}
function listaPares(){return state.productos.filter(p=>(state.parCat==='todas'||p.categoria===state.parCat)&&(!state.parQ||(p.nombre+' '+p.categoria).toLowerCase().includes(state.parQ.toLowerCase())))
  .filter(p=>{if(state.parFiltro==='desfase'){const s=parSugeridoConsumo(p),a=parActual(p);return s!=null&&(a===0||Math.abs(s-a)/Math.max(a,0.01)>=0.25)}if(state.parFiltro==='bajo')return estadoStock(p)!=='ok';return true})}
function chipDias(p){const m=parDiaActual(p);if(!m)return'<span class="row-meta">igual</span>';const b=parActual(p);
  return `<span class="mono" style="font-size:10px">${[2,3,4,5,6,0].map(d=>{const v=m[String(d)];return v!=null&&Number(v)!==b?DIAS[d].slice(0,2)+' '+num(v):''}).filter(Boolean).join(' · ')||'igual'}</span>`}
async function renderPares(){
  if(!state.consumo){$('#screen').innerHTML='<div class="empty-state">Oído · calculando consumo de las últimas 4 semanas…</div>';await loadConsumo();if(state.view!=='pares')return}
  const cats=['todas',...categorias()];const list=listaPares();const nEd=Object.keys(state.parEdits).length;
  const sinPar=state.productos.filter(p=>!parBase(p)).length;
  const bajo=state.productos.filter(p=>estadoStock(p)!=='ok').length;
  const desfase=state.productos.filter(desfasado).length;
  const capital=state.productos.reduce((a,p)=>a+parActual(p)*Number(p.costo||0),0);
  $('#screen').innerHTML=`

async function guardarPares(){

    const row={local_id:LOCAL,producto_id:pid,minimo:e.minimo!=null?e.minimo:minimoDe(p),par:e.par!=null?e.par:parBase(p),par_dia:e.par_dia!==undefined?e.par_dia:parDiaMap(p),updated_at:now,updated_by:quien};
    rows.push(row);

/* Excel: plantilla con ID + insumo + mínimo + PAR (+ PAR por día). Al cargarla se cruza por ID (o nombre) y
   los valores quedan como cambios sin guardar, para revisarlos en la tabla antes de confirmar. */
async function xlsLib(){if(window.XLSX)return window.XLSX;await new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc)});return window.XLSX}
function normTxt(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim()}
async function descargarParesXLS(){
  if(!state.consumo)await loadConsumo();
  let X;try{X=await xlsLib()}catch(e){toast('Atrás: no se pudo cargar el lector de Excel','err');return}
  const rows=state.productos.map(p=>{const m=parDiaActual(p)||{};const r={ID:p.id,Insumo:p.nombre,Categoria:p.categoria||'',Unidad:p.unidad||'',Stock:+stock(p.id).toFixed(2),'Consumo dia':+consumoDia(p.id).toFixed(2),'Minimo sugerido':minSugeridoConsumo(p)??'','PAR sugerido':parSugeridoConsumo(p)??'',Minimo:minActual(p),Par:parActual(p)};
    DIAS_XLS.forEach((d,i)=>r['Par_'+d]=m[i]!=null?m[i]:'');return r});
  const ws=X.utils.json_to_sheet(rows);ws['!cols']=[{wch:14},{wch:34},{wch:14},{wch:8},{wch:8},{wch:11},{wch:14},{wch:12},{wch:9},{wch:8},...DIAS_XLS.map(()=>({wch:8}))];
  const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Pares');
  const cli=(document.querySelector('#app-header .cli')?.textContent||'local').trim().replace(/\s+/g,'-').toLowerCase();
  X.writeFile(wb,`pares-${cli}-${hoyISO()}.xlsx`);
  toast('Servido · edita Minimo y Par (y Par_vie, Par_sab… si quieres) y vuelve a cargar el archivo','ok');
}
async function cargarParesXLS(file){
  let X;try{X=await xlsLib()}catch(e){toast('Atrás: no se pudo cargar el lector de Excel','err');return}
  let rows;try{const wb=X.read(await file.arrayBuffer());rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}catch(e){toast('Atrás: no pude leer el archivo','err');return}
  if(!rows.length){toast('El archivo está vacío','warn');return}
  const key=(r,names)=>{const k=Object.keys(r).find(k=>names.includes(normTxt(k)));return k!=null?r[k]:undefined};
  const numv=v=>{if(v===undefined||v==='')return undefined;const n=Number(String(v).replace(',','.'));return n>=0?n:NaN};
  const porId={},porNom={};state.productos.forEach(p=>{porId[normTxt(p.id)]=p;porNom[normTxt(p.nombre)]=p});
  let ok=0,igual=0;const sinMatch=[],malos=[];
  rows.forEach(r=>{
    const id=key(r,['id','codigo','sku']),nom=key(r,['insumo','producto','nombre','item']);
    const mi=numv(key(r,['minimo','min','stock minimo','punto de pedido']));
    const pa=numv(key(r,['par','par nuevo','par level','par objetivo','maximo']));
    const dias={};let hayDias=false;DIAS_XLS.forEach((d,i)=>{const v=numv(key(r,['par '+d]));if(v!==undefined){hayDias=true;if(!isNaN(v))dias[i]=v}});
    if(mi===undefined&&pa===undefined&&!hayDias)return;
    const p=porId[normTxt(id)]||porNom[normTxt(nom)];
    if(!p){sinMatch.push(nom||id||'(fila sin nombre)');return}
    if(isNaN(mi)||isNaN(pa)){malos.push(p.nombre);return}
    const antes=JSON.stringify(state.parEdits[p.id]||{});
    if(mi!==undefined)setEdit(p.id,'minimo',mi,'excel');
    if(pa!==undefined)setEdit(p.id,'par',pa,'excel');
    if(hayDias)setEdit(p.id,'par_dia',Object.keys(dias).length?dias:null,'excel');
    if(state.parEdits[p.id]&&JSON.stringify(state.parEdits[p.id])!==antes)ok++;else igual++;
  });
  state.parFiltro='todos';state.parCat='todas';state.parQ='';renderTabs();renderPares();
  setHead('📄','Carga desde Excel',file.name);
  $('#sheet-body').innerHTML=`
    <div class="kpis"><div class="kpi"><div class="val">${ok}</div><div class="lbl">Insumos a cambiar</div></div>
      <div class="kpi"><div class="val">${igual}</div><div class="lbl">Sin cambio</div></div>
      <div class="kpi ${sinMatch.length?'alert':''}"><div class="val">${sinMatch.length}</div><div class="lbl">No encontrados</div></div></div>
    ${sinMatch.length?`<div class="sheet-section"><div class="field-lbl">No encontrados en el catálogo (se ignoran)</div><div class="row-meta">${sinMatch.slice(0,40).join(' · ')}${sinMatch.length>40?' …':''}</div></div>`:''}
    ${malos.length?`<div class="sheet-section"><div class="field-lbl">Valor inválido (se ignoran)</div><div class="row-meta">${malos.join(' · ')}</div></div>`:''}
    <div class="sheet-section row-meta">Los cambios quedaron marcados en amarillo en la tabla. Revisa y toca <strong>Guardar</strong> para confirmarlos.</div>
    <div class="sheet-section"><div class="grid2"><button class="btn ghost" id="xl-rev">Revisar en la tabla</button><button class="btn primary" id="xl-save" ${Object.keys(state.parEdits).length?'':'disabled'}>Guardar ${Object.keys(state.parEdits).length} cambio(s)</button></div></div>`;
  openSheet();$('#xl-rev').onclick=closeSheet;$('#xl-save').onclick=async()=>{closeSheet();await guardarPares()};
}

/* ===== PEDIDO AUTOMÁTICO: todo lo bajo mínimo → OCs borrador por proveedor preferido =====
   Cantidad = PAR del día de entrega − stock, redondeada a la unidad de compra (caja, botella…). */
function factorCompra(p){return Math.max(1,Number(p.factor_compra||0)||Number(p.unidades_por_caja||0)||1)}
function unidadCompra(p){return p.unidad_compra||(factorCompra(p)>1?'caja':p.unidad||'u')}
function aCompra(p,q){const f=factorCompra(p);if(f<=1)return{q:+q.toFixed(2),compra:null};const n=Math.ceil(q/f-1e-9);return{q:n*f,compra:n}}
function lblCompra(p,n){return n==null?'':`${num(n)} ${unidadCompra(p)}${n===1?'':'s'} ×${num(factorCompra(p))}`}
function planAutomatico(){
  const grupos={},sinProv=[];
  state.productos.filter(p=>estadoStock(p)!=='ok').forEach(p=>{const falta=sugerido(p);if(!(falta>0))return;
    const c=aCompra(p,falta);const pp=proveedorDe(p.id);
    if(!pp){sinProv.push({p,q:c.q});return}
    const g=(grupos[pp.proveedor_id]=grupos[pp.proveedor_id]||{items:[],monto:0,entrega:0});
    g.items.push({producto_id:p.id,nombre:p.nombre,cantidad:c.q,costo_unit:Number(pp.costo),...(c.compra!=null?{cantidad_compra:c.compra,unidad_compra:unidadCompra(p),factor_compra:factorCompra(p)}:{})});
    g.monto+=c.q*Number(pp.costo);g.entrega=Math.max(g.entrega,Number(pp.tiempo_entrega_dias||0));});
  Object.values(grupos).forEach(g=>{const d=new Date();d.setDate(d.getDate()+g.entrega);g.fecha=d});
  return{grupos,sinProv};
}
function abrirPedidoAutomatico(){
  const{grupos,sinProv}=planAutomatico();const ids=Object.keys(grupos);
  const total=ids.reduce((a,id)=>a+grupos[id].monto,0);
  setHead('🚚','Pedido automático','Todo lo que está bajo el mínimo, hasta el PAR del día de entrega');
  $('#sheet-body').innerHTML=(ids.length||sinProv.length)?`
    <div class="kpis"><div class="kpi"><div class="val">${ids.length}</div><div class="lbl">Proveedores</div></div>
      <div class="kpi"><div class="val">${ids.reduce((a,id)=>a+grupos[id].items.length,0)}</div><div class="lbl">Insumos</div></div>
      <div class="kpi"><div class="val">${money(total)}</div><div class="lbl">Subtotal</div></div></div>
    ${ids.map(id=>{const g=grupos[id];return `<div class="sheet-section"><div class="field-lbl" style="display:flex;justify-content:space-between"><span>${prov(id)?.nombre||id}</span><span>llega ${DIAS[g.fecha.getDay()]} ${g.fecha.toISOString().slice(5,10)} · ${money(g.monto)}</span></div>

/* ===== CÓDIGO DE BARRAS (BarcodeDetector si el navegador lo trae; si no, ingreso manual / lector USB) ===== */
function prodPorCodigo(c){c=String(c||'').trim();if(!c)return null;return state.productos.find(p=>String(p.codigo_barras||'').trim()===c)||null}
async function escanearCodigo(onFound,raw){
  setHead('📷','Escanear código de barras','Apunta la cámara al código o escríbelo');
  $('#sheet-body').innerHTML=`
    <div class="sheet-section"><video id="sc-video" playsinline muted style="width:100%;max-height:260px;border:2px solid var(--outline);border-radius:12px;background:var(--ink);display:none"></video>
      <div class="row-meta" id="sc-msg">Oído · abriendo cámara…</div></div>
    <div class="sheet-section"><div class="field-lbl">O escribe / usa el lector</div><input class="input" id="sc-in" inputmode="numeric" placeholder="7750000000000" autofocus></div>
    <div class="sheet-section"><div class="grid2"><button class="btn ghost" id="sc-cancel">Atrás</button><button class="btn primary" id="sc-ok">Buscar</button></div></div>`;
  openSheet();let stream=null,vivo=true;
  const parar=()=>{vivo=false;if(stream)stream.getTracks().forEach(t=>t.stop())};
  const usar=(code)=>{code=String(code||'').trim();if(!code)return false;if(raw){parar();closeSheet();raw(code);return true}const p=prodPorCodigo(code);if(!p){$('#sc-msg').textContent='Atrás · ningún insumo tiene el código '+code+'. Asígnalo en Configurar insumo.';return false}parar();closeSheet();onFound(p,code);return true};
  $('#sc-cancel').onclick=()=>{parar();closeSheet()};
  $('#sc-ok').onclick=()=>usar($('#sc-in').value);
  $('#sc-in').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();usar(e.target.value)}};
  $('#sheet-close').addEventListener('click',parar,{once:true});
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices?.getUserMedia){$('#sc-msg').textContent='Este navegador no lee códigos con la cámara: escribe el código o usa un lector USB/Bluetooth.';return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('#sc-video');v.srcObject=stream;v.style.display='block';await v.play();$('#sc-msg').textContent='Buscando código…';
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
    const loop=async()=>{if(!vivo)return;try{const r=await det.detect(v);if(r.length&&usar(r[0].rawValue))return}catch(e){}requestAnimationFrame(loop)};loop();
  }catch(e){$('#sc-msg').textContent='Sin acceso a la cámara: escribe el código o usa un lector.'}
}

          <input class="input" id="m-cant-in" type="number" step="0.01" value="${cant}" style="margin-top:8px"></div>`}

    $('#m-scan').onclick=e=>{e.preventDefault();escanearCodigo(p=>{prodId=p.id;objetivo=stock(p.id);setHead(tipo==='entrada'?'📥':tipo==='salida'?'📤':'⚖️',titulo,'Inventario');draw();openSheet()})};
    if(tipo==='entrada'&&p&&factorCompra(p)>1&&$('#m-cant-in'))$('#m-cant-in').insertAdjacentHTML('afterend',`<div class="chips" style="margin-top:8px"><button class="chip" id="m-x">× ${num(factorCompra(p))} (${unidadCompra(p)} → ${p.unidad||'u'})</button></div>`);
    if($('#m-x'))$('#m-x').onclick=()=>{cant=+(cant*factorCompra(p)).toFixed(3);$('#m-cant').textContent=cant;$('#m-cant-in').value=cant};
    if($('#m-minus')){$('#m-minus').onclick=()=>{cant=Math.max(0,+(cant-1));$('#m-cant').textContent=cant;$('#m-cant-in').value=cant};$('#m-plus').onclick=()=>{cant=+(cant+1);$('#m-cant').textContent=cant;$('#m-cant-in').value=cant};$('#m-cant-in').oninput=e=>{cant=Number(e.target.value)||0;$('#m-cant').textContent=cant}}
    if($('#m-obj'))$('#m-obj').oninput=e=>objetivo=Number(e.target.value)||0;
    if($('#m-prov'))$('#m-prov').onchange=e=>provId=e.target.value;
    $('#m-cancel').onclick=closeSheet;
    $('#m-save').onclick=()=>guardarMovimiento(prodId,tipo,tipo==='ajuste'?(objetivo-s):cant,provId);
  };

}
async function guardarMovimiento(pid,tipo,delta,provId){
  const p=prod(pid);if(!p){toast('Elige un producto','warn');return}
  delta=Number(delta||0);
  if(tipo!=='ajuste'&&delta<=0){toast('Cantidad inválida','warn');return}
  let signed=tipo==='entrada'?Math.abs(delta):tipo==='salida'?-Math.abs(delta):delta; // ajuste: delta ya es objetivo-actual
  if(tipo==='ajuste'&&signed===0){toast('Sin cambios','warn');return}
  const{error}=await sb.from('inv_movimientos').insert({local_id:LOCAL,producto_id:pid,tipo,cantidad:signed,unidad:p.unidad,
    costo_unitario:p.costo,valor_total:+(signed*Number(p.costo||0)).toFixed(2),fecha:hoyISO(),proveedor_id:provId||null,
    motivo:tipo==='ajuste'?'Ajuste de conteo':null,responsable:'Mercado'});
  if(error){toast('Atrás: '+error.message,'err');return}
  closeSheet();await loadMovs();render();
  toast('Va · '+tipo+' '+p.nombre+' ('+(signed>0?'+':'')+num(signed)+')','ok');
}

/* ===== ARMAR PEDIDO (formulario por categoría → consolidado por proveedor) ===== */
// Sabe a quién pedir: proveedor preferido, si no el de menor precio.
function proveedorDe(pid){
  const opts=state.provProd.filter(pp=>pp.producto_id===pid);
  if(!opts.length)return null;
  return opts.find(o=>o.preferido)||opts.slice().sort((a,b)=>Number(a.costo)-Number(b.costo))[0];
}
// Precios combinados: proveedores + webs del país, ordenados de más barato a más caro
function preciosDe(pid){
  const sup=state.provProd.filter(pp=>pp.producto_id===pid).map(pp=>({fuente:prov(pp.proveedor_id)?.nombre||pp.proveedor_id,tipo:'proveedor',precio:Number(pp.costo),preferido:!!pp.preferido,entrega:pp.tiempo_entrega_dias,url:null}));
  const web=state.preciosMercado.filter(w=>w.producto_id===pid).map(w=>({fuente:w.fuente,tipo:'web',precio:Number(w.precio),url:w.url}));
  return [...sup,...web].sort((a,b)=>a.precio-b.precio);
}
function precioPreferido(pid){const pp=proveedorDe(pid);return pp?Number(pp.costo):null}
// Alerta si existe una fuente más barata que el proveedor que usamos
function alertaPrecio(pid){const pref=precioPreferido(pid);if(pref==null)return null;const best=preciosDe(pid)[0];if(best&&best.precio<pref-0.001)return{best,pref,ahorro:+(pref-best.precio).toFixed(2)};return null;}
function mermaTotal(pid){return state.mermas.filter(m=>m.producto_id===pid).reduce((a,m)=>a+Number(m.cantidad||0),0)}
function mermaAlta(p){const m=mermaTotal(p.id),par=parBase(p);return m>0&&par>0&&m>=par*0.3} // merma ≥ 30% del par
function parSugerido(p){return Math.ceil(parBase(p)+mermaTotal(p.id))} // recalculo simple por merma
function consolidadoPedido(){
  const porProv={};let sinProv=[];
  Object.entries(state.pedidoQty).forEach(([pid,q])=>{q=Number(q);if(!(q>0))return;const p=prod(pid);if(!p)return;
    const pp=proveedorDe(pid);
    if(!pp){sinProv.push({p,q});return;}
    const costo=Number(pp.costo);
    (porProv[pp.proveedor_id]=porProv[pp.proveedor_id]||{items:[],monto:0});
    porProv[pp.proveedor_id].items.push({producto_id:pid,nombre:p.nombre,cantidad:q,costo_unit:costo});
    porProv[pp.proveedor_id].monto+=q*costo;});
  return {porProv,sinProv};
}

  const cats=['todas',...categorias()];

    ${list.map(pedRow).join('')||'<div class="empty-state">Sin productos</div>'}

function pedRow(p){const s=stock(p.id),sug=sugerido(p),pp=proveedorDe(p.id),q=Number(state.pedidoQty[p.id]||0);
  const provLbl=pp?(prov(pp.proveedor_id)?.nombre||pp.proveedor_id):'⚠ sin proveedor';

async function marcarPreferido(pid,provId){
  await sb.from('inv_proveedor_productos').update({preferido:false}).eq('producto_id',pid);
  await sb.from('inv_proveedor_productos').update({preferido:true}).eq('producto_id',pid).eq('proveedor_id',provId);
  await loadProvProd();abrirConfigProducto(pid);toast('Va · proveedor preferido actualizado','ok');
}
async function guardarConfigProducto(pid,minimo,par,costo,diasCad){
  if(!(par>=0)||!(minimo>=0)){toast('Mínimo o PAR inválido','warn');return}
  if(minimo>par){toast('El mínimo no puede ser mayor que el PAR','warn');return}
  const p0=prod(pid);const ant=Number(p0?.costo||0);
  setEdit(pid,'minimo',minimo,'manual');setEdit(pid,'par',par,'manual');
  if(state.parEdits[pid]){const otros=Object.fromEntries(Object.entries(state.parEdits).filter(([k])=>k!==pid));const oo=Object.fromEntries(Object.entries(state.parOrigen).filter(([k])=>k!==pid));
    state.parEdits={[pid]:state.parEdits[pid]};state.parOrigen={[pid]:'manual'};await guardarPares();state.parEdits={...otros,...state.parEdits};state.parOrigen={...oo,...state.parOrigen};}
  const patch={costo:costo};
  if($('#cfg-ucompra')){const f=Number($('#cfg-factor').value)||1;const cb=$('#cfg-cb').value.trim();
    if(cb){const otro=state.productos.find(x=>x.id!==pid&&String(x.codigo_barras||'')===cb);if(otro){toast('Ese código ya es de '+otro.nombre,'warn');return}}
    patch.unidad_compra=$('#cfg-ucompra').value.trim()||null;patch.factor_compra=f>1?f:null;patch.codigo_barras=cb||null;}if(diasCad!==undefined)patch.dias_caducidad=diasCad;
  const{error}=await sb.from('inv_productos').update(patch).eq('id',pid);
  if(error){toast('Atrás: '+error.message,'err');return}
  if(Number(costo)!==ant){await sb.from('inv_precios_hist').insert({marca_id:MARCA,producto_id:pid,costo:Number(costo),fuente:'manual',fecha:hoyISO()});await loadHist();}
  await loadProductos();closeSheet();render();toast('Servido · configuración guardada','ok');
}
async function loadHist(){const{data}=await sb.from('inv_precios_hist').select('*').eq('marca_id',MARCA).order('fecha');state.hist=data||[]}
function histDe(pid){return state.hist.filter(h=>h.producto_id===pid).sort((a,b)=>(a.fecha<b.fecha?-1:1))}
function cambioPrecio(pid){const h=histDe(pid);if(h.length<1)return null;const actual=Number(prod(pid)?.costo||0);const prev=h.length>=2?Number(h[h.length-2].costo):Number(h[0].costo);if(!prev||prev===actual)return null;return{prev,actual,pct:(actual-prev)/prev*100,desde:(h.length>=2?h[h.length-2].fecha:h[h.length-1].fecha)}}
function platosConInsumo(pid){return state.recetas.filter(r=>Array.isArray(r.ingredientes)&&r.ingredientes.some(i=>i.pid===pid))}
async function abrirArchivoFirmado(url,bucket){
  if(!url)return;
  try{const mk='/'+bucket+'/';const i=url.indexOf(mk);const path=i>=0?url.slice(i+mk.length):url;
    const{data,error}=await sb.storage.from(bucket).createSignedUrl(decodeURIComponent(path),3600);
    if(error||!data){toast('No se pudo abrir el comprobante','err');return}window.open(data.signedUrl,'_blank');
  }catch(e){toast('No se pudo abrir el comprobante','err')}
}
function ultimaEntrada(pid){const es=state.movs.filter(m=>m.producto_id===pid&&m.tipo==='entrada'&&m.fecha).map(m=>m.fecha).sort();return es.length?es[es.length-1]:null}
function vencimientoPid(pid){const p=prod(pid);if(!p||!p.dias_caducidad)return null;const ue=ultimaEntrada(pid);if(!ue)return null;const d=new Date(ue+'T00:00:00');d.setDate(d.getDate()+Number(p.dias_caducidad));return d.toISOString().slice(0,10)}
function diasParaVencer(pid){const v=vencimientoPid(pid);if(!v)return null;return Math.round((new Date(v+'T00:00:00')-new Date(hoyISO()+'T00:00:00'))/86400000)}

/* ===== INVENTARIO TEÓRICO vs REAL (consumo por recetas / auto-depleción) ===== */
function consumoTeorico(){
  const m={};
  state.ventasItems.forEach(it=>{const r=state.recetas.find(x=>x.id===it.receta_id);if(!r||!Array.isArray(r.ingredientes))return;const q=Number(it.qty||1);
    r.ingredientes.forEach(ing=>{if(!ing.pid)return;const merma=Number(ing.merma||0);const factor=(merma>0&&merma<100)?1/(1-merma/100):1;const cant=Number(ing.cantidad||0)*q*factor;if(!m[ing.pid])m[ing.pid]={cant:0};m[ing.pid].cant+=cant;});});
  return m;
}
/* POUR COST (bar): costo teórico de los cócteles vendidos / venta de esos cócteles.
   Bebida = receta de estación de bar/servicio o de una sección de cócteles. Real = salidas + mermas valorizadas de los
   insumos de bar en el período → variación real vs teórico. Por turno y por mozo: pour cost de lo que vendió cada uno. */
function esBebida(r){if(!r)return false;return /bar|servicio|bebida|drink/i.test(r.estacion_id||'')||/c[oó]ctel|trago|sour|bebida|cerveza|vino|sin alcohol|cl[aá]sicos?|licor|bar/i.test(r.categoria_menu||'')}
function costoReceta(r){if(!r||!Array.isArray(r.ingredientes))return 0;return r.ingredientes.reduce((a,ing)=>{const p=ing.pid?prod(ing.pid):null;if(!p)return a;const merma=Number(ing.merma||0);const f=(merma>0&&merma<100)?1/(1-merma/100):1;return a+Number(ing.cantidad||0)*f*Number(p.costo||0)},0)}
function pourCost(items){let costo=0,venta=0;items.forEach(it=>{const r=state.recetas.find(x=>x.id===it.receta_id);if(!esBebida(r)||it.es_cortesia)return;const q=Number(it.qty||1);costo+=costoReceta(r)*q;venta+=Number(it.precio_total!=null?it.precio_total:Number(r.precio_venta||0)*q)});
  // la venta incluye IGV: el pour cost se mide sobre la venta neta
  const neta=venta/1.18;return{costo,venta,neta,pct:neta>0?costo/neta*100:null}}
function insumosDeBar(){const s=new Set();state.recetas.filter(esBebida).forEach(r=>(r.ingredientes||[]).forEach(i=>i.pid&&s.add(i.pid)));return s}
async function consumoRealPeriodo(pids){const desde=teoDesde().slice(0,10);let from=0,tot=0;const page=1000;
  while(true){const{data,error}=await sb.from('inv_movimientos').select('producto_id,valor_total,motivo').eq('local_id',LOCAL).in('tipo',['salida','merma','ajuste']).gte('fecha',desde).range(from,from+page-1);
    if(error)break;(data||[]).forEach(m=>{if(pids.has(m.producto_id)&&!/consumo te[oó]rico/i.test(m.motivo||''))tot+=-Number(m.valor_total||0)});if(!data||data.length<page)break;from+=page}
  return tot}
function bloquePourCost(){
  const pc=pourCost(state.ventasItems);if(pc.pct==null)return'';
  const porTurno={},porMozo={};state.ventasItems.forEach(it=>{(porTurno[it.turno_id||it.fecha]=porTurno[it.turno_id||it.fecha]||[]).push(it);if(it.mozo_id)(porMozo[it.mozo_id]=porMozo[it.mozo_id]||[]).push(it)});
  const filasT=Object.entries(porTurno).map(([k,its])=>{const t=state.turnos[k];const x=pourCost(its);return{lbl:t?(t.fecha+' · '+(t.nombre||'')):k,x}}).filter(r=>r.x.pct!=null).sort((a,b)=>a.lbl<b.lbl?1:-1);
  const filasM=Object.entries(porMozo).map(([k,its])=>{const e=state.equipo[k];return{lbl:e?(e.nombre+' '+(e.apellidos||'').split(' ')[0]):k,rol:e?.rol||'',x:pourCost(its)}}).filter(r=>r.x.pct!=null).sort((a,b)=>b.x.pct-a.x.pct);
  const dif=v=>{const d=v-pc.pct;return `<span style="color:${Math.abs(d)<1.5?'':d>0?'var(--secondary)':'var(--green)'}">${d>0?'+':''}${d.toFixed(1)} pp</span>`};
  const real=state.pourReal;const varPct=real!=null&&pc.costo>0?(real-pc.costo)/pc.costo*100:null;
  return `<div style="background:var(--surface);border:2px solid var(--outline);border-radius:14px;box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:14px">
    <div style="font-family:var(--font-display);font-size:18px;margin-bottom:8px">Pour cost del bar</div>
    <div class="kpis">
      <div class="kpi ${pc.pct>24?'alert':''}"><div class="val">${pc.pct.toFixed(1)}%</div><div class="lbl">Pour cost teórico</div></div>
      <div class="kpi"><div class="val">${money(pc.neta)}</div><div class="lbl">Venta de bar (sin IGV)</div></div>
      <div class="kpi"><div class="val">${money(pc.costo)}</div><div class="lbl">Costo teórico</div></div>
      <div class="kpi ${varPct!=null&&varPct>5?'alert':''}"><div class="val">${real==null?'…':money(real)}</div><div class="lbl">Consumo real insumos de bar${varPct!=null?` · ${varPct>0?'+':''}${varPct.toFixed(0)}% vs teórico`:''}</div></div>
    </div>
    <div class="row-meta" style="margin-bottom:8px">Referencia de la industria: 18–24%. Si el real supera al teórico, hay sobre-servido, cortesías sin registrar o merma: crúzalo con el conteo por peso.</div>
    <div class="grid2" style="align-items:start">
      <div><div class="field-lbl">Por turno</div><table class="tbl"><tr><th>Turno</th><th>Venta</th><th>Pour</th><th>vs prom.</th></tr>${filasT.slice(0,14).map(r=>`<tr><td>${r.lbl}</td><td class="mono">${money(r.x.neta)}</td><td class="mono">${r.x.pct.toFixed(1)}%</td><td class="mono">${dif(r.x.pct)}</td></tr>`).join('')}</table></div>
      <div><div class="field-lbl">Por mozo / bartender</div>${filasM.length?`<table class="tbl"><tr><th>Quién</th><th>Venta</th><th>Pour</th><th>vs prom.</th></tr>${filasM.map(r=>`<tr><td>${r.lbl}<div class="row-meta">${r.rol}</div></td><td class="mono">${money(r.x.neta)}</td><td class="mono">${r.x.pct.toFixed(1)}%</td><td class="mono">${dif(r.x.pct)}</td></tr>`).join('')}</table>`:'<div class="row-meta">Los pedidos no tienen mozo asignado.</div>'}</div>
    </div></div>`;
}
function renderTeorico(){
  const cons=consumoTeorico();
  if(state.pourRealKey!==state.teoPeriodo){state.pourRealKey=state.teoPeriodo;state.pourReal=null;consumoRealPeriodo(insumosDeBar()).then(v=>{state.pourReal=v;if(state.view==='teorico')renderTeorico()})}
  const pids=Object.keys(cons).filter(pid=>prod(pid));
  const platos=state.ventasItems.reduce((a,it)=>a+Number(it.qty||0),0);
  const valorCons=pids.reduce((a,pid)=>a+cons[pid].cant*Number(prod(pid).costo||0),0);
  const sinReceta=state.ventasItems.filter(it=>!state.recetas.find(r=>r.id===it.receta_id&&Array.isArray(r.ingredientes)&&r.ingredientes.length)).reduce((a,it)=>a+Number(it.qty||0),0);
  const per=[['hoy','Hoy'],['7d','7 días'],['mes','Mes']];
  $('#screen').innerHTML=`
    <div class="toolbar"><div class="chips">${per.map(p=>`<button class="chip ${state.teoPeriodo===p[0]?'active':''}" data-tp="${p[0]}">${p[1]}</button>`).join('')}</div></div>
    <div style="font-family:var(--font-mono);font-size:11px;opacity:.65;margin-bottom:10px">Inventario <b>real</b> = lo que hay físico (conteos/compras). Inventario <b>virtual</b> = real − consumo teórico de las recetas vendidas. La diferencia al hacer un conteo = merma real.</div>
    ${bloquePourCost()}
    <div class="kpis">
      <div class="kpi"><div class="val">${num(platos)}</div><div class="lbl">Platos vendidos</div></div>
      <div class="kpi"><div class="val">${money(valorCons)}</div><div class="lbl">Consumo teórico</div></div>
      <div class="kpi ${sinReceta?'alert':''}"><div class="val">${num(sinReceta)}</div><div class="lbl">Vendidos sin receta costeada</div></div>
    </div>
    ${pids.length?`<table class="tbl"><tr><th>Insumo</th><th>Consumo teórico</th><th>Valor</th><th>Stock real</th><th>Virtual</th></tr>
      ${pids.sort((a,b)=>cons[b].cant*Number(prod(b).costo||0)-cons[a].cant*Number(prod(a).costo||0)).map(pid=>{const p=prod(pid);const c=cons[pid].cant;const real=stock(pid);const virt=real-c;
        return `<tr><td>${p.emoji||''} ${p.nombre}</td><td>${num(c)} ${p.unidad||''}</td><td>${money(c*Number(p.costo||0))}</td><td>${num(real)}</td><td style="color:${virt<0?'var(--secondary)':''}">${num(virt)}</td></tr>`}).join('')}</table>
      <div class="row-meta" style="margin-top:10px">Si registras el consumo, se generan salidas por el teórico y el stock real baja a su nivel "virtual".</div>
      <button class="btn primary" id="teo-aplicar" style="margin-top:10px"><span class="material-symbols-outlined">remove_circle</span>Registrar consumo del período a inventario</button>`
      :'<div class="empty-state">Sin ventas con receta costeada en el período. Costea recetas en el módulo Recetas para ver el consumo.</div>'}`;
  $$('#screen .chip[data-tp]').forEach(b=>b.onclick=async()=>{state.teoPeriodo=b.dataset.tp;$('#screen').innerHTML='<div class="empty-state">Oído · cargando ventas…</div>';await loadVentasItems();render()});
  if($('#teo-aplicar'))$('#teo-aplicar').onclick=()=>aplicarConsumoTeorico(cons);
}
async function aplicarConsumoTeorico(cons){
  const pids=Object.keys(cons).filter(pid=>prod(pid)&&cons[pid].cant>0);
  if(!pids.length)return;
  if(!confirm('Registrar el consumo teórico de '+pids.length+' insumo(s) como salidas? Hazlo una vez por período para no duplicar.'))return;
  const now=hoyISO();const rows=pids.map(pid=>{const p=prod(pid);const c=+cons[pid].cant.toFixed(3);return{local_id:LOCAL,producto_id:pid,tipo:'salida',cantidad:-c,unidad:p.unidad,costo_unitario:p.costo,valor_total:+(-c*Number(p.costo||0)).toFixed(2),fecha:now,motivo:'Consumo teórico ('+state.teoPeriodo+')',responsable:'Sistema'}});
  const{error}=await sb.from('inv_movimientos').insert(rows);
  if(error){toast('Atrás: '+error.message,'err');return}
  await loadMovs();render();toast('Servido · consumo aplicado al inventario','ok');
}

/* ===== REPORTES (optimizar compras · proveedores · control de inventario) ===== */
function renderReportes(){
  const prods=state.productos;
  const card=(t,inner)=>`<div style="background:#fff;border:2px solid var(--outline);border-radius:14px;box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:12px"><div style="font-family:var(--font-display);font-size:18px;margin-bottom:10px">${t}</div>${inner}</div>`;

  // vendor scoring (ME-06)

    return {v,nprod:pps.length,entrega,baratos,score:Math.round(baratos/pps.length*60+Math.max(0,30-entrega*4)+10)};}).filter(Boolean).sort((a,b)=>b.score-a.score);

  $('#screen').innerHTML=`

  document.querySelectorAll('#screen [data-rep]').forEach(el=>el.onclick=()=>abrirDetalleReporte(el.dataset.rep,el.dataset.key));

function abrirDetalleReporte(rep,key){

  }else if(rep==='cons'){
    const items=state.movs.filter(m=>m.producto_id===key&&['salida','merma'].includes(m.tipo));
    titulo='Consumo · '+(prod(key)?.nombre||key);
    filas=`<table class="tbl"><tr><th>Fecha</th><th>Tipo</th><th>Cant.</th><th>Valor</th><th>Motivo</th></tr>${items.map(m=>`<tr><td>${m.fecha}</td><td>${m.tipo}</td><td>${num(Math.abs(m.cantidad))}</td><td>${money(Math.abs(m.valor_total||0))}</td><td>${m.motivo||''}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;opacity:.5;padding:14px">Sin movimientos</td></tr>'}</table>`;
  }else if(rep==='cat'){

  setHead('🔎',titulo,'Detalle del reporte');

/* ===== PRODUCCIÓN Y FRÍO (ME-16 tandas y equipos · ME-17 day dots y tablero · ME-18 temperaturas) ===== */
// Lo que la cocina produce (salsas, fondos, porcionados) vive por TANDA en un equipo de frío del local.
// Mover entre refri y congelador recalcula el vencimiento con la vida útil de la receta.
const PF_TIPOS=[['refri','Refrigeradora'],['camara','Cámara'],['congelador','Congelador'],['ambiente','Ambiente / despensa']];
const PF_TEMP_DEF={refri:[0,5],camara:[0,5],congelador:[-25,-18],ambiente:[null,null]};
const PF_ENVASES=['GN 1/1','GN 1/2','GN 1/3','GN 1/6','GN 1/9','bolsa 1 kg','bolsa 500 g','bolsa 250 g','1 L','500 ml','250 ml','porción'];
// Day dots (mismos colores que los stickers); índice = getDay()
const PF_DIAS=[['Dom','#1D1B18'],['Lun','#2F6DB5'],['Mar','#E8C21C'],['Mié','#C8372D'],['Jue','#7A4B2A'],['Vie','#3B9A4A'],['Sáb','#E98A1F']];
const PF_VIDA_DEF={refri:3,congelador:60};
const PF_MOTIVOS=['Vencimiento','Mala manipulación','Cocción fallida','Daño/rotura','Sobreproducción'];
state.pf={equipos:[],tandas:[],minimos:[],temps:[],sub:'tablero',filtro:'todos',foco:null,cargado:false};

// Deep link /mercado?equipo=CLAVE (QR o NFC del equipo). Se guarda antes de que el login redirija,
// así al volver de /login se abre el mismo equipo.
(function(){try{const q=new URLSearchParams(location.search).get('equipo');
  if(q){localStorage.setItem('prep_pf_equipo',JSON.stringify({clave:q,ts:Date.now()}))}}catch(e){}})();
function pfEquipoPendiente(){try{const v=JSON.parse(localStorage.getItem('prep_pf_equipo')||'null');if(!v)return null;
  if(Date.now()-v.ts>30*60000){localStorage.removeItem('prep_pf_equipo');return null}return v.clave}catch(e){return null}}

function pfEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pfISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pfMas(dias,base){const d=base?new Date(base+'T12:00:00'):new Date();d.setDate(d.getDate()+Number(dias||0));return pfISO(d)}
function pfDias(iso){if(!iso)return null;return Math.round((new Date(iso+'T12:00:00')-new Date(hoyISO()+'T12:00:00'))/864e5)}
function pfFecha(iso){if(!iso)return '—';const p=iso.split('-');return p[2]+'/'+p[1]}
function pfEq(id){return state.pf.equipos.find(e=>e.id===id)}
function pfTanda(id){return state.pf.tandas.find(t=>t.id===id)}
function pfReceta(id){return state.recetas.find(r=>r.id===id)}
function pfCongela(eq){return !!eq&&eq.tipo==='congelador'}
function pfRefrigera(eq){return !!eq&&(eq.tipo==='refri'||eq.tipo==='camara')}
function pfVida(r,congelado){const v=r?(congelado?r.vida_congelado_dias:r.vida_refri_dias):null;return v!=null&&v!==''?Number(v):PF_VIDA_DEF[congelado?'congelador':'refri']}
function pfVenceAlCrear(r,eq,elaborado){if(!eq||eq.tipo==='ambiente')return r&&r.vida_refri_dias!=null?pfMas(r.vida_refri_dias,elaborado):null;return pfMas(pfVida(r,pfCongela(eq)),elaborado)}
// Al mover: congelado → refri cuenta desde hoy con la vida en refri; refri → congelado, desde hoy con la vida congelado.
// Entre equipos del mismo tipo de frío (o hacia ambiente) el vencimiento no cambia.
function pfVenceAlMover(t,desde,hacia){const r=pfReceta(t.receta_id);
  if(pfCongela(desde)&&pfRefrigera(hacia))return pfMas(pfVida(r,false));
  if(!pfCongela(desde)&&pfCongela(hacia))return pfMas(pfVida(r,true));
  return t.vence}
// Costo por porción con sub-recetas (las recetas guardan los ingredientes de toda la preparación, que rinde N porciones)
function pfCostoPorcion(r,seen){seen=seen||new Set();if(!r||seen.has(r.id))return 0;seen.add(r.id);
  const tot=(Array.isArray(r.ingredientes)?r.ingredientes:[]).reduce((a,ing)=>{const m=Number(ing.merma||0),f=(m>0&&m<100)?1/(1-m/100):1;const c=Number(ing.cantidad||0)*f;
    if(ing.rid)return a+c*pfCostoPorcion(pfReceta(ing.rid),new Set(seen));
    if(ing.pid){const p=prod(ing.pid);return a+c*Number(p?.costo||0)}return a+Number(ing.costo||0)},0);
  return tot/(Number(r.rendimiento||1)||1)}
function pfCostoEnvase(t){const r=pfReceta(t.receta_id);return r?pfCostoPorcion(r)*Number(t.porciones_envase||1):0}
// Insumos de Mercado para producir N porciones (abre sub-recetas)
function pfInsumos(r,porciones,acc,seen){acc=acc||{};seen=seen||new Set();if(!r||seen.has(r.id))return acc;seen.add(r.id);
  const k=Number(porciones||0)/(Number(r.rendimiento||1)||1);
  (Array.isArray(r.ingredientes)?r.ingredientes:[]).forEach(ing=>{const m=Number(ing.merma||0),f=(m>0&&m<100)?1/(1-m/100):1;const c=Number(ing.cantidad||0)*k*f;
    if(ing.rid)pfInsumos(pfReceta(ing.rid),c,acc,new Set(seen));else if(ing.pid)acc[ing.pid]=(acc[ing.pid]||0)+c});
  return acc}
function pfEsSub(r){if(!r)return false;if(r.tipo==='salsa')return true;return state.recetas.some(x=>Array.isArray(x.ingredientes)&&x.ingredientes.some(i=>i.rid===r.id))}
function pfSeccion(r){return r?.categoria_menu||(r?.tipo==='salsa'?'Salsas':'Otros')}
function pfQuien(){return state.usuario?String(state.usuario).split('@')[0]:'Mercado'}
function pfDot(iso){if(!iso)return '<span class="pf-dot" style="background:var(--gray-soft)">Sin fecha</span>';
  const d=new Date(iso+'T12:00:00'),dia=PF_DIAS[d.getDay()],dd=pfDias(iso),claro=/E8C21C|E98A1F/i.test(dia[1]);
  const rel=dd<0?'vencido':dd===0?'hoy':dd===1?'mañana':pfFecha(iso);
  return `<span class="pf-dot" style="background:${dia[1]};color:${claro?'#141414':'#fff'}">${dia[0]} · ${rel}</span>`}
function pfUltTemp(eqId){return state.pf.temps.find(x=>x.equipo_id===eqId)||null}
function pfFuera(eq,temp){if(temp==null)return false;const t=Number(temp);return (eq.temp_min!=null&&t<Number(eq.temp_min))||(eq.temp_max!=null&&t>Number(eq.temp_max))}

/* ---- carga ---- */
async function loadProduccion(){
  const desde=new Date(Date.now()-14*864e5).toISOString();
  const [eq,ta,mi,te]=await Promise.all([
    sb.from('inv_equipos_frio').select('*').eq('local_id',LOCAL).order('orden').order('nombre'),
    sb.from('inv_tandas').select('*').eq('local_id',LOCAL).eq('estado','activa').order('vence',{ascending:true,nullsFirst:false}),
    sb.from('inv_prod_minimos').select('*').eq('local_id',LOCAL),
    sb.from('inv_temp_registros').select('*').eq('local_id',LOCAL).gte('created_at',desde).order('created_at',{ascending:false}).limit(500)]);
  if(eq.error){console.error(eq.error);toast('Atrás · '+eq.error.message,'err')}
  state.pf.equipos=eq.data||[];state.pf.tandas=ta.data||[];state.pf.minimos=mi.data||[];state.pf.temps=te.data||[];state.pf.cargado=true;
  const clave=pfEquipoPendiente();
  if(clave){const e=state.pf.equipos.find(x=>x.clave.toLowerCase()===clave.toLowerCase());

    if(e){state.view='produccion';state.pf.sub='tablero';state.pf.filtro=e.id;state.pf.foco=e.id}

}
function pfLog(t,tipo,cantidad,desde,hacia){return sb.from('inv_tanda_movs').insert({tanda_id:t?.id||null,local_id:LOCAL,tipo,cantidad,desde_equipo:desde||null,hacia_equipo:hacia||null,usuario:pfQuien()}).then(r=>{if(r.error)console.warn('tanda_movs',r.error)})}

/* ---- mover / usar / botar ---- */
async function pfMover(id,qty,destinoId){
  const t=pfTanda(id);if(!t)return;const desde=pfEq(t.equipo_id),hacia=pfEq(destinoId);if(!hacia||destinoId===t.equipo_id)return;
  qty=Math.min(Number(qty||t.cantidad),Number(t.cantidad));if(!(qty>0))return;
  const vence=pfVenceAlMover(t,desde,hacia);
  // Misma tanda (misma receta o nombre + misma fecha de elaboración) ya en el destino: se fusiona
  const dest=state.pf.tandas.find(x=>x.id!==t.id&&x.equipo_id===destinoId&&x.elaborado===t.elaborado&&(t.receta_id?x.receta_id===t.receta_id:(!x.receta_id&&x.nombre.toLowerCase()===t.nombre.toLowerCase()))&&(x.envase||'')===(t.envase||''));
  const todo=qty>=Number(t.cantidad);
  try{
    if(todo&&!dest){const r=await sb.from('inv_tandas').update({equipo_id:destinoId,vence,updated_at:nowISO()}).eq('id',t.id);if(r.error)throw r.error;await pfLog(t,'mover',qty,t.equipo_id,destinoId)}
    else{
      if(todo){const r=await sb.from('inv_tandas').delete().eq('id',t.id);if(r.error)throw r.error}
      else{const r=await sb.from('inv_tandas').update({cantidad:+(t.cantidad-qty).toFixed(3),updated_at:nowISO()}).eq('id',t.id);if(r.error)throw r.error}
      let destId;
      if(dest){const v=[dest.vence,vence].filter(Boolean).sort()[0]||null;const r=await sb.from('inv_tandas').update({cantidad:+(Number(dest.cantidad)+qty).toFixed(3),vence:v,updated_at:nowISO()}).eq('id',dest.id);if(r.error)throw r.error;destId=dest.id}
      else{const nueva={local_id:LOCAL,receta_id:t.receta_id,nombre:t.nombre,seccion:t.seccion,elaborado:t.elaborado,vence,equipo_id:destinoId,cantidad:qty,envase:t.envase,porciones_envase:t.porciones_envase,responsable:t.responsable,notas:t.notas};
        const r=await sb.from('inv_tandas').insert(nueva).select().single();if(r.error)throw r.error;destId=r.data.id}
      await pfLog({id:destId},'mover',qty,t.equipo_id,destinoId)}
    await loadProduccion();render();
    toast('Va · '+(todo?'':num(qty)+' de ')+t.nombre+' → '+hacia.nombre+(vence&&vence!==t.vence?' (vence '+pfFecha(vence)+')':'')+(dest?' · fusionada':''),'ok');
  }catch(e){console.error(e);toast('Atrás · no se pudo mover: '+(e.message||e),'err');await loadProduccion();render()}
}
async function pfSalida(id,qty,tipo,motivo,notas){
  const t=pfTanda(id);if(!t)return;qty=Math.min(Number(qty||0),Number(t.cantidad));if(!(qty>0)){toast('Cantidad inválida','warn');return}
  const queda=+(Number(t.cantidad)-qty).toFixed(3);
  const cambios=queda>0?{cantidad:queda,updated_at:nowISO()}:{cantidad:0,estado:tipo==='botar'?'botada':'consumida',updated_at:nowISO()};
  const r=await sb.from('inv_tandas').update(cambios).eq('id',t.id);if(r.error){toast('Atrás · '+r.error.message,'err');return}
  await pfLog(t,tipo==='botar'?'botar':'consumir',qty,t.equipo_id,null);
  if(tipo==='botar'){const valor=+(pfCostoEnvase(t)*qty).toFixed(2);
    const m=await sb.from('inv_mermas').insert({local_id:LOCAL,producto_id:'tanda:'+t.id,tanda_id:t.id,nombre:t.nombre+(t.envase?' · '+t.envase:''),cantidad:qty,motivo:motivo||'Vencimiento',valor_perdido:valor,area:pfEq(t.equipo_id)?.nombre||null,responsable:pfQuien(),notas:notas||null,fecha:hoyISO()});
    if(m.error)toast('Atrás · la merma no se registró: '+m.error.message,'err');else await loadMermas();
    toast('Servido · '+num(qty)+' de '+t.nombre+' a merma ('+money(valor)+')','warn')}
  else toast('Servido · '+num(qty)+' de '+t.nombre+' usado','ok');
  await loadProduccion();render();
}

    $('#nt-no').onclick=closeSheet;$('#nt-si').onclick=()=>{keep();pfGuardarTanda(c)};

async function pfGuardarTanda(c){
  const r=pfReceta(c.receta_id);const nombre=r?r.nombre:(c.nombre||'').trim();
  if(!nombre){toast('Ponle nombre a la tanda','warn');return}if(!(c.cantidad>0)){toast('Cantidad inválida','warn');return}if(!c.equipo_id){toast('Elige un equipo','warn');return}
  const fila={local_id:LOCAL,receta_id:r?r.id:null,nombre,seccion:c.seccion||(r?pfSeccion(r):null),elaborado:c.elaborado,vence:c.vence||null,equipo_id:c.equipo_id,cantidad:c.cantidad,envase:c.envase||null,porciones_envase:c.porciones_envase||1,responsable:pfQuien()};
  const ins=await sb.from('inv_tandas').insert(fila).select().single();if(ins.error){toast('Atrás · '+ins.error.message,'err');return}
  await pfLog(ins.data,'crear',c.cantidad,null,c.equipo_id);
  let n=0;
  if(r&&c.descontar){const porc=Number(c.cantidad)*Number(c.porciones_envase||1);const req=pfInsumos(r,porc);
    const rows=Object.keys(req).filter(pid=>prod(pid)&&req[pid]>0).map(pid=>{const p=prod(pid),q=+req[pid].toFixed(4);
      return {local_id:LOCAL,producto_id:pid,tipo:'salida',cantidad:-q,unidad:p.unidad,costo_unitario:p.costo,valor_total:+(-q*Number(p.costo||0)).toFixed(2),fecha:hoyISO(),motivo:'Producción',referencia:'Tanda '+nombre+' · '+ins.data.id.slice(0,8),responsable:pfQuien()}});
    if(rows.length){const m=await sb.from('inv_movimientos').insert(rows);if(m.error)toast('Atrás · tanda creada, pero no se descontaron insumos: '+m.error.message,'err');else n=rows.length}
    await loadMovs()}
  closeSheet();await loadProduccion();render();
  toast('Servido · '+num(c.cantidad)+' × '+(c.envase||'envase')+' de '+nombre+(n?' · '+n+' insumos descontados':''),'ok');
}

/* ---- Por hacer: mínimos por receta o sección vs. tandas activas ---- */
function pfStockReceta(rid){return state.pf.tandas.filter(t=>t.receta_id===rid).reduce((a,t)=>a+Number(t.cantidad||0),0)}
function pfStockSeccion(sec){return state.pf.tandas.filter(t=>(t.seccion||'')===sec).reduce((a,t)=>a+Number(t.cantidad||0),0)}
function pfFilasMin(){return state.pf.minimos.filter(m=>Number(m.minimo)>0).map(m=>{const r=m.receta_id?pfReceta(m.receta_id):null;
  const tot=m.receta_id?pfStockReceta(m.receta_id):pfStockSeccion(m.seccion);
  return {m,r,nombre:r?r.nombre:'Sección · '+m.seccion,tot,min:Number(m.minimo),bajo:tot<=Number(m.minimo)}})}
function pfFaltantes(){return pfFilasMin().filter(x=>x.bajo)}
function pfSeg(tot,min){const n=Math.min(Math.max(min,tot),12),bajo=tot<=min;let h='';for(let i=0;i<n;i++)h+=`<i class="${i<tot?(bajo?'f low':'f'):''}"></i>`;return `<span class="pf-seg">${h}</span>`}
function pfRenderPorHacer(){
  const filas=pfFilasMin().sort((a,b)=>(b.bajo-a.bajo)||(a.tot/a.min-b.tot/b.min));
  const conMin=new Set(state.pf.minimos.map(m=>m.receta_id).filter(Boolean));
  const candidatas=state.recetas.filter(r=>(pfEsSub(r)||state.pf.tandas.some(t=>t.receta_id===r.id))&&!conMin.has(r.id)).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const secs=[...new Set(state.pf.tandas.map(t=>t.seccion).concat(state.recetas.filter(pfEsSub).map(pfSeccion)).filter(Boolean))].filter(s=>!state.pf.minimos.some(m=>!m.receta_id&&m.seccion===s));
  $('#pf-body').innerHTML=`
    ${filas.length?filas.map(x=>`<div class="row-card"><span class="pf-ico"><span class="material-symbols-outlined">${x.bajo?'priority_high':'check'}</span></span>
      <div class="row-main"><h3>${pfEsc(x.nombre)}</h3><div class="row-meta"><span>${num(x.tot)} de ${num(x.min)} ${pfEsc(x.m.unidad||'envases')}</span>${x.bajo?'<span style="color:var(--secondary);font-weight:700">Producir '+num(Math.max(1,x.min-x.tot))+'</span>':''}</div>
        <div class="pf-bar"><i class="${x.bajo?'low':''}" style="width:${Math.min(100,x.tot/x.min*100)}%"></i></div></div>
      <div class="row-right">${pfSeg(x.tot,x.min)}<div class="chips"><input class="input" type="number" min="0" value="${x.min}" data-min="${x.m.id}" style="width:80px;padding:6px">${x.r?`<button class="mini-btn primary" data-prod="${x.r.id}" data-falta="${Math.max(1,x.min-x.tot)}">Producir</button>`:''}</div></div></div>`).join('')
      :'<div class="empty-state">Define cuántos envases quieres tener de cada preparación y aquí verás qué falta producir</div>'}
    <div class="toolbar" style="margin-top:14px">
      <button class="btn-ico dark" id="pf-a-pedido"><span class="material-symbols-outlined">shopping_cart</span><span>Pasar insumos faltantes al pedido</span></button></div>
    <div class="grid2" style="margin-top:6px">
      <div><div class="field-lbl">Agregar mínimo por receta</div><div style="display:flex;gap:8px"><select class="select" id="pf-nm-rec"><option value="">Elegir…</option>${candidatas.map(r=>`<option value="${r.id}">${pfEsc(r.nombre)}</option>`).join('')}</select><input class="input" id="pf-nm-val" type="number" min="1" value="4" style="width:80px"><button class="mini-btn primary" id="pf-nm-add">Va</button></div></div>
      <div><div class="field-lbl">Agregar mínimo por sección</div><div style="display:flex;gap:8px"><input class="input" id="pf-ns-sec" list="pf-secs" placeholder="Salsas, fondos…"><datalist id="pf-secs">${secs.map(s=>`<option value="${pfEsc(s)}">`).join('')}</datalist><input class="input" id="pf-ns-val" type="number" min="1" value="6" style="width:80px"><button class="mini-btn primary" id="pf-ns-add">Va</button></div></div></div>`;
  $$('#pf-body [data-min]').forEach(inp=>inp.onchange=async()=>{const v=Number(inp.value)||0;
    const r=v>0?await sb.from('inv_prod_minimos').update({minimo:v,updated_at:nowISO()}).eq('id',inp.dataset.min):await sb.from('inv_prod_minimos').delete().eq('id',inp.dataset.min);
    if(r.error){toast('Atrás · '+r.error.message,'err');return}await loadProduccion();render();toast('Servido · mínimo '+(v>0?'actualizado':'quitado'),'ok')});
  $$('#pf-body [data-prod]').forEach(b=>b.onclick=()=>{const t=state.pf.tandas.find(x=>x.receta_id===b.dataset.prod);pfNuevaTanda({receta_id:b.dataset.prod,cantidad:Number(b.dataset.falta)||1,envase:t?.envase||'GN 1/6',porciones_envase:t?Number(t.porciones_envase||1):1})});
  $('#pf-nm-add').onclick=()=>pfAgregarMin({receta_id:$('#pf-nm-rec').value||null},$('#pf-nm-val').value);
  $('#pf-ns-add').onclick=()=>pfAgregarMin({seccion:$('#pf-ns-sec').value.trim()||null},$('#pf-ns-val').value);
  $('#pf-a-pedido').onclick=pfInsumosAlPedido;
}
async function pfAgregarMin(k,val){val=Number(val)||0;if(!(k.receta_id||k.seccion)||!(val>0)){toast('Elige qué y cuántos','warn');return}
  const ya=state.pf.minimos.find(m=>k.receta_id?m.receta_id===k.receta_id:(!m.receta_id&&m.seccion===k.seccion));
  const r=ya?await sb.from('inv_prod_minimos').update({minimo:val,updated_at:nowISO()}).eq('id',ya.id):await sb.from('inv_prod_minimos').insert({local_id:LOCAL,receta_id:k.receta_id||null,seccion:k.receta_id?null:k.seccion,minimo:val});
  if(r.error){toast('Atrás · '+r.error.message,'err');return}await loadProduccion();render();toast('Servido · mínimo guardado','ok')}
// Insumos que faltan para producir lo que está bajo mínimo → Armar pedido
function pfInsumosAlPedido(){const req={};
  pfFaltantes().filter(x=>x.r).forEach(x=>{const t=state.pf.tandas.find(y=>y.receta_id===x.r.id);const porcEnv=t?Number(t.porciones_envase||1):1;pfInsumos(x.r,Math.max(1,x.min-x.tot)*porcEnv,req)});
  let n=0;Object.keys(req).forEach(pid=>{const p=prod(pid);if(!p)return;const falta=+(req[pid]-stock(pid)).toFixed(2);if(falta>0){state.pedidoQty[pid]=Math.max(Number(state.pedidoQty[pid]||0),falta);n++}});
  if(!n){toast('Hay insumos suficientes para producir lo que falta','ok');return}
  state.pedidoInit=true;state.view='pedido';render();toast('Va · '+n+' insumos al pedido','ok')}

async function pfAgregarEquipo(tipo){const eqs=state.pf.equipos,base={refri:'REF',camara:'CAM',congelador:'CONG',ambiente:'AMB'}[tipo];

  pfVentana('Etiqueta '+e.nombre,`<div class="et"><div data-qr="${url}" data-s="150"></div><h2>${pfEsc(e.nombre)}</h2><div class="mono">${pfEsc(e.clave)}</div><div class="mono url">${pfEsc(url)}</div><div class="mono nfc">Para NFC: graba este mismo enlace en la etiqueta.</div></div>`,
  `@page{size:A6;margin:6mm}.et{border:3px solid #000;border-radius:14px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}h2{font-size:22px}.url{font-size:8px;word-break:break-all}.nfc{font-size:9px;opacity:.7}`)}

/* ---- Cargar la hoja llenada ---- */
// La lectura automática de la foto necesita la clave de Anthropic en Prep (aún no está). Mientras, se pasa a mano.
function pfCargarHoja(id){const e=pfEq(id);if(!e)return;const ts=state.pf.tandas.filter(t=>t.equipo_id===id);const extra=[];
  setHead('','Cargar hoja · '+e.nombre,pfCodigoHoja(e));$('#sheet-mark').innerHTML='<span class="material-symbols-outlined">fact_check</span>';
  const draw=()=>{$('#sheet-body').innerHTML=`
    <div class="sheet-section"><button class="btn ghost" id="ch-foto"><span class="material-symbols-outlined">photo_camera</span>Leer la hoja con una foto</button><div class="row-meta" id="ch-aviso" style="margin-top:6px"></div></div>
    <div class="sheet-section"><div class="field-lbl">Lo que quedó en el equipo</div><table class="tbl pf-tbl"><tr><th>Preparación</th><th>Había</th><th>Quedan</th><th>Botado</th></tr>
      ${ts.map(t=>`<tr><td>${pfEsc(t.nombre)}<div class="row-meta">${pfEsc(t.envase||'')} · ${pfFecha(t.vence)}</div></td><td class="mono">${num(t.cantidad)}</td><td><input type="number" min="0" step="0.5" data-q="${t.id}" value="${t.cantidad}"></td><td><input type="number" min="0" step="0.5" data-b="${t.id}" value="0"></td></tr>`).join('')}
      ${extra.map((x,i)=>`<tr><td><input data-xn="${i}" value="${pfEsc(x.nombre)}" placeholder="Nueva preparación"></td><td>—</td><td><input type="number" min="0" step="0.5" data-xq="${i}" value="${x.cantidad}"></td><td><input type="date" data-xv="${i}" value="${x.vence}"></td></tr>`).join('')}</table>
      <button class="mini-btn ghost" id="ch-add" style="margin-top:8px">+ Fila que no estaba en la hoja</button></div>
    <div class="sheet-section grid2"><button class="btn ghost" id="ch-no">Atrás</button><button class="btn primary" id="ch-si">Va · aplicar</button></div>`;
    const keep=()=>extra.forEach((x,i)=>{x.nombre=$(`[data-xn="${i}"]`).value;x.cantidad=Number($(`[data-xq="${i}"]`).value)||0;x.vence=$(`[data-xv="${i}"]`).value});
    $('#ch-foto').onclick=()=>{$('#ch-aviso').textContent='Falta la clave de Anthropic para leer la foto. Mientras tanto, pasa los números de la hoja a mano en la tabla.'};
    $('#ch-add').onclick=()=>{keep();extra.push({nombre:'',cantidad:1,vence:pfMas(pfVida(null,pfCongela(e)))});draw()};
    $('#ch-no').onclick=closeSheet;
    $('#ch-si').onclick=async()=>{keep();let cambios=0;
      for(const t of ts){const q=Number($(`[data-q="${t.id}"]`).value),b=Number($(`[data-b="${t.id}"]`).value)||0;if(isNaN(q))continue;
        const had=Number(t.cantidad),bot=Math.min(Math.max(b,0),had),uso=Math.max(0,+(had-bot-q).toFixed(3));
        if(bot>0){await pfSalidaSilenciosa(t,bot,'botar');cambios++}
        if(uso>0){await pfSalidaSilenciosa(t,uso,'usar');cambios++}
        const esperado=+(had-bot-uso).toFixed(3);
        if(q!==esperado){const r=await sb.from('inv_tandas').update(q>0?{cantidad:q,estado:'activa',updated_at:nowISO()}:{cantidad:0,estado:'consumida',updated_at:nowISO()}).eq('id',t.id);if(!r.error){await pfLog(t,'ajuste',+(q-esperado).toFixed(3),null,null);cambios++}}}
      for(const x of extra.filter(x=>x.nombre.trim()&&x.cantidad>0)){const r=await sb.from('inv_tandas').insert({local_id:LOCAL,nombre:x.nombre.trim(),equipo_id:id,cantidad:x.cantidad,vence:x.vence||null,responsable:pfQuien(),notas:'Cargada desde la hoja '+pfCodigoHoja(e)}).select().single();if(!r.error){await pfLog(r.data,'crear',x.cantidad,null,id);cambios++}}
      closeSheet();await Promise.all([loadProduccion(),loadMermas()]);render();toast(cambios?'Servido · '+cambios+' cambios aplicados':'Sin cambios',cambios?'ok':'');};
  };draw();openSheet()}
// Igual que pfSalida pero sin repintar ni avisar en cada fila (para la carga de la hoja)
async function pfSalidaSilenciosa(t,qty,tipo){const fresh=(await sb.from('inv_tandas').select('*').eq('id',t.id).single()).data||t;
  qty=Math.min(Number(qty),Number(fresh.cantidad));if(!(qty>0))return;const queda=+(Number(fresh.cantidad)-qty).toFixed(3);
  await sb.from('inv_tandas').update(queda>0?{cantidad:queda,updated_at:nowISO()}:{cantidad:0,estado:tipo==='botar'?'botada':'consumida',updated_at:nowISO()}).eq('id',t.id);
  await pfLog(t,tipo==='botar'?'botar':'consumir',qty,t.equipo_id,null);
  if(tipo==='botar')await sb.from('inv_mermas').insert({local_id:LOCAL,producto_id:'tanda:'+t.id,tanda_id:t.id,nombre:t.nombre+(t.envase?' · '+t.envase:''),cantidad:qty,motivo:'Vencimiento',valor_perdido:+(pfCostoEnvase(t)*qty).toFixed(2),area:pfEq(t.equipo_id)?.nombre||null,responsable:pfQuien(),notas:'Hoja '+(pfEq(t.equipo_id)?pfCodigoHoja(pfEq(t.equipo_id)):''),fecha:hoyISO()})}

/* ---- Arrastrar y soltar (pointer events: mouse y táctil) ---- */
let PFD=null;
function pfDockHTML(desde){return state.pf.equipos.filter(e=>e.activo&&e.id!==desde).map(e=>`<div data-drop="${e.id}"><span class="material-symbols-outlined">${pfIcoEq(e)}</span>${pfEsc(e.nombre)}</div>`).join('')
  +'<div class="usar" data-drop="usar"><span class="material-symbols-outlined">restaurant</span>Se usó</div><div class="botar" data-drop="botar"><span class="material-symbols-outlined">delete</span>Se botó</div>'}
function pfDestinoEn(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('[data-drop]'):null}
function pfLimpiarDrag(){if(!PFD)return;if(PFD.ghost)PFD.ghost.remove();$$('[data-drop].over').forEach(e=>e.classList.remove('over'));const d=$('#pf-dock');if(d)d.classList.remove('on');document.body.classList.remove('pf-dragging');PFD=null}
document.addEventListener('pointerdown',e=>{if(e.button>0)return;const board=$('#pf-board');if(!board||!board.contains(e.target))return;
  const drag=e.target.closest('[data-drag]'),card=e.target.closest('[data-edit]');if(!drag&&!card)return;
  PFD={drag,edit:card&&card.dataset.edit,x:e.clientX,y:e.clientY,started:false}});
document.addEventListener('pointermove',e=>{if(!PFD||!PFD.drag)return;
  if(!PFD.started){if(Math.hypot(e.clientX-PFD.x,e.clientY-PFD.y)<6)return;const t=pfTanda(PFD.drag.dataset.drag);if(!t){pfLimpiarDrag();return}
    PFD.started=true;PFD.id=t.id;PFD.qty=PFD.drag.dataset.uno?1:Number(t.cantidad);PFD.desde=t.equipo_id;
    PFD.ghost=document.createElement('div');PFD.ghost.className='pf-ghost';PFD.ghost.textContent=(PFD.drag.dataset.uno?'1 × ':num(t.cantidad)+' × ')+(t.envase||'envase')+' · '+t.nombre;document.body.appendChild(PFD.ghost);
    const dock=$('#pf-dock');dock.innerHTML=pfDockHTML(t.equipo_id);dock.classList.add('on');document.body.classList.add('pf-dragging')}
  e.preventDefault();PFD.ghost.style.transform='translate('+(e.clientX+12)+'px,'+(e.clientY+12)+'px)';
  const t=pfDestinoEn(e.clientX,e.clientY);$$('[data-drop].over').forEach(x=>{if(x!==t)x.classList.remove('over')});if(t&&t.dataset.drop!==PFD.desde)t.classList.add('over')},{passive:false});
document.addEventListener('pointerup',e=>{if(!PFD)return;const d=PFD;
  if(d.started){const t=pfDestinoEn(e.clientX,e.clientY);pfLimpiarDrag();if(!t)return;const dest=t.dataset.drop;
    if(dest===d.desde)return;if(dest==='usar')pfSalida(d.id,d.qty,'usar');else if(dest==='botar')pfAbrirBotar(d.id,d.qty);else pfMover(d.id,d.qty,dest)}
  else{PFD=null;if(d.edit&&Math.hypot(e.clientX-d.x,e.clientY-d.y)<6)pfAbrirTanda(d.edit)}});
document.addEventListener('pointercancel',pfLimpiarDrag);

// Cambios de otro equipo (tablet de cocina, celular): se juntan para no repintar a media acción
let pfRefT=null;function pfRefrescar(){clearTimeout(pfRefT);pfRefT=setTimeout(async()=>{if(PFD||$('#sheet').classList.contains('open')){pfRefrescar();return}await loadProduccion();if(state.view==='produccion')render();else renderTabs()},700)}
/* ===== REALTIME ===== */
function subscribe(){if(state.channel)sb.removeChannel(state.channel);
  state.channel=sb.channel('mercado_'+LOCAL)
    .on('postgres_changes',{event:'*',schema:'public',table:'inv_movimientos',filter:'local_id=eq.'+LOCAL},async()=>{await loadMovs();render()})
    .on('postgres_changes',{event:'*',schema:'public',table:'inv_ordenes_compra',filter:'local_id=eq.'+LOCAL},async()=>{await loadOrdenes();render()})
    .on('postgres_changes',{event:'*',schema:'public',table:'inv_tandas',filter:'local_id=eq.'+LOCAL},()=>pfRefrescar())
    .on('postgres_changes',{event:'*',schema:'public',table:'inv_equipos_frio',filter:'local_id=eq.'+LOCAL},()=>pfRefrescar())
    .subscribe();
}
$('#sheet-close').addEventListener('click',closeSheet);
$('#backdrop').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
loadAll().catch(err=>{console.error(err);$('#boot .msg').textContent='Atrás · '+(err.message||'fallo');$('#boot .spinner').style.borderTopColor='var(--secondary)'});
</script>
