<style>
:root{--primary:#1e5af9;--secondary:#ff3b30;--tertiary:#ffcc00;--bg:#fcf9f8;--surface:#fff;--ink:#171c20;--outline:#000;--primary-soft:#d6e2ff;--gray-soft:#dfe3e8;--green:#10b981;--amber-soft:#fef3c7;--red-soft:#fee2e2;--shadow-sm:4px 4px 0 0 #000;--font-display:'Bagel Fat One',system-ui,sans-serif;--font-body:'IBM Plex Sans',system-ui,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}.mono{font-family:var(--font-mono)}
.header{background:var(--bg);border-bottom:2px solid var(--outline);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{position:relative;width:92px;height:30px;flex-shrink:0;display:block}
.brand-logo .l{position:absolute;inset:0;-webkit-mask:url(/logo.png) left center/contain no-repeat;mask:url(/logo.png) left center/contain no-repeat;background:var(--ink)}
.brand-txt .cli{font-weight:700;font-size:14px;line-height:1.1}.brand-txt .mod{font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.6}
.header-info{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{padding:7px 14px;border:2px solid var(--outline);border-radius:999px;background:var(--surface);font-weight:600;font-size:13px;box-shadow:2px 2px 0 0 #000;cursor:pointer}.chip.active{background:var(--ink);color:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.section-t{font-family:var(--font-display);font-size:20px;margin:22px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.kpi{background:var(--surface);border:2px solid var(--outline);border-radius:16px;box-shadow:var(--shadow-sm);padding:14px 16px}
.kpi .v{font-family:var(--font-display);font-size:26px;line-height:1.05;color:var(--primary)}.kpi .l{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;opacity:.6;margin-top:5px}
.kpi.good .v{color:var(--green)}.kpi.bad .v{color:var(--secondary)}.kpi .ico{float:right;opacity:.25}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}@media(max-width:780px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:2px solid var(--outline);border-radius:16px;box-shadow:var(--shadow-sm);padding:16px;margin-bottom:16px}
.panel h3{font-family:var(--font-display);font-size:17px;margin-bottom:12px}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;background:var(--primary);border:2px solid var(--outline);border-radius:6px 6px 0 0;min-height:3px}
.chart .cap{font-family:var(--font-mono);font-size:9px;opacity:.6}.chart .val{font-family:var(--font-mono);font-size:9px;font-weight:600}
.bar2{margin-bottom:8px}.bar2 .t{display:flex;justify-content:space-between;font-size:13px}.bar2 .track{height:9px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin-top:3px}.bar2 .fill{height:100%;background:var(--primary)}
.li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--gray-soft);font-size:14px}.li:last-child{border:none}
.empty{font-family:var(--font-mono);font-size:12px;opacity:.5;text-align:center;padding:14px}
.boot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:300;transition:opacity .3s}.boot.gone{opacity:0;pointer-events:none}
.boot .logo{position:relative;width:220px;height:73px}.boot .logo .l{position:absolute;inset:0;-webkit-mask:url(/logo.png) center/contain no-repeat;mask:url(/logo.png) center/contain no-repeat;background:var(--ink)}
.boot .spinner{width:34px;height:34px;border:4px solid var(--outline);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.vtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.rp-intro{font-size:14px;max-width:70ch;opacity:.8;margin-bottom:14px;line-height:1.5}
.rp-scroll{overflow-x:auto;border:2px solid var(--outline);border-radius:16px;box-shadow:var(--shadow-sm);background:var(--surface)}
.rp-tbl{border-collapse:collapse;width:100%;font-size:13px;min-width:980px}
.rp-tbl th{background:var(--ink);color:var(--bg);font-size:11px;font-weight:600;padding:8px 6px;text-align:center;vertical-align:bottom;line-height:1.2}
.rp-tbl th.l,.rp-tbl td.l{text-align:left}
.rp-tbl td{padding:8px 6px;border-top:1px dashed var(--gray-soft);text-align:center;vertical-align:middle}
.rp-tbl tr.off td{opacity:.45}
.rp-tbl input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
.rp-tbl select,.rp-tbl input[type=time]{font:inherit;font-size:12px;padding:4px 6px;border:2px solid var(--outline);border-radius:8px;background:var(--surface)}
.rp-who strong{display:block;font-size:14px}.rp-who span{font-size:11px;opacity:.65}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:2px solid var(--outline);border-radius:999px;background:var(--surface);cursor:pointer;box-shadow:2px 2px 0 0 #000}
.ibtn:active{transform:translate(1px,1px);box-shadow:none}.ibtn .material-symbols-outlined{font-size:17px}
.ibtn.pri{background:var(--primary);color:#fff}
.btnp{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:2px solid var(--outline);border-radius:999px;font-weight:600;font-size:14px;background:var(--primary);color:#fff;box-shadow:var(--shadow-sm);cursor:pointer;font-family:inherit}
.btnp.ghost{background:var(--surface);color:var(--ink)}.btnp:active{transform:translate(2px,2px);box-shadow:none}
.est{font-family:var(--font-mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;border:2px solid var(--outline);white-space:nowrap}
.est.enviado{background:var(--green);color:#fff}.est.pendiente_llave{background:var(--tertiary)}.est.error{background:var(--secondary);color:#fff}
.ovl{position:fixed;inset:0;background:rgba(23,28,32,.55);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:24px 16px;overflow:auto}.ovl.open{display:flex}
.ovl .box{background:var(--bg);border:2px solid var(--outline);border-radius:18px;box-shadow:8px 8px 0 0 #000;width:100%;max-width:760px;padding:18px}
.ovl .box h3{font-family:var(--font-display);font-size:20px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:12px;font-weight:600}
.fld input{font:inherit;font-size:14px;font-weight:400;padding:9px 11px;border:2px solid var(--outline);border-radius:10px;background:var(--surface)}
.prev-frame{width:100%;height:60vh;border:2px solid var(--outline);border-radius:12px;background:#fff}
.prev-txt{white-space:pre-wrap;font-family:var(--font-mono);font-size:12px;background:var(--surface);border:2px solid var(--outline);border-radius:12px;padding:12px;max-height:60vh;overflow:auto}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:300;opacity:0;transform:translateY(10px);transition:.25s}.toast.show{opacity:1;transform:none}
.boot .msg{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;opacity:.6}
</style>
</head>
<body>
<div id="boot" class="boot"><div class="logo"><span class="l"></span></div><div class="spinner"></div><div class="msg">Oído · consolidando</div></div>
<header class="header">
  <div class="brand"><a href="/" class="brand-logo" title="Inicio"><span class="l"></span></a><div class="brand-txt"><div class="cli"></div><div class="mod">Módulo Directorio</div></div></div>
  <div class="header-info" id="per"></div>
</header>
<main class="wrap"><div class="vtabs" id="vtabs"></div><div id="screen"></div></main>
<div class="ovl" id="ovl"><div class="box" id="ovl-box"></div></div>
<div class="toast" id="toast"></div>
<script>
const SB_URL='https://jmkvphayyhwzootlybde.supabase.co',SB_KEY='sb_publishable_0-znERv1Ok0Dw-Re44eksw_QAOqDc8M',MARCA=(window.PREP_MARCA||'m6'),LOCAL=(window.PREP_LOCAL||'l11');
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const state={periodo:'mes',data:null,vista:(location.hash==='#reportes'?'reportes':'resumen'),rp:null};
function money(n){return 'S/ '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0})}
function num(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0})}
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addD(iso,n){const[y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+n);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function bounds(){const h=hoyISO();if(state.periodo==='hoy')return{ini:h,fin:addD(h,1)};if(state.periodo==='7d')return{ini:addD(h,-6),fin:addD(h,1)};return{ini:h.slice(0,8)+'01',fin:addD(h,1)}}

// Trae todas las filas paginando de a 1000 (PostgREST corta en 1000 por consulta).
async function fetchAll(mk){const out=[];for(let f=0;;f+=1000){const{data,error}=await mk().order('id').range(f,f+999);if(error)throw error;out.push(...(data||[]));if(!data||data.length<1000)break}return out}
async function load(){
  const{ini,fin}=bounds();
  const[pe,prod,stock,merm,vu,emp,res,dl,fin_p]=await Promise.all([
    fetchAll(()=>sb.from('ca_pedidos').select('id,total,estado,origen,cerrada_at').eq('local_id',LOCAL).eq('estado','cerrada').gte('cerrada_at',ini+'T00:00:00').lt('cerrada_at',fin+'T00:00:00')).then(data=>({data})),
    sb.from('inv_productos').select('id,costo,par_level').eq('marca_id',MARCA),
    sb.from('inv_stock_actual').select('producto_id,stock').eq('local_id',LOCAL),
    sb.from('inv_mermas').select('valor_perdido,fecha').eq('local_id',LOCAL).gte('fecha',ini).lt('fecha',fin),
    sb.from('vu_gastos').select('monto,fecha,estado').eq('local_id',LOCAL).neq('estado','rechazado').gte('fecha',ini).lt('fecha',fin),
    sb.from('rrhh_empleados').select('sueldo,estado').eq('local_id',LOCAL).eq('estado','activo'),
    sb.from('ms_reservas').select('comensales,estado,fecha').eq('local_id',LOCAL).gte('fecha',ini).lt('fecha',fin),
    sb.from('dl_pedidos').select('total,estado,created_at').eq('local_id',LOCAL).gte('created_at',ini+'T00:00:00').lt('created_at',fin+'T00:00:00'),
    sb.from('fin_partidas').select('tipo,monto,activo').eq('local_id',LOCAL).eq('activo',true),
  ]);
  const peds=pe.data||[];const ids=peds.map(p=>p.id);
  let items=[];if(ids.length){items=(await fetchAll(()=>sb.from('ca_pedido_items').select('receta_id,nombre,qty,precio_total,estado,pedido_id,ca_pedidos!inner(local_id,estado,cerrada_at)').eq('ca_pedidos.local_id',LOCAL).eq('ca_pedidos.estado','cerrada').gte('ca_pedidos.cerrada_at',ini+'T00:00:00').lt('ca_pedidos.cerrada_at',fin+'T00:00:00').neq('estado','cancelado'))).map(({ca_pedidos,...r})=>r)}
  const{data:recetas}=await sb.from('inv_recetas').select('id,ingredientes').eq('marca_id',MARCA);
  const[allPe,locs]=await Promise.all([
    sb.from('ca_pedidos').select('local_id,total').eq('estado','cerrada').gte('cerrada_at',ini+'T00:00:00').lt('cerrada_at',fin+'T00:00:00'),
    sb.from('inv_locales').select('id,nombre').order('orden',{nullsFirst:false}).order('id')
  ]);
  state.data={peds,items,recetas:recetas||[],prod:prod.data||[],stock:stock.data||[],merm:merm.data||[],vu:vu.data||[],emp:emp.data||[],res:res.data||[],dl:dl.data||[],fin:fin_p.data||[],sedesRaw:allPe.data||[],locales:locs.data||[]};
  render();$('#boot').classList.add('gone');
}
function costoProd(d,pid){const p=d.prod.find(x=>x.id===pid);return p?Number(p.costo||0):0}
function costoReceta(d,rid){const r=d.recetas.find(x=>x.id===rid);if(!r||!Array.isArray(r.ingredientes))return 0;return r.ingredientes.reduce((a,ing)=>{if(!ing.pid)return a;const m=Number(ing.merma||0);const f=(m>0&&m<100)?1/(1-m/100):1;return a+Number(ing.cantidad||0)*f*costoProd(d,ing.pid)},0)}

function renderTabs(){
  $('#vtabs').innerHTML=[['resumen','monitoring','Resumen ejecutivo'],['reportes','schedule_send','Reportes programados']].map(([k,i,l])=>`<button class="chip ${state.vista===k?'active':''}" data-v="${k}"><span class="material-symbols-outlined" style="font-size:16px">${i}</span> ${l}</button>`).join('');
  $$('#vtabs .chip').forEach(b=>b.onclick=()=>{state.vista=b.dataset.v;history.replaceState(null,'',state.vista==='reportes'?'#reportes':location.pathname+location.search);render()});
}
function render(){
  renderTabs();
  if(state.vista==='reportes'){$('#per').innerHTML='';renderReportes();return}
  const d=state.data;const per=[['hoy','Hoy'],['7d','7 días'],['mes','Mes']];
  $('#per').innerHTML=per.map(p=>`<button class="chip ${state.periodo===p[0]?'active':''}" data-p="${p[0]}">${p[1]}</button>`).join('');
  $$('#per .chip').forEach(b=>b.onclick=async()=>{state.periodo=b.dataset.p;$('#boot').classList.remove('gone');await load()});
  // ventas
  const ventas=d.peds.reduce((a,p)=>a+Number(p.total||0),0);const nped=d.peds.length;const ticket=nped?ventas/nped:0;
  const porCanal={};d.peds.forEach(p=>{const c=p.origen||'salon';porCanal[c]=(porCanal[c]||0)+Number(p.total||0)});
  // food cost de lo vendido
  const cmv=d.items.reduce((a,it)=>a+costoReceta(d,it.receta_id)*Number(it.qty||0),0);
  const fcPct=ventas>0?cmv/ventas*100:0;
  // top platos
  const top={};d.items.forEach(it=>{const k=it.nombre||it.receta_id;if(!top[k])top[k]={qty:0,rev:0};top[k].qty+=Number(it.qty||0);top[k].rev+=Number(it.precio_total||0)});
  const topArr=Object.entries(top).sort((a,b)=>b[1].rev-a[1].rev).slice(0,8);const maxTop=Math.max(1,...topArr.map(x=>x[1].rev));
  // inventario
  const sm={};d.stock.forEach(s=>sm[s.producto_id]=Number(s.stock||0));let valorInv=0,bajoPar=0;d.prod.forEach(p=>{const s=sm[p.id]||0;valorInv+=s*Number(p.costo||0);if(s<Number(p.par_level||0))bajoPar++});
  const merma=d.merm.reduce((a,m)=>a+Number(m.valor_perdido||0),0);
  // costos
  const cajachica=d.vu.reduce((a,g)=>a+Number(g.monto||0),0);
  const planillaMes=d.emp.reduce((a,e)=>a+Number(e.sueldo||0),0);
  const planillaPer=state.periodo==='mes'?planillaMes:state.periodo==='7d'?planillaMes/4.3:planillaMes/30;
  const laborPct=ventas>0?planillaPer/ventas*100:0;
  // operativo
  const cubiertos=d.res.filter(r=>['confirmada','sentada','completada'].includes(r.estado)).reduce((a,r)=>a+(r.comensales||0),0);
  const delivery=d.dl.filter(p=>p.estado!=='cancelado').reduce((a,p)=>a+Number(p.total||0),0);
  // presupuesto ingresos (mes)
  const presupIng=d.fin.filter(p=>p.tipo==='ingreso').reduce((a,p)=>a+Number(p.monto||0),0);
  // utilidad estimada (aprox): ventas - cmv - planilla(per) - cajachica
  const utilidad=ventas-cmv-planillaPer-cajachica;
  // ventas 7 días (siempre)
  const dias={};for(let i=6;i>=0;i--)dias[addD(hoyISO(),-i)]=0;
  d.peds.forEach(p=>{const dd=(p.cerrada_at||'').slice(0,10);if(dd in dias)dias[dd]+=Number(p.total||0)});

  state.resumen={ventas,ticket,nped,fcPct,cmv,planillaPer,laborPct,cajachica,utilidad};
  $('#screen').innerHTML=`
    <div class="section-t" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span>Resumen ejecutivo · ${state.periodo==='hoy'?'hoy':state.periodo==='7d'?'últimos 7 días':'este mes'}</span><button id="exp-csv" style="font-family:var(--font-mono);font-size:12px;font-weight:700;border:2px solid var(--outline);border-radius:999px;padding:6px 12px;background:var(--surface);cursor:pointer;display:inline-flex;gap:6px;align-items:center"><span class="material-symbols-outlined" style="font-size:16px">download</span>Exportar CSV</button></div>
    <div class="kpis">
      <div class="kpi good"><span class="ico material-symbols-outlined">payments</span><div class="v">${money(ventas)}</div><div class="l">Ventas</div></div>
      <div class="kpi"><div class="v">${money(ticket)}</div><div class="l">Ticket promedio</div></div>
      <div class="kpi"><div class="v">${num(nped)}</div><div class="l">Pedidos</div></div>
      <div class="kpi ${fcPct>35?'bad':''}"><div class="v">${fcPct?fcPct.toFixed(0)+'%':'—'}</div><div class="l">Food cost</div></div>
      <div class="kpi ${laborPct>30?'bad':''}"><div class="v">${laborPct?laborPct.toFixed(0)+'%':'—'}</div><div class="l">Costo laboral</div></div>
      <div class="kpi ${utilidad>=0?'good':'bad'}"><div class="v">${money(utilidad)}</div><div class="l">Utilidad estimada</div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Ventas últimos 7 días</h3><div class="chart">${Object.entries(dias).map(([dd,v])=>{const mx=Math.max(1,...Object.values(dias));const dt=new Date(dd+'T00:00:00');const dn=['D','L','M','M','J','V','S'][dt.getDay()];return `<div class="col"><div class="val">${v?('S/'+Math.round(v/1000)+'k').replace('S/0k','S/'+Math.round(v)):''}</div><div class="bar" style="height:${Math.round(v/mx*100)}%;background:${dd===hoyISO()?'var(--tertiary)':'var(--primary)'}"></div><div class="cap">${dn} ${dt.getDate()}</div></div>`}).join('')}</div></div>
      <div class="panel"><h3>Ventas por canal</h3>${Object.keys(porCanal).length?Object.entries(porCanal).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{const mx=Math.max(1,...Object.values(porCanal));return `<div class="bar2"><div class="t"><span style="text-transform:capitalize">${c}</span><span class="mono">${money(v)}</span></div><div class="track"><div class="fill" style="width:${Math.round(v/mx*100)}%"></div></div></div>`}).join(''):'<div class="empty">Sin ventas en el período</div>'}</div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Top platos (por venta)</h3>${topArr.length?topArr.map(([n,o])=>`<div class="bar2"><div class="t"><span>${n} · ${num(o.qty)}u</span><span class="mono">${money(o.rev)}</span></div><div class="track"><div class="fill" style="width:${Math.round(o.rev/maxTop*100)}%;background:var(--green)"></div></div></div>`).join(''):'<div class="empty">Sin platos vendidos</div>'}</div>
      <div class="panel"><h3>Operación</h3>
        <div class="li"><span>Cubiertos (reservas)</span><strong class="mono">${num(cubiertos)}</strong></div>
        <div class="li"><span>Ventas delivery</span><strong class="mono">${money(delivery)}</strong></div>
        <div class="li"><span>Valor de inventario</span><strong class="mono">${money(valorInv)}</strong></div>
        <div class="li"><span>Insumos bajo par</span><strong class="mono" style="color:${bajoPar?'var(--secondary)':''}">${bajoPar}</strong></div>
        <div class="li"><span>Mermas</span><strong class="mono">${money(merma)}</strong></div>
        <div class="li"><span>Caja chica</span><strong class="mono">${money(cajachica)}</strong></div>
      </div>
    </div>
    <div class="panel"><h3>Costos y utilidad (estimado)</h3>
      <div class="li"><span>Ventas</span><strong class="mono">${money(ventas)}</strong></div>
      <div class="li"><span>− Costo de insumos (CMV ${fcPct.toFixed(0)}%)</span><strong class="mono">${money(cmv)}</strong></div>
      <div class="li"><span>− Planilla (${state.periodo})</span><strong class="mono">${money(planillaPer)}</strong></div>
      <div class="li"><span>− Caja chica</span><strong class="mono">${money(cajachica)}</strong></div>
      <div class="li" style="font-family:var(--font-display);font-size:17px"><span>Utilidad estimada</span><strong style="color:${utilidad>=0?'var(--green)':'var(--secondary)'}">${money(utilidad)}</strong></div>
      ${state.periodo==='mes'&&presupIng>0?`<div class="li" style="font-size:12px;opacity:.7"><span>Avance vs presupuesto de ingresos</span><span>${Math.round(ventas/presupIng*100)}% de ${money(presupIng)}</span></div>`:''}
    </div>
    ${sedesPanel()}
    <div style="font-family:var(--font-mono);font-size:10px;opacity:.5;text-align:center;padding:8px">Consolidado de POS, Recetas, Mercado, RRHH, Vuelto, Bienvenida y Delivery. Para análisis tributario formal, ver Finanzas/Contabilidad.</div>`;
  $('#exp-csv').onclick=exportarCSV;
}
function sedesPanel(){
  const d=state.data;const locs=d.locales||[];if(locs.length<2)return'';
  const g={};(d.sedesRaw||[]).forEach(p=>{const k=p.local_id;(g[k]=g[k]||{v:0,n:0});g[k].v+=Number(p.total||0);g[k].n++;});
  const rows=locs.map(l=>({l,v:(g[l.id]||{}).v||0,n:(g[l.id]||{}).n||0})).sort((a,b)=>b.v-a.v);
  const max=Math.max(1,...rows.map(r=>r.v));
  return `<div class="section-t" style="margin-top:22px">Comparativo de sedes · ${state.periodo==='hoy'?'hoy':state.periodo==='7d'?'7 días':'este mes'}</div>
    <div class="panel"><table style="width:100%;border-collapse:collapse;font-size:13px">
      <tr style="text-align:left;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;opacity:.6"><th style="padding:6px">Sede</th><th style="text-align:right">Ventas</th><th style="text-align:right">Pedidos</th><th style="text-align:right">Ticket</th></tr>
      ${rows.map(r=>`<tr style="border-top:1px solid var(--gray-soft)"><td style="padding:8px 6px"><strong>${r.l.nombre||r.l.id}</strong><div class="track" style="height:6px;border-radius:99px;background:var(--gray-soft);margin-top:4px"><div style="height:100%;border-radius:99px;background:var(--primary);width:${Math.round(r.v/max*100)}%"></div></div></td><td style="text-align:right;font-family:var(--font-mono)">${money(r.v)}</td><td style="text-align:right;font-family:var(--font-mono)">${num(r.n)}</td><td style="text-align:right;font-family:var(--font-mono)">${money(r.n?r.v/r.n:0)}</td></tr>`).join('')}
    </table></div>`;
}
function exportarCSV(){
  const r=state.resumen||{};const per=state.periodo;
  const rows=[['Reporte','Prep · '+CLIENTE_NOM],['Periodo',per],['Generado',hoyISO()],[],
    ['Métrica','Valor'],
    ['Ventas',(r.ventas||0).toFixed(2)],['Ticket promedio',(r.ticket||0).toFixed(2)],['Pedidos',r.nped||0],
    ['Food cost %',(r.fcPct||0).toFixed(1)],['CMV',(r.cmv||0).toFixed(2)],
    ['Planilla ('+per+')',(r.planillaPer||0).toFixed(2)],['Labor cost %',(r.laborPct||0).toFixed(1)],
    ['Caja chica',(r.cajachica||0).toFixed(2)],['Utilidad estimada',(r.utilidad||0).toFixed(2)]];
  const csv='﻿'+rows.map(row=>row.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='prep-resumen-'+per+'-'+hoyISO()+'.csv';document.body.appendChild(a);a.click();a.remove();
}
const CLIENTE_NOM='Casa Italia';

/* ===== REPORTES PROGRAMADOS (DI-05) =====
   Cada persona elige qué reportes recibe, por email o WhatsApp, cada día/semana/mes a una hora.
   Datos: rep_catalogo, rep_suscripciones, rep_envios. Envío: Edge Function reportes-programados (pg_cron cada 15 min). */
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}
function escH(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function abrirOvl(html){$('#ovl-box').innerHTML=html;$('#ovl').classList.add('open')}
function cerrarOvl(){$('#ovl').classList.remove('open')}
$('#ovl').addEventListener('click',e=>{if(e.target.id==='ovl')cerrarOvl()});
async function loadRP(){
  const[c,s,e]=await Promise.all([
    sb.from('rep_catalogo').select('*').order('orden'),
    sb.from('rep_suscripciones').select('*').eq('local_id',LOCAL).order('created_at'),
    sb.from('rep_envios').select('id,suscripcion_id,canal,destino,estado,detalle,asunto,texto,origen,created_at').eq('local_id',LOCAL).order('created_at',{ascending:false}).limit(25)]);
  state.rp={cat:c.data||[],subs:s.data||[],env:e.data||[]};
}
async function renderReportes(){
  if(!state.rp){$('#screen').innerHTML='<div class="empty">Oído · cargando reportes</div>';await loadRP()}
  const{cat,subs,env}=state.rp;
  const fr=s=>`<select data-f="frecuencia">${['diaria','semanal','mensual'].map(f=>`<option value="${f}" ${s.frecuencia===f?'selected':''}>${f[0].toUpperCase()+f.slice(1)}</option>`).join('')}</select>
    ${s.frecuencia==='semanal'?`<select data-f="dia_semana" style="margin-top:4px">${DIAS.map((d,i)=>`<option value="${i}" ${Number(s.dia_semana??1)===i?'selected':''}>${d}</option>`).join('')}</select>`:''}
    ${s.frecuencia==='mensual'?`<select data-f="dia_mes" style="margin-top:4px">${Array.from({length:28},(_,i)=>`<option value="${i+1}" ${Number(s.dia_mes??1)===i+1?'selected':''}>Día ${i+1}</option>`).join('')}</select>`:''}`;
  const nombreSub=id=>subs.find(x=>x.id===id)?.nombre||'—';
  $('#screen').innerHTML=`
    <div class="section-t">Reportes programados</div>
    <p class="rp-intro">Elige qué recibe cada persona y cuándo. Los reportes salen solos a la hora indicada (hora de Lima) con los datos reales del local: el reporte diario cubre la noche anterior (de 6:00 a 6:00), el semanal los últimos 7 días y el mensual los últimos 30. Marca varias columnas para armar un reporte a medida.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <button class="btnp" id="rp-add"><span class="material-symbols-outlined" style="font-size:18px">person_add</span>Agregar persona</button>
      <button class="btnp ghost" id="rp-prev-libre"><span class="material-symbols-outlined" style="font-size:18px">preview</span>Vista previa de todo</button>
    </div>
    <div class="rp-scroll"><table class="rp-tbl">
      <tr><th class="l" style="min-width:170px">Persona</th>${cat.map(c=>`<th title="${escH(c.descripcion)}">${escH(c.nombre)}<div style="opacity:.6;font-weight:400">${escH(c.modulo)}</div></th>`).join('')}<th>Canal</th><th>Frecuencia</th><th>Hora</th><th>Activo</th><th style="min-width:120px"></th></tr>
      ${subs.length?subs.map(s=>`<tr data-id="${s.id}" class="${s.activo?'':'off'}">
        <td class="l rp-who"><strong>${escH(s.nombre)}</strong><span>${escH(s.puesto||'')}${s.titulo?' · '+escH(s.titulo):''}</span></td>
        ${cat.map(c=>`<td><input type="checkbox" data-r="${c.clave}" ${(s.reportes||[]).includes(c.clave)?'checked':''} aria-label="${escH(c.nombre)} para ${escH(s.nombre)}"></td>`).join('')}
        <td><select data-f="canal"><option value="email" ${s.canal==='email'?'selected':''}>Email</option><option value="whatsapp" ${s.canal==='whatsapp'?'selected':''}>WhatsApp</option><option value="ambos" ${s.canal==='ambos'?'selected':''}>Ambos</option></select></td>
        <td>${fr(s)}</td>
        <td><input type="time" data-f="hora" value="${String(s.hora||'08:00').slice(0,5)}"></td>
        <td><input type="checkbox" data-f="activo" ${s.activo?'checked':''} aria-label="Activo"></td>
        <td style="white-space:nowrap"><button class="ibtn" data-a="prev" title="Vista previa"><span class="material-symbols-outlined">preview</span></button>
          <button class="ibtn pri" data-a="send" title="Enviar ahora (prueba)"><span class="material-symbols-outlined">send</span></button>
          <button class="ibtn" data-a="edit" title="Editar persona"><span class="material-symbols-outlined">edit</span></button></td>
      </tr>`).join(''):`<tr><td colspan="${cat.length+6}" class="empty">Todavía nadie recibe reportes. Agrega a la primera persona.</td></tr>`}
    </table></div>
    <div class="section-t" style="margin-top:26px">Últimos envíos</div>
    <div class="panel">${env.length?env.map(e=>`<div class="li" style="align-items:center;gap:10px"><span style="min-width:0"><strong>${escH(nombreSub(e.suscripcion_id))}</strong> · ${e.canal==='whatsapp'?'WhatsApp':'Email'}${e.origen==='prueba'?' · prueba':''}<br><span style="font-size:12px;opacity:.65">${new Date(e.created_at).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'})} · ${escH(e.asunto||'')}</span>${e.estado!=='enviado'?`<br><span style="font-size:12px;opacity:.75">${escH(motivoEnvio(e))}</span>`:''}</span>
      <span style="display:flex;gap:6px;align-items:center">${e.canal==='whatsapp'&&e.estado!=='enviado'&&e.destino?`<a class="ibtn" title="Abrir en WhatsApp" target="_blank" rel="noopener" href="https://wa.me/${escH(e.destino)}?text=${encodeURIComponent(e.texto||'')}"><span class="material-symbols-outlined">chat</span></a>`:''}<span class="est ${escH(e.estado)}">${({enviado:'Enviado',pendiente_llave:'Falta llave',error:'Atrás'})[e.estado]||escH(e.estado)}</span></span></div>`).join(''):'<div class="empty">Sin envíos todavía</div>'}</div>`;
  $('#rp-add').onclick=()=>editarPersona(null);
  $('#rp-prev-libre').onclick=()=>vistaPrevia({reportes:cat.map(c=>c.clave),frecuencia:'diaria',titulo:'Reporte diario',nombre:'Vista previa'});
  $$('#screen tr[data-id]').forEach(tr=>{
    const id=tr.dataset.id,s=subs.find(x=>x.id===id);
    tr.querySelectorAll('input[data-r]').forEach(cb=>cb.onchange=()=>{const set=new Set(s.reportes||[]);cb.checked?set.add(cb.dataset.r):set.delete(cb.dataset.r);guardarSub(s,{reportes:[...set]})});
    tr.querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{const f=el.dataset.f;let v=el.type==='checkbox'?el.checked:el.value;if(f==='dia_semana'||f==='dia_mes')v=Number(v);const patch={[f]:v};if(f==='frecuencia'){if(v==='semanal'&&s.dia_semana==null)patch.dia_semana=1;if(v==='mensual'&&s.dia_mes==null)patch.dia_mes=1}guardarSub(s,patch,f==='frecuencia'||f==='activo')});
    tr.querySelector('[data-a="prev"]').onclick=()=>vistaPrevia(s);
    tr.querySelector('[data-a="send"]').onclick=()=>enviarAhora(s);
    tr.querySelector('[data-a="edit"]').onclick=()=>editarPersona(s);
  });
}
function motivoEnvio(e){if(e.estado==='pendiente_llave')return e.canal==='whatsapp'?'Falta conectar WhatsApp Business. Mientras, ábrelo en WhatsApp y envíalo tú.':'Falta la llave del servicio de email.';
  if(/not verified/i.test(e.detalle||''))return 'El dominio de envío de email todavía no está verificado.';return e.detalle||''}
async function guardarSub(s,patch,rerender){
  patch.updated_at=new Date().toISOString();
  const{error}=await sb.from('rep_suscripciones').update(patch).eq('id',s.id);
  if(error){toast('Atrás · '+error.message);return}
  Object.assign(s,patch);toast('Servido · guardado');if(rerender)renderReportes();
}
function editarPersona(s){
  const v=s||{nombre:'',puesto:'',email:'',whatsapp:'',titulo:''};
  abrirOvl(`<h3>${s?'Editar persona':'Agregar persona'}<button class="ibtn" id="ov-x" aria-label="Cerrar"><span class="material-symbols-outlined">close</span></button></h3>
    <div class="grid2" style="gap:10px">
      <label class="fld">Nombre<input id="pf-nombre" value="${escH(v.nombre)}" placeholder="Ej. Renzo Paredes"></label>
      <label class="fld">Puesto<input id="pf-puesto" value="${escH(v.puesto||'')}" placeholder="Ej. Jefe de barra"></label>
      <label class="fld">Email<input id="pf-email" type="email" value="${escH(v.email||'')}" placeholder="nombre@correo.com"></label>
      <label class="fld">WhatsApp<input id="pf-wa" value="${escH(v.whatsapp||'')}" placeholder="987 654 321"></label>
    </div>
    <label class="fld">Nombre del reporte (opcional)<input id="pf-titulo" value="${escH(v.titulo||'')}" placeholder="Ej. Barra: stock y pour cost"></label>
    <div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:6px">
      ${s?'<button class="btnp ghost" id="pf-del" style="color:var(--secondary)"><span class="material-symbols-outlined" style="font-size:18px">delete</span>Quitar</button>':'<span></span>'}
      <button class="btnp" id="pf-ok">${s?'Guardar':'Agregar'}</button></div>`);
  $('#ov-x').onclick=cerrarOvl;
  $('#pf-ok').onclick=async()=>{
    const row={nombre:$('#pf-nombre').value.trim(),puesto:$('#pf-puesto').value.trim()||null,email:$('#pf-email').value.trim()||null,whatsapp:$('#pf-wa').value.trim()||null,titulo:$('#pf-titulo').value.trim()||null};
    if(!row.nombre){toast('Escribe el nombre');return}
    if(!row.email&&!row.whatsapp){toast('Agrega un email o un WhatsApp');return}
    let r;if(s)r=await sb.from('rep_suscripciones').update({...row,updated_at:new Date().toISOString()}).eq('id',s.id);
    else r=await sb.from('rep_suscripciones').insert({...row,marca_id:MARCA,local_id:LOCAL,reportes:['ventas'],canal:row.email&&row.whatsapp?'ambos':row.email?'email':'whatsapp',frecuencia:'diaria',hora:'08:00'});
    if(r.error){toast('Atrás · '+r.error.message);return}
    cerrarOvl();state.rp=null;renderReportes();toast(s?'Servido · persona actualizada':'Va · ahora marca sus reportes en la tabla');
  };
  if($('#pf-del'))$('#pf-del').onclick=async()=>{if(!confirm('¿Quitar a '+s.nombre+' de los reportes?'))return;const{error}=await sb.from('rep_suscripciones').delete().eq('id',s.id);if(error){toast('Atrás · '+error.message);return}cerrarOvl();state.rp=null;renderReportes();toast('Servido · quitado')};
}
async function vistaPrevia(s){
  if(!(s.reportes||[]).length){toast('Marca al menos un reporte');return}
  abrirOvl(`<h3>Vista previa<button class="ibtn" id="ov-x" aria-label="Cerrar"><span class="material-symbols-outlined">close</span></button></h3><div class="empty">Oído · armando el reporte con los datos del local</div>`);$('#ov-x').onclick=cerrarOvl;
  const{data,error}=await sb.functions.invoke('reportes-programados',{body:{modo:'preview',local_id:LOCAL,marca_id:MARCA,reportes:s.reportes,frecuencia:s.frecuencia||'diaria',titulo:s.titulo}});
  if(error||!data?.ok){$('#ovl-box').innerHTML=`<h3>Vista previa<button class="ibtn" id="ov-x"><span class="material-symbols-outlined">close</span></button></h3><div class="empty">Atrás · ${escH(data?.error||error?.message||'no se pudo armar')}</div>`;$('#ov-x').onclick=cerrarOvl;return}
  const wa=(s.whatsapp||'').replace(/\D/g,'');const waNum=wa.length===9?'51'+wa:wa;
  $('#ovl-box').innerHTML=`<h3><span>${escH(data.asunto)}</span><button class="ibtn" id="ov-x" aria-label="Cerrar"><span class="material-symbols-outlined">close</span></button></h3>
    <div class="vtabs"><button class="chip active" data-pv="email">Como email</button><button class="chip" data-pv="wa">Como WhatsApp</button></div>
    <div id="pv-body"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btnp ghost" id="pv-copy"><span class="material-symbols-outlined" style="font-size:18px">content_copy</span>Copiar texto</button>
      <a class="btnp ghost" target="_blank" rel="noopener" href="https://wa.me/${waNum}?text=${encodeURIComponent(data.texto)}" style="text-decoration:none"><span class="material-symbols-outlined" style="font-size:18px">chat</span>Abrir en WhatsApp</a></div>`;
  const show=k=>{$$('#ovl-box [data-pv]').forEach(b=>b.classList.toggle('active',b.dataset.pv===k));
    if(k==='email'){$('#pv-body').innerHTML='<iframe class="prev-frame" id="pv-if" title="Vista previa del email"></iframe>';$('#pv-if').srcdoc=data.html}else{$('#pv-body').innerHTML=`<div class="prev-txt">${escH(data.texto)}</div>`}};
  show('email');$$('#ovl-box [data-pv]').forEach(b=>b.onclick=()=>show(b.dataset.pv));
  $('#ov-x').onclick=cerrarOvl;
  $('#pv-copy').onclick=async()=>{try{await navigator.clipboard.writeText(data.texto);toast('Servido · texto copiado')}catch(e){toast('No se pudo copiar')}};
}
async function enviarAhora(s){
  if(!(s.reportes||[]).length){toast('Marca al menos un reporte');return}
  toast('Oído · enviando a '+s.nombre);
  const{data,error}=await sb.functions.invoke('reportes-programados',{body:{modo:'enviar',suscripcion_id:s.id}});
  if(error||!data?.ok){toast('Atrás · '+(data?.error||error?.message||'no se pudo enviar'));return}
  const ok=(data.envios||[]).filter(e=>e.estado==='enviado').length,tot=(data.envios||[]).length;
  toast(ok===tot?'Va · enviado':'Servido · '+ok+' de '+tot+' enviados. Revisa “Últimos envíos”.');
  state.rp=null;renderReportes();
}
load().catch(e=>{console.error(e);$('#boot .msg').textContent='Atrás · '+(e.message||'fallo')});
</script>
</body>
</html>
