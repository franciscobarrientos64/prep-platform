/* Hoja lateral */

<div class="toasts" id="toasts"></div>

<script>
const SB_URL='https://jmkvphayyhwzootlybde.supabase.co',SB_KEY='sb_publishable_0-znERv1Ok0Dw-Re44eksw_QAOqDc8M',MARCA=(window.PREP_MARCA||'__sin_contexto__'),LOCAL=(window.PREP_LOCAL||'__sin_contexto__');
const sb=supabase.createClient(SB_URL,SB_KEY);
const KIOSCO=new URLSearchParams(location.search).get('kiosco')==='1';
const CFG_DEF={tolerancia_min:5,salida_anticipada_min:10,extra_desde_min:15,falta_tras_min:120,foto_obligatoria:true};
const TIPOS={tardanza:'Tardanza',falta:'Falta',salida_anticipada:'Salida anticipada',horas_extra:'Horas extra',sin_turno:'Sin turno programado',fuera_rango:'Fuera del local',sin_salida:'Sin marcar salida'};
const state={view:KIOSCO?'kiosco':'marcar',me:null,yo:null,esGerencia:false,emp:[],prog:[],asis:[],inc:[],perm:[],usuarios:[],cfg:{...CFG_DEF},gf:null,rango:'semana',desde:null,hasta:null,filtroInc:'pendiente',ultimo:null,channel:null};

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const pad=n=>String(n).padStart(2,'0');
const isoDe=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function addDias(iso,n){const[y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+n);return isoDe(dt)}
// Día operativo: antes de las 6:00 todavía cuenta el turno de la noche anterior.
function diaOp(d=new Date()){const x=new Date(d);if(x.getHours()<6)x.setDate(x.getDate()-1);return isoDe(x)}
function aFecha(iso,hm){const[y,m,d]=iso.split('-').map(Number);const[h,mi]=(hm||'00:00').split(':').map(Number);return new Date(y,m-1,d,h||0,mi||0)}
function hhmm(ts){if(!ts)return'—';const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())}
function fechaCorta(iso){const[y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);return['dom','lun','mar','mié','jue','vie','sáb'][dt.getDay()]+' '+d+'/'+pad(m)}
function minTxt(m){m=Math.round(m||0);if(m<60)return m+' min';return Math.floor(m/60)+'h '+pad(m%60)}
function horasTxt(h){return Number(h||0).toFixed(1)+' h'}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nom(e){return e?((e.nombre||'')+' '+(e.apellidos||'')).trim():'—'}
function ini(e){return((e&&e.nombre||'?')[0]+((e&&e.apellidos)||' ')[0]).toUpperCase()}
const empById=id=>state.emp.find(e=>String(e.id)===String(id));
function avatar(e,cls='av'){return e&&e.foto_url?`<div class="${cls}" style="background-image:url('${esc(e.foto_url)}')"></div>`:`<div class="${cls}">${esc(ini(e))}</div>`}
function toast(m,t=''){const e=document.createElement('div');e.className='toast '+t;const i=t==='ok'?'check_circle':t==='err'?'error':t==='warn'?'warning':'info';e.innerHTML='<span class="material-symbols-outlined">'+i+'</span><span>'+esc(m)+'</span>';$('#toasts').appendChild(e);setTimeout(()=>e.remove(),3600)}
function openSheet(t,html){$('#sheet-title').textContent=t;$('#sheet-body').innerHTML=html;$('#backdrop').classList.add('open');$('#sheet').classList.add('open')}
function closeSheet(){$('#backdrop').classList.remove('open');$('#sheet').classList.remove('open')}
$('#sheet-close').onclick=closeSheet;$('#backdrop').onclick=closeSheet;

/* ---------- rangos ---------- */
function lunes(iso){const[y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()-((dt.getDay()+6)%7));return isoDe(dt)}
function setRango(k){
  const h=diaOp();state.rango=k;const[y,m,d]=h.split('-').map(Number);
  if(k==='semana'){state.desde=lunes(h);state.hasta=h}
  else if(k==='semana_ant'){state.desde=addDias(lunes(h),-7);state.hasta=addDias(lunes(h),-1)}
  else if(k==='quincena'){state.desde=y+'-'+pad(m)+'-'+(d<=15?'01':'16');state.hasta=h}
  else if(k==='mes'){state.desde=y+'-'+pad(m)+'-01';state.hasta=h}
  else if(k==='mes_ant'){const p=new Date(y,m-2,1),u=new Date(y,m-1,0);state.desde=isoDe(p);state.hasta=isoDe(u)}
}

/* ---------- carga ---------- */
async function loadMe(){
  const s=(await sb.auth.getSession()).data.session;if(!s||!s.user)return;
  const{data}=await sb.from('prep_usuarios').select('*').eq('email',s.user.email).maybeSingle();
  state.me=data||{email:s.user.email,rol_sistema:'operativo'};
  const real=['superadmin','admin_marca','gerente'].includes(state.me.rol_sistema);
  let ger=real;
  if(!real&&state.me.permisos){const p=state.me.permisos;ger=['aprobar','admin'].includes(p.asistencia)||['aprobar','admin'].includes(p.rrhh)}
  else if(!real&&state.me.rol_id){const{data:rl}=await sb.from('prep_roles').select('permisos').eq('id',state.me.rol_id).maybeSingle();const p=(rl&&rl.permisos)||{};ger=['aprobar','admin'].includes(p.asistencia)||['aprobar','admin'].includes(p.rrhh)}
  // "Ver como" del super admin manda sobre el rol real
  if(window.PREP_VISTA){const n=(window.prepNivel&&(window.prepNivel('asistencia')||window.prepNivel('rrhh')))||'ninguno';ger=(window.prepEsAdminVista&&window.prepEsAdminVista())||['aprobar','admin'].includes(n)}
  state.esGerencia=ger;
}
async function loadEmp(){const{data}=await sb.from('rrhh_empleados').select('id,nombre,apellidos,rol,area,foto_url,email,estado').eq('local_id',LOCAL).eq('estado','activo').order('nombre');state.emp=data||[];
  const m=state.me;state.yo=null;if(!m)return;
  if(m.empleado_id)state.yo=empById(m.empleado_id)||null;
  if(!state.yo&&m.email)state.yo=state.emp.find(e=>(e.email||'').toLowerCase()===m.email.toLowerCase())||null;
}
async function loadCfg(){
  const[c,g]=await Promise.all([sb.from('rrhh_asis_config').select('*').eq('local_id',LOCAL).maybeSingle(),sb.from('rrhh_geofence').select('*').eq('local_id',LOCAL).maybeSingle()]);
  state.cfg={...CFG_DEF,...(c.data||{})};state.gf=g.data||null;
}
async function loadRango(){
  // Un día antes del rango para capturar turnos nocturnos que cruzan la medianoche.
  const d0=addDias(state.desde,-1),d1=state.hasta;
  let qa=sb.from('rrhh_asistencia').select('*').eq('local_id',LOCAL).gte('fecha',d0).lte('fecha',d1);
  let qp=sb.from('rrhh_programacion').select('*').eq('local_id',LOCAL).gte('fecha',d0).lte('fecha',d1);
  if(!state.esGerencia&&state.yo){qa=qa.eq('empleado_id',state.yo.id);qp=qp.eq('empleado_id',state.yo.id)}
  const[a,p,i,pe]=await Promise.all([qa,qp,
    sb.from('rrhh_incidencias').select('*').eq('local_id',LOCAL).gte('fecha',d0).lte('fecha',d1),
    sb.from('rrhh_permisos').select('empleado_id,fecha_inicio,fecha_fin,tipo,estado').eq('local_id',LOCAL).eq('estado','aprobado').lte('fecha_inicio',d1).gte('fecha_fin',d0)]);
  state.asis=a.data||[];state.prog=(p.data||[]).filter(x=>!['cancelado','anulado'].includes(x.estado));state.inc=i.data||[];state.perm=pe.data||[];
}

/* ---------- motor de puntualidad ---------- */
function ventana(p){const ini=aFecha(p.fecha,p.hora_ini);let fin=aFecha(p.fecha,p.hora_fin);if(fin<=ini)fin.setDate(fin.getDate()+1);return{ini,fin}}
function enPermiso(emp,fecha){return state.perm.some(x=>String(x.empleado_id)===String(emp)&&x.fecha_inicio<=fecha&&x.fecha_fin>=fecha)}
// Evalúa cada turno programado del rango contra lo marcado. Devuelve jornadas (una por turno o por marca sin turno).
function jornadas(desde,hasta,empId){
  const c=state.cfg,now=new Date(),out=[],usadas=new Set();
  const progs=state.prog.filter(p=>p.fecha>=desde&&p.fecha<=hasta&&(!empId||String(p.empleado_id)===String(empId)));
  for(const p of progs){
    const{ini,fin}=ventana(p);
    let a=state.asis.find(x=>!usadas.has(x.id)&&String(x.empleado_id)===String(p.empleado_id)&&x.fecha===p.fecha);
    if(!a)a=state.asis.find(x=>!usadas.has(x.id)&&String(x.empleado_id)===String(p.empleado_id)&&x.hora_entrada&&new Date(x.hora_entrada)>=new Date(ini-4*36e5)&&new Date(x.hora_entrada)<=fin);
    if(a)usadas.add(a.id);
    const j={emp:p.empleado_id,fecha:p.fecha,prog:p,asis:a||null,ini,fin,estado:'pendiente',tarde:0,antes:0,extra:0,horas:0,sinSalida:false,fuera:!!(a&&a.fuera_de_geofence)};
    if(a&&a.hora_entrada){
      const e=new Date(a.hora_entrada),diff=(e-ini)/6e4;
      j.estado=diff>c.tolerancia_min?'tarde':'a_tiempo';if(j.estado==='tarde')j.tarde=Math.round(diff);
      if(a.hora_salida){const s=new Date(a.hora_salida);j.horas=Number(a.horas_trabajadas)||((s-e)/36e5);
        const an=(fin-s)/6e4;if(an>c.salida_anticipada_min)j.antes=Math.round(an);
        const ex=(s-fin)/6e4;if(ex>c.extra_desde_min)j.extra=Math.round(ex);
      }else{j.horas=(now-e)/36e5;if(now>new Date(+fin+4*36e5)){j.sinSalida=true}else j.enCurso=true}
    }else if(enPermiso(p.empleado_id,p.fecha))j.estado='permiso';
    else if(now>new Date(+ini+c.falta_tras_min*6e4))j.estado='falta';
    out.push(j);
  }
  for(const a of state.asis){
    if(usadas.has(a.id)||a.fecha<desde||a.fecha>hasta||(empId&&String(a.empleado_id)!==String(empId)))continue;
    const e=a.hora_entrada?new Date(a.hora_entrada):null,s=a.hora_salida?new Date(a.hora_salida):null;
    out.push({emp:a.empleado_id,fecha:a.fecha,prog:null,asis:a,estado:'sin_turno',tarde:0,antes:0,extra:0,horas:Number(a.horas_trabajadas)||(e&&s?(s-e)/36e5:0),sinSalida:!!(e&&!s&&new Date()-e>16*36e5),enCurso:!!(e&&!s&&new Date()-e<=16*36e5),fuera:!!a.fuera_de_geofence});
  }
  return out.sort((x,y)=>x.fecha<y.fecha?1:x.fecha>y.fecha?-1:(x.ini||0)-(y.ini||0));
}
function incidenciasDe(js){
  const r=[];
  for(const j of js){
    const add=(tipo,min)=>{const res=state.inc.find(i=>String(i.empleado_id)===String(j.emp)&&i.fecha===j.fecha&&i.tipo===tipo);r.push({j,tipo,minutos:min,res,estado:res?res.estado:'pendiente'})};
    if(j.estado==='tarde')add('tardanza',j.tarde);
    if(j.estado==='falta')add('falta',null);
    if(j.antes)add('salida_anticipada',j.antes);
    if(j.extra)add('horas_extra',j.extra);
    if(j.estado==='sin_turno')add('sin_turno',null);
    if(j.fuera)add('fuera_rango',j.asis&&j.asis.distancia_m_entrada);
    if(j.sinSalida)add('sin_salida',null);
  }
  return r;
}
function resumen(js){
  const r={turnos:0,asistio:0,faltas:0,permisos:0,tardanzas:0,minTarde:0,antes:0,horas:0,extraMin:0,extraAprob:0,aTiempo:0};
  for(const j of js){
    if(j.prog&&j.estado!=='pendiente'){r.turnos++}
    if(j.asis&&j.asis.hora_entrada)r.asistio++;
    if(j.estado==='falta')r.faltas++;if(j.estado==='permiso')r.permisos++;
    if(j.estado==='tarde'){r.tardanzas++;r.minTarde+=j.tarde}
    if(j.estado==='a_tiempo')r.aTiempo++;
    if(j.antes)r.antes++;r.horas+=j.horas||0;
    if(j.extra){r.extraMin+=j.extra;const res=state.inc.find(i=>String(i.empleado_id)===String(j.emp)&&i.fecha===j.fecha&&i.tipo==='horas_extra');if(res&&res.estado==='aprobada')r.extraAprob+=j.extra}
  }
  const conMarca=r.aTiempo+r.tardanzas;
  r.puntualidad=conMarca?Math.round(r.aTiempo/conMarca*100):null;
  const exig=r.turnos-r.permisos;r.asistencia=exig>0?Math.round((exig-r.faltas)/exig*100):null;
  return r;
}
function badgeJ(j){
  if(j.enCurso&&j.estado!=='tarde')return'<span class="badge b-curso">Trabajando</span>';
  return{a_tiempo:'<span class="badge b-ok">A tiempo</span>',tarde:`<span class="badge b-tarde">Tarde ${j.tarde} min</span>`,falta:'<span class="badge b-falta">Falta</span>',permiso:'<span class="badge b-info">Permiso</span>',pendiente:'<span class="badge b-pend">Aún no marca</span>',sin_turno:'<span class="badge b-warn">Sin turno</span>'}[j.estado]||'';
}
const pctCls=p=>p==null?'':p>=95?'good':p>=85?'mid':'bad';

/* ---------- cámara + ubicación ---------- */
function distM(a1,o1,a2,o2){const R=6371000,r=x=>x*Math.PI/180;const dA=r(a2-a1),dO=r(o2-o1);const s=Math.sin(dA/2)**2+Math.cos(r(a1))*Math.cos(r(a2))*Math.sin(dO/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
function getPos(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),()=>res(null),{enableHighAccuracy:true,timeout:9000,maximumAge:30000})})}
function selfie(titulo,permitirSinFoto){
  return new Promise(async resolve=>{
    const ov=document.createElement('div');ov.className='overlay';
    ov.innerHTML=`<div class="mono" style="font-size:14px;max-width:340px">${esc(titulo)}</div><video autoplay playsinline muted></video><div id="camerr" class="mono" style="font-size:12px;opacity:.8"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" data-a="snap"><span class="material-symbols-outlined">photo_camera</span>Tomar foto</button>${permitirSinFoto?'<button class="btn" data-a="skip">Sin foto</button>':''}<button class="btn" data-a="cancel">Cancelar</button></div>`;
    document.body.appendChild(ov);const v=ov.querySelector('video');let st=null;
    try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});v.srcObject=st}catch(e){ov.querySelector('#camerr').textContent='No se pudo abrir la cámara. Revisa el permiso de cámara del navegador.'}
    const fin=r=>{if(st)st.getTracks().forEach(t=>t.stop());ov.remove();resolve(r)};
    ov.onclick=e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;
      if(k==='cancel')return fin({cancel:true});if(k==='skip')return fin({blob:null});
      if(!v.videoWidth){toast('La cámara aún no está lista','warn');return}
      const cv=document.createElement('canvas');const w=Math.min(720,v.videoWidth);cv.width=w;cv.height=Math.round(v.videoHeight*w/v.videoWidth);
      const x=cv.getContext('2d');x.translate(cv.width,0);x.scale(-1,1);x.drawImage(v,0,0,cv.width,cv.height);
      cv.toBlob(b=>fin({blob:b}),'image/jpeg',.8)};
  });
}
function turnoAhora(empId){
  const now=new Date(),h=diaOp();
  const ps=state.prog.filter(p=>String(p.empleado_id)===String(empId)&&(p.fecha===h||p.fecha===addDias(h,-1)||p.fecha===addDias(h,1)));
  let best=null,bd=1e15;
  for(const p of ps){const{ini,fin}=ventana(p);if(now>=new Date(+ini-3*36e5)&&now<=new Date(+fin+3*36e5)){const d=Math.abs(now-ini);if(d<bd){bd=d;best=p}}}
  return best||state.prog.find(p=>String(p.empleado_id)===String(empId)&&p.fecha===h)||null;
}
function abierta(empId){const lim=Date.now()-20*36e5;return state.asis.filter(a=>String(a.empleado_id)===String(empId)&&a.hora_entrada&&!a.hora_salida&&new Date(a.hora_entrada).getTime()>lim).sort((a,b)=>new Date(b.hora_entrada)-new Date(a.hora_entrada))[0]||null}

async function marcar(empId,origen){
  const e=empById(empId);const ab=abierta(empId);const tipo=ab?'salida':'entrada';
  const cap=await selfie((tipo==='entrada'?'Entrada':'Salida')+' · '+nom(e)+' · mira a la cámara',!state.cfg.foto_obligatoria||origen==='gerencia');
  if(cap.cancel)return null;
  const pos=await getPos();const gf=state.gf;let fuera=false,dist=null;
  if(pos&&gf&&gf.activa&&gf.lat){dist=Math.round(distM(pos.lat,pos.lng,Number(gf.lat),Number(gf.lng)));fuera=dist>(gf.radio_m||100)}
  if(fuera&&gf.estricta&&origen!=='gerencia'){toast('Atrás · estás a '+dist+' m del local. Marca cuando llegues.','err');return null}
  if(!pos&&gf&&gf.activa&&gf.estricta&&origen!=='gerencia'){toast('Atrás · activa la ubicación del celular para marcar.','err');return null}
  let foto=null;
  if(cap.blob){const path=LOCAL+'/'+empId+'/'+tipo+'_'+Date.now()+'.jpg';const up=await sb.storage.from('rrhh-files').upload(path,cap.blob,{contentType:'image/jpeg',upsert:true});if(!up.error)foto=path;else toast('La foto no subió; se marca igual','warn')}
  const ahora=new Date();
  if(tipo==='entrada'){
    const p=turnoAhora(empId);
    const row={empleado_id:empId,local_id:LOCAL,fecha:p?p.fecha:diaOp(ahora),hora_entrada:ahora.toISOString(),tipo:'normal',foto_entrada_url:foto,metodo_verif:foto?'foto':'manual',lat_entrada:pos?pos.lat:null,lng_entrada:pos?pos.lng:null,fuera_de_geofence:fuera,distancia_m_entrada:dist,origen};
    const{data,error}=await sb.from('rrhh_asistencia').insert(row).select().single();
    if(error){toast('Atrás: '+error.message,'err');return null}
    state.asis.push(data);if(p&&!state.prog.includes(p))state.prog.push(p);
    let estado='sin_turno',min=0;if(p){const{ini}=ventana(p);min=Math.round((ahora-ini)/6e4);estado=min>state.cfg.tolerancia_min?'tarde':'a_tiempo'}
    return{tipo,hora:ahora,estado,min,fuera,dist,emp:e};
  }else{
    const horas=Math.max(0,(ahora-new Date(ab.hora_entrada))/36e5);
    const{data,error}=await sb.from('rrhh_asistencia').update({hora_salida:ahora.toISOString(),horas_trabajadas:Number(horas.toFixed(2)),foto_salida_url:foto,lat_salida:pos?pos.lat:null,lng_salida:pos?pos.lng:null}).eq('id',ab.id).select().single();
    if(error){toast('Atrás: '+error.message,'err');return null}
    Object.assign(ab,data);
    return{tipo,hora:ahora,horas,fuera,dist,emp:e};
  }
}

  const filas=state.emp.map(e=>({e,r:resumen(js.filter(j=>String(j.emp)===String(e.id)))})).filter(x=>x.r.turnos||x.r.asistio).sort((a,b)=>(a.r.puntualidad??101)-(b.r.puntualidad??101));
  const R=[['semana','Esta semana'],['semana_ant','Semana pasada'],['quincena','Quincena'],['mes','Este mes'],['mes_ant','Mes pasado']];
  $('#screen').innerHTML=`<div class="toolbar">${R.map(([k,l])=>`<button class="chip ${state.rango===k?'active':''}" data-r="${k}">${l}</button>`).join('')}
      <input type="date" class="input" id="r-d" value="${state.desde}" style="width:auto"><input type="date" class="input" id="r-h" value="${state.hasta}" style="width:auto">
      <button class="mini primary" id="r-csv"><span class="material-symbols-outlined" style="font-size:16px">download</span>Excel (CSV)</button></div>
    <div class="kpis">
      <div class="kpi ${pctCls(tot.puntualidad)}"><div class="v">${tot.puntualidad==null?'—':tot.puntualidad+'%'}</div><div class="l">Puntualidad del equipo</div></div>
      <div class="kpi ${pctCls(tot.asistencia)}"><div class="v">${tot.asistencia==null?'—':tot.asistencia+'%'}</div><div class="l">Asistencia</div></div>
      <div class="kpi ${tot.tardanzas?'mid':''}"><div class="v">${tot.tardanzas}</div><div class="l">Tardanzas · ${minTxt(tot.minTarde)}</div></div>
      <div class="kpi ${tot.faltas?'bad':''}"><div class="v">${tot.faltas}</div><div class="l">Faltas</div></div>
      <div class="kpi"><div class="v">${minTxt(tot.extraMin)}</div><div class="l">Horas extra · ${minTxt(tot.extraAprob)} aprobadas</div></div>
      <div class="kpi"><div class="v">${Math.round(tot.horas)}</div><div class="l">Horas trabajadas</div></div>
    </div>
    ${filas.length?`<div class="tw"><table><thead><tr><th>Persona</th><th>Turnos</th><th>Asistió</th><th>Faltas</th><th>Tardanzas</th><th>Min. tarde</th><th>Salidas antic.</th><th>Horas</th><th>Extra</th><th>Puntualidad</th></tr></thead><tbody>
      ${filas.map(({e,r})=>`<tr data-emp="${esc(e.id)}"><td>${esc(nom(e))}</td><td>${r.turnos}</td><td>${r.asistio}</td><td>${r.faltas||'—'}</td><td>${r.tardanzas||'—'}</td><td>${r.minTarde?minTxt(r.minTarde):'—'}</td><td>${r.antes||'—'}</td><td>${r.horas.toFixed(1)}</td><td>${r.extraMin?minTxt(r.extraMin):'—'}</td><td><span class="badge ${r.puntualidad==null?'b-pend':r.puntualidad>=95?'b-ok':r.puntualidad>=85?'b-tarde':'b-falta'}">${r.puntualidad==null?'—':r.puntualidad+'%'}</span></td></tr>`).join('')}
      </tbody></table></div>`:'<div class="card empty"><span class="material-symbols-outlined">event_note</span>No hay turnos ni marcas en este rango.</div>'}
    <p class="mono" style="font-size:11px;opacity:.65;margin-top:10px">Tolerancia ${state.cfg.tolerancia_min} min · falta si no marca ${state.cfg.falta_tras_min} min después del inicio · horas extra desde ${state.cfg.extra_desde_min} min después del fin del turno. Se cambia en Ajustes.</p>`;
  $$('[data-r]').forEach(b=>b.onclick=async()=>{setRango(b.dataset.r);await loadRango();render()});
  const cust=async()=>{const d=$('#r-d').value,h=$('#r-h').value;if(!d||!h||d>h)return;state.rango='custom';state.desde=d;state.hasta=h;await loadRango();render()};
  $('#r-d').onchange=cust;$('#r-h').onchange=cust;
  $('#r-csv').onclick=()=>exportarCSV(js,filas);
  $$('tbody tr[data-emp]').forEach(tr=>tr.onclick=()=>detalleEmp(tr.dataset.emp,js));
}
function detalleEmp(id,js){
  const e=empById(id);const mj=js.filter(j=>String(j.emp)===String(id));const r=resumen(mj);
  openSheet(nom(e),`<div class="kpis" style="margin:0"><div class="kpi ${pctCls(r.puntualidad)}"><div class="v">${r.puntualidad==null?'—':r.puntualidad+'%'}</div><div class="l">Puntualidad</div></div><div class="kpi"><div class="v">${r.tardanzas}</div><div class="l">Tardanzas</div></div><div class="kpi ${r.faltas?'bad':''}"><div class="v">${r.faltas}</div><div class="l">Faltas</div></div></div>
    <div class="hist">${mj.map(j=>`<div class="r"><span class="mono">${fechaCorta(j.fecha)}</span><span class="mono" style="opacity:.75;font-size:12px">${j.prog?esc(j.prog.hora_ini)+'–'+esc(j.prog.hora_fin):'sin turno'} · ${j.asis?hhmm(j.asis.hora_entrada)+'–'+hhmm(j.asis.hora_salida):'sin marca'}</span>${badgeJ(j)}</div>`).join('')||'<div class="empty">Sin jornadas en el rango.</div>'}</div>`);
}
function exportarCSV(js,filas){
  const L=[['Persona','Fecha','Turno inicio','Turno fin','Entrada','Salida','Estado','Min. tarde','Salida anticipada (min)','Horas extra (min)','Horas trabajadas','Fuera del local']];
  for(const j of js){const e=empById(j.emp);L.push([nom(e),j.fecha,j.prog?j.prog.hora_ini:'',j.prog?j.prog.hora_fin:'',j.asis?hhmm(j.asis.hora_entrada):'',j.asis?hhmm(j.asis.hora_salida):'',{a_tiempo:'A tiempo',tarde:'Tarde',falta:'Falta',permiso:'Permiso',pendiente:'Pendiente',sin_turno:'Sin turno'}[j.estado]||j.estado,j.tarde||'',j.antes||'',j.extra||'',(j.horas||0).toFixed(2).replace('.',','),j.fuera?'Sí':''])}
  L.push([]);L.push(['Resumen','Turnos','Asistió','Faltas','Tardanzas','Min. tarde','Horas','Extra (min)','Puntualidad %']);
  for(const{e,r}of filas)L.push([nom(e),r.turnos,r.asistio,r.faltas,r.tardanzas,r.minTarde,r.horas.toFixed(2).replace('.',','),r.extraMin,r.puntualidad??'']);
  const csv='﻿'+L.map(f=>f.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='asistencia_'+state.desde+'_'+state.hasta+'.csv';document.body.appendChild(a);a.click();a.remove();
}

function vIncidencias(){
  const all=incidenciasDe(jornadas(state.desde,state.hasta));
  const F=[['pendiente','Pendientes'],['todas','Todas'],['tardanza','Tardanzas'],['falta','Faltas'],['horas_extra','Horas extra']];
  const f=state.filtroInc;
  const lista=all.filter(i=>f==='todas'?true:f==='pendiente'?i.estado==='pendiente':i.tipo===f);
  $('#screen').innerHTML=`<div class="toolbar">${F.map(([k,l])=>`<button class="chip ${f===k?'active':''}" data-f="${k}">${l}</button>`).join('')}<span class="mono" style="font-size:11px;opacity:.65;margin-left:auto">${fechaCorta(state.desde)} → ${fechaCorta(state.hasta)} · cambia el rango en Reporte</span></div>
    ${lista.length?lista.map((i,ix)=>{const e=empById(i.j.emp);const est={pendiente:'b-pend',justificada:'b-info',aprobada:'b-ok',rechazada:'b-falta'}[i.estado];
      return`<div class="row">${avatar(e)}<div class="info"><b>${esc(nom(e))}</b><div class="m">${fechaCorta(i.j.fecha)} · ${TIPOS[i.tipo]}${i.minutos?' · '+(i.tipo==='fuera_rango'?i.minutos+' m':minTxt(i.minutos)):''}${i.res&&i.res.motivo?' · "'+esc(i.res.motivo)+'"':''}</div></div>
      <div class="acts"><span class="badge ${est}">${i.estado}</span>${i.estado==='pendiente'?`${i.tipo==='horas_extra'?`<button class="mini ok" data-i="${ix}" data-a="aprobada">Aprobar</button>`:`<button class="mini" data-i="${ix}" data-a="justificada">Justificar</button>`}<button class="mini danger" data-i="${ix}" data-a="rechazada">${i.tipo==='horas_extra'?'Rechazar':'Sin justificar'}</button>`:`<button class="mini ghost" data-i="${ix}" data-a="pendiente">Reabrir</button>`}</div></div>`}).join(''):'<div class="card empty"><span class="material-symbols-outlined">task_alt</span>Sin incidencias en este filtro.</div>'}`;
  $$('[data-f]').forEach(b=>b.onclick=()=>{state.filtroInc=b.dataset.f;render()});
  $$('[data-i]').forEach(b=>b.onclick=()=>resolver(lista[+b.dataset.i],b.dataset.a));
}
function resolver(i,estado){
  const e=empById(i.j.emp);
  const guardar=async motivo=>{
    const row={marca_id:MARCA,local_id:LOCAL,empleado_id:String(i.j.emp),fecha:i.j.fecha,tipo:i.tipo,minutos:i.minutos||null,estado,motivo:motivo||null,resuelto_por:estado==='pendiente'?null:(state.me&&(state.me.nombre||state.me.email)),resuelto_at:estado==='pendiente'?null:new Date().toISOString()};
    const{data,error}=await sb.from('rrhh_incidencias').upsert(row,{onConflict:'empleado_id,fecha,tipo'}).select().single();
    if(error){toast('Atrás: '+error.message,'err');return}
    state.inc=state.inc.filter(x=>x.id!==data.id&&!(String(x.empleado_id)===String(data.empleado_id)&&x.fecha===data.fecha&&x.tipo===data.tipo));state.inc.push(data);
    closeSheet();toast('Servido','ok');render();
  };
  if(estado!=='justificada'){guardar(null);return}
  openSheet('Justificar',`<div><b>${esc(nom(e))}</b><div class="mono" style="font-size:12px;opacity:.7">${fechaCorta(i.j.fecha)} · ${TIPOS[i.tipo]}</div></div>
    <div><label class="lbl" for="j-mot">Motivo</label><textarea id="j-mot" class="input" rows="3" placeholder="Ej. descanso médico, cambio de turno coordinado, tráfico por cierre del teleférico"></textarea></div>
    <button class="btn primary" id="j-ok">Va, justificar</button>`);
  $('#j-ok').onclick=()=>{const m=$('#j-mot').value.trim();if(!m){toast('Escribe el motivo','warn');return}guardar(m)};
}

async function vAjustes(){
  const c=state.cfg,g=state.gf||{lat:'',lng:'',radio_m:100,estricta:false,activa:true};
  if(!state.usuarios.length){const{data}=await sb.from('prep_usuarios').select('id,email,nombre,empleado_id,local_id,rol_sistema').eq('local_id',LOCAL).eq('activo',true);state.usuarios=(data||[]).filter(u=>u.rol_sistema!=='superadmin')}
  const kioscoUrl=location.origin+'/asistencia?kiosco=1';
  $('#screen').innerHTML=`<div class="grid2">
    <div class="card"><div class="sec-t" style="margin-top:0"><span class="material-symbols-outlined">timer</span>Reglas de puntualidad</div>
      <div class="grid2">
        <div><label class="lbl" for="c-tol">Tolerancia (min)</label><input class="input" id="c-tol" type="number" min="0" value="${c.tolerancia_min}"></div>
        <div><label class="lbl" for="c-falta">Falta si no marca tras (min)</label><input class="input" id="c-falta" type="number" min="15" value="${c.falta_tras_min}"></div>
        <div><label class="lbl" for="c-antes">Salida anticipada desde (min)</label><input class="input" id="c-antes" type="number" min="0" value="${c.salida_anticipada_min}"></div>
        <div><label class="lbl" for="c-extra">Horas extra desde (min)</label><input class="input" id="c-extra" type="number" min="0" value="${c.extra_desde_min}"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px"><input type="checkbox" id="c-foto" ${c.foto_obligatoria?'checked':''}> Foto obligatoria al marcar desde el celular o el kiosco</label>
      <button class="btn primary" id="c-save" style="margin-top:14px">Guardar reglas</button></div>
    <div class="card"><div class="sec-t" style="margin-top:0"><span class="material-symbols-outlined">location_on</span>Ubicación del local</div>
      <div class="grid2">
        <div><label class="lbl" for="g-lat">Latitud</label><input class="input" id="g-lat" value="${g.lat??''}"></div>
        <div><label class="lbl" for="g-lng">Longitud</label><input class="input" id="g-lng" value="${g.lng??''}"></div>
        <div><label class="lbl" for="g-rad">Radio permitido (m)</label><input class="input" id="g-rad" type="number" min="20" value="${g.radio_m||100}"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px"><input type="checkbox" id="g-act" ${g.activa?'checked':''}> Validar ubicación al marcar</label>
      <label style="display:flex;gap:8px;align-items:center;margin-top:6px;font-size:14px"><input type="checkbox" id="g-est" ${g.estricta?'checked':''}> Bloquear la marca fuera del radio</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn" id="g-aqui"><span class="material-symbols-outlined">my_location</span>Usar mi ubicación</button><button class="btn primary" id="g-save">Guardar ubicación</button></div></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="sec-t" style="margin-top:0"><span class="material-symbols-outlined">tablet</span>Kiosco en el local</div>
    <p style="font-size:14px;max-width:65ch">Deja una tablet en la entrada con la sesión de gerencia abierta en este enlace. El equipo toca su nombre y se toma la foto. Sirve para quien no tiene celular con datos.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center"><code class="mono" style="padding:8px 10px;border:2px dashed var(--outline);border-radius:10px;font-size:12px;word-break:break-all">${esc(kioscoUrl)}</code><button class="mini" id="k-copy">Copiar</button><a class="mini primary" href="/asistencia?kiosco=1" target="_blank">Abrir</a></div></div>
  <div class="card" style="margin-top:14px"><div class="sec-t" style="margin-top:0"><span class="material-symbols-outlined">link</span>Vincular usuarios con su ficha</div>
    <p style="font-size:14px;max-width:65ch;margin-bottom:10px">Para marcar desde su celular, cada persona entra con su usuario de Prep! y ese usuario tiene que estar unido a su ficha del equipo.</p>
    ${state.usuarios.length?state.usuarios.map(u=>`<div class="row"><div class="info"><b>${esc(u.nombre||u.email)}</b><div class="m">${esc(u.email)}</div></div><select class="select" style="width:auto;min-width:200px" data-u="${esc(u.id)}" aria-label="Ficha de ${esc(u.nombre||u.email)}"><option value="">— sin vincular —</option>${state.emp.map(e=>`<option value="${esc(e.id)}" ${String(u.empleado_id)===String(e.id)?'selected':''}>${esc(nom(e))}</option>`).join('')}</select></div>`).join(''):'<div class="empty">No hay usuarios en este local.</div>'}
  </div>`;
  $('#c-save').onclick=async()=>{const row={local_id:LOCAL,marca_id:MARCA,tolerancia_min:+$('#c-tol').value||0,falta_tras_min:+$('#c-falta').value||120,salida_anticipada_min:+$('#c-antes').value||0,extra_desde_min:+$('#c-extra').value||0,foto_obligatoria:$('#c-foto').checked,updated_at:new Date().toISOString()};
    const{error}=await sb.from('rrhh_asis_config').upsert(row,{onConflict:'local_id'});if(error){toast('Atrás: '+error.message,'err');return}state.cfg={...CFG_DEF,...row};toast('Servido · reglas guardadas','ok')};
  // Ubicación del local: dice por qué falló (permiso, GPS apagado, tiempo) y reintenta con menos precisión.
  const leerPos=(alta,ms)=>new Promise((ok,ko)=>navigator.geolocation.getCurrentPosition(ok,ko,{enableHighAccuracy:alta,timeout:ms,maximumAge:0}));
  $('#g-aqui').onclick=async()=>{
    if(!navigator.geolocation){toast('Este navegador no da la ubicación. Pega las coordenadas de Google Maps.','err');return}
    if(!window.isSecureContext){toast('La ubicación solo funciona en https://casa-italia.prep.rest','err');return}
    const b=$('#g-aqui');b.disabled=true;b.lastChild.textContent='Oído · buscando GPS…';
    let p=null,err=null;
    try{p=await leerPos(true,20000)}catch(e){err=e;if(e.code!==1){try{p=await leerPos(false,15000);err=null}catch(e2){err=e2}}}
    b.disabled=false;b.lastChild.textContent='Usar mi ubicación';
    if(!p){const m=err&&err.code===1?'Atrás · el permiso de ubicación está bloqueado. Actívalo para esta página (candado junto a la dirección › Ubicación › Permitir) y en el celular: Ajustes › Privacidad › Localización encendida para el navegador.'
      :err&&err.code===3?'Atrás · el GPS tardó demasiado. Sal a la puerta y vuelve a intentar.':'Atrás · no se pudo leer la ubicación. Revisa que el GPS esté encendido.';
      toast(m,'err');return}
    $('#g-lat').value=p.coords.latitude.toFixed(6);$('#g-lng').value=p.coords.longitude.toFixed(6);
    const acc=Math.round(p.coords.accuracy);toast('Ubicación tomada · precisión '+acc+' m'+(acc>50?' (poca: intenta de nuevo cerca de la puerta)':''),acc>50?'warn':'ok')};
  // Si pegan "-10.57, -75.40" (copiado de Google Maps) en latitud, se separa solo
  $('#g-lat').addEventListener('input',e=>{const m=e.target.value.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);if(m){e.target.value=m[1];$('#g-lng').value=m[2];}});
  $('#g-save').onclick=async()=>{const lat=parseFloat($('#g-lat').value),lng=parseFloat($('#g-lng').value);if(isNaN(lat)||isNaN(lng)){toast('Falta latitud o longitud','warn');return}
    const row={local_id:LOCAL,lat,lng,radio_m:+$('#g-rad').value||100,activa:$('#g-act').checked,estricta:$('#g-est').checked};
    const{data,error}=await sb.from('rrhh_geofence').upsert(row,{onConflict:'local_id'}).select().single();if(error){toast('Atrás: '+error.message,'err');return}state.gf=data;toast('Servido · ubicación guardada','ok')};
  $('#k-copy').onclick=async()=>{try{await navigator.clipboard.writeText(kioscoUrl);toast('Enlace copiado','ok')}catch(e){toast('No se pudo copiar','warn')}};
  $$('[data-u]').forEach(s=>s.onchange=async()=>{const{error}=await sb.from('prep_usuarios').update({empleado_id:s.value||null}).eq('id',s.dataset.u);if(error){toast('Atrás: '+error.message,'err');return}const u=state.usuarios.find(x=>x.id===s.dataset.u);if(u)u.empleado_id=s.value||null;toast('Servido · vínculo guardado','ok')});
}

/* ---------- realtime + arranque ---------- */
function subscribe(){if(state.channel)sb.removeChannel(state.channel);state.channel=sb.channel('asis_'+LOCAL).on('postgres_changes',{event:'*',schema:'public',table:'rrhh_asistencia',filter:'local_id=eq.'+LOCAL},async()=>{await loadRango();if(['hoy','kiosco','reporte'].includes(state.view))render()}).subscribe()}
(async function init(){
  try{
    setRango('semana');
    await loadMe();
    if(KIOSCO&&!state.esGerencia){$('#screen').innerHTML='<div class="card empty"><span class="material-symbols-outlined">lock</span>El modo kiosco se abre con una sesión de gerencia.</div>';return}
    await Promise.all([loadEmp(),loadCfg()]);
    await loadRango();
    if(state.esGerencia&&!KIOSCO&&!state.yo)state.view='hoy';
    render();subscribe();
    setInterval(()=>{if(['hoy','kiosco'].includes(state.view)&&!document.querySelector('.overlay'))render()},60000);
  }catch(e){console.error(e);$('#screen').innerHTML='<div class="card empty"><span class="material-symbols-outlined">error</span>Atrás · no se pudo cargar la asistencia. Revisa la conexión y recarga.</div>'}
  finally{$('#boot').classList.add('gone')}
})();
</script>
